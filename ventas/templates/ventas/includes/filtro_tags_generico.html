{% comment %}
Filtro tags genérico — reutiliza tags_filter.mjs.
variant: light (default) | dark; wide=1; full=1; equal=1.
{% endcomment %}
{% with fid=field_id|default:"campo" %}
{% with v=variant|default:"light" %}
<div class="relative z-20 flex min-w-0 flex-col gap-0.5 overflow-visible {% if full %}w-full{% elif wide %}min-w-[12rem] flex-1 basis-full sm:min-w-[18rem] lg:min-w-[24rem] lg:max-w-none{% elif equal %}w-full{% else %}min-w-[10rem] sm:min-w-[11rem] sm:max-w-xs{% endif %}">
    {% if v == "dark" %}
    <span class="text-[10px] font-medium text-slate-400">{{ label }}</span>
    {% else %}
    <label for="{{ fid }}_search" class="text-[10px] font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">{{ label }}</label>
    {% endif %}
    <div class="relative overflow-visible">
        <select name="{{ fid }}" id="{{ fid }}" multiple class="hidden" data-tags-field="{{ fid }}">
            {% for item in catalogo %}
            <option value="{{ item.value }}" {% if item.value in incluidos %}selected{% endif %}>{{ item.label }}</option>
            {% endfor %}
        </select>
        <div id="{{ fid }}_tags_container"
             class="tags-filter-container relative flex min-h-8 flex-wrap items-center gap-1 overflow-visible rounded-lg px-2 py-1 shadow-sm focus-within:ring-2 {% if wide or equal or full %}w-full{% endif %} {% if v == 'dark' %}border border-slate-600 bg-slate-700 focus-within:border-purple-400 focus-within:ring-purple-500/40{% else %}border border-slate-300 bg-white focus-within:border-purple-500 focus-within:ring-purple-500/25 dark:border-slate-600 dark:bg-slate-800{% endif %}">
            <div class="tags-chips flex min-w-0 flex-1 flex-wrap items-center gap-1"></div>
            <input type="text" id="{{ fid }}_search"
                   class="tags-input {% if wide or full %}min-w-[6rem] basis-[6rem]{% else %}min-w-[4rem]{% endif %} flex-shrink-0 flex-grow border-none bg-transparent text-[11px] outline-none {% if v == 'dark' %}text-white placeholder:text-slate-400{% else %}text-slate-800 placeholder:text-slate-400 dark:text-slate-100 dark:placeholder:text-slate-500{% endif %}"
                   placeholder="{{ placeholder|default:'Buscar…' }}" autocomplete="off"
                   aria-label="{{ label }}" aria-controls="{{ fid }}_dropdown" aria-expanded="false">
            <div id="{{ fid }}_dropdown"
                 role="listbox"
                 class="tags-dropdown absolute left-0 right-0 top-[calc(100%+0.25rem)] z-[250] hidden max-h-52 overflow-y-auto rounded-md border shadow-lg {% if v == 'dark' %}border-slate-600 bg-slate-800 text-slate-100{% else %}border-slate-200 bg-white text-slate-800 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100{% endif %}"
                 {% if v == 'dark' %}data-tags-theme="dark"{% endif %}></div>
        </div>
    </div>
</div>
{% endwith %}
{% endwith %}
