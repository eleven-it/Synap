<!DOCTYPE html>
<html lang="es" x-data="{ openMenu: false, openUserMenu: false }" @click.away="openMenu = false; openUserMenu = false">
<head>
    <meta charset="UTF-8">
    <title>Synap</title>
    {% load static %}
    {% load i18n %}
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .gradient-icon {
            background: linear-gradient(90deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-gradient-to-r from-purple-600 to-blue-500 text-white shadow w-full fixed top-0 left-0 z-40 h-16 flex items-center">
        {% include 'partials/navbar.html' %}
    </header>
    <div class="flex pt-16 min-h-screen">
        {% block sidebar %}
        {% endblock sidebar %}
        <main class="flex-1 p-6">
            {% block content %}{% endblock content %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
</body>
</html>
