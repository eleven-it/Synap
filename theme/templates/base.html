<!DOCTYPE html>
<html lang="es" x-data="{ openMenu: false, openUserMenu: false }" @click.away="openMenu = false; openUserMenu = false" class="bg-gray-100 dark:bg-gray-900">
<head>
    <meta charset="UTF-8">
    <title>Synap</title>
    {% load static %}
    {% load i18n %}
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .gradient-icon {
            background: linear-gradient(90deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen font-inter">
    <header class="w-full fixed top-0 left-0 z-40 h-16 flex items-center bg-white dark:bg-gray-950 shadow-sm">
        {% include 'partials/navbar.html' %}
    </header>
    <div class="pt-16 min-h-screen w-full">
        <main class="flex-1 p-8 w-full max-w-full">
            {% if empresa_activa.logo %}
              <div class="hidden md:flex w-full justify-center items-center my-8">
                <img src="{{ empresa_activa.logo.url }}" alt="Logo" class="max-h-64 max-w-[22vw] object-contain" style="background: transparent;"/>
              </div>
            {% endif %}
            {% block content %}{% endblock content %}
        </main>
    </div>
    {% block extra_js %}{% endblock %}
    <script>
    // Soporte para dark mode: alterna la clase 'dark' en <html> y guarda preferencia en localStorage
    document.addEventListener('DOMContentLoaded', function() {
      const html = document.documentElement;
      const darkSwitch = document.getElementById('dark-mode-switch');
      // Cargar preferencia previa
      if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark');
        if (darkSwitch) darkSwitch.checked = true;
      } else {
        html.classList.remove('dark');
        if (darkSwitch) darkSwitch.checked = false;
      }
      // Alternar al cambiar el switch
      if (darkSwitch) {
        darkSwitch.addEventListener('change', function() {
          if (darkSwitch.checked) {
            html.classList.add('dark');
            localStorage.setItem('theme', 'dark');
          } else {
            html.classList.remove('dark');
            localStorage.setItem('theme', 'light');
          }
        });
      }
    });
    </script>
</body>
</html>
