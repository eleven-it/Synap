schema: spec-driven

context: |
  Synap: Django 4.2, PostgreSQL (Synap) + MySQL legacy AdministraNET.
  Frontend: Tailwind/Alpine.js (django-tailwind, crispy-tailwind).
  Docker: contenedor `Synap_app` para manage.py, tests y shell.
  Ventas: app `ventas/`; permisos `core/services/administranet_permisos_sistema.py`;
  reportes en app `reports/` (ReportDefinition).
  Tipos legacy: `core.utils.administranet_types`.
  UI canon: reportes `/reports/dashboard/` y MPR `/mpr/`; español obligatorio; modales Synap (sin alert/confirm).

strict_tdd: true

testing:
  strict_tdd: true
  detected: "23/07/2026"
  runner:
    command: "docker exec Synap_app python manage.py test"
    framework: Django TestCase
    alt_command: "docker exec Synap_app pytest"
    alt_framework: pytest + pytest-django
  layers:
    unit:
      available: true
      tool: Django TestCase / pytest
    integration:
      available: true
      tool: pytest-django + factory-boy (marker integration)
    e2e:
      available: false
      tool: "—"
  coverage:
    available: true
    command: "docker exec Synap_app pytest --cov"
  quality:
    linter:
      available: false
      command: "—"
    type_checker:
      available: false
      command: "—"
    formatter:
      available: false
      command: "—"

rules:
  proposal:
    - Referenciar docs/general/SPEC_PRESUPUESTO_VENTAS_SYNAP.md como contrato funcional.
    - UX Synap puede divergir del VB6 cuando mejore usabilidad; paridad en datos y negocio (SPEC §1.3–§1.4).
    - Canon UI operativo (referencia para migraciones y agentes): reportes `/reports/dashboard/<slug>/` y MPR `/mpr/wizard/`, `/mpr/opt/...`; no usar como referencia visual las pantallas de Objetivos de venta ni Presupuestos en `ventas/` hasta rediseño explícito. Spec vigente: `openspec/specs/ui-fuente-verdad-reportes-mpr/spec.md`; cambio archivado: `openspec/changes/archive/2026-05-06-fuente-verdad-ui-reportes-mpr/`.
  specs:
    - Escenarios en español; RFC 2119 (MUST / MUST NOT / SHOULD).
  design:
    - Rutas y archivos concretos del repo Synap; no inventar apps no instaladas.
  apply:
    - Seguir patrones existentes del repo; UI en español.
    - Tests y manage.py siempre vía `docker exec Synap_app`.
    - Tipos MySQL legacy: `core.utils.administranet_types`.
    - UI canon reports/mpr; MUST NOT alert/confirm/prompt nativos.
    tdd: true
    test_command: "docker exec Synap_app python manage.py test"
  verify:
    test_command: "docker exec Synap_app python manage.py test"
    alt_test_command: "docker exec Synap_app pytest"
    coverage_threshold: 0
  archive:
    - Advertir antes de fusionar deltas destructivos (eliminaciones masivas).
