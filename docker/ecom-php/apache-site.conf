<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        # Sintaxis tipo Apache 2.2; en 2.4 hace falta mod_access_compat (activado en el Dockerfile).
        Order allow,deny
        Allow from all
    </Directory>

    # Entrada por defecto al portal mayorista (área migrada a Synap `ecom`)
    RedirectMatch ^/?$ /mayoristapp/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
