{% comment %}
  Card de línea del pedido — mobile (<md).
  Contrato Alpine root: cart.items, money, cambiarCantidad, quitar, itemMuestraUom, cambiarUom, cambiarDescuentoRenglon.
  Touch targets ≥44px (stepper y quitar).
{% endcomment %}
<div class="md:hidden space-y-3" aria-label="Líneas del pedido (vista móvil)">
  <template x-for="it in (cart.items || [])" :key="it.id">
    <article class="pedidos-linea-card">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0 flex-1">
          <h3 class="text-sm font-semibold text-slate-900 dark:text-white leading-snug" x-text="it.descripcion"></h3>
          <p class="mt-0.5 text-xs text-slate-500 dark:text-slate-400" x-text="`${it.alicuota_iva}% IVA`"></p>
          <p x-show="it.promocion_etiqueta"
             class="mt-1 text-[10px] font-semibold text-amber-700 dark:text-amber-400"
             x-text="it.promocion_etiqueta"
             x-cloak></p>
        </div>
        <button type="button"
                @click="quitar(it.id)"
                class="pedidos-linea-card-quitar shrink-0 touch-manipulation"
                :aria-label="`Quitar ${it.descripcion} del pedido`">
          Quitar
        </button>
      </div>

      <div class="mt-3 flex flex-wrap items-center gap-3">
        {% include "ecom/includes/pedidos_uom_selector.html" %}
      </div>

      <div class="mt-3 flex items-center justify-between gap-3">
        {% include "ecom/includes/pedidos_qty_input.html" %}
        <div class="flex items-center gap-2 shrink-0">
          <label class="text-[10px] font-semibold uppercase tracking-wide text-slate-400" :for="`pedidos-desc-renglon-m-${it.id}`">% desc.</label>
          <input :id="`pedidos-desc-renglon-m-${it.id}`"
                 type="number"
                 min="0"
                 max="100"
                 step="0.01"
                 :value="it.porcentaje_descuento"
                 @change="cambiarDescuentoRenglon(it.id, $event.target.value)"
                 class="pedidos-input w-16 text-right text-sm px-2 py-1 tabular-nums min-h-[2.75rem]" />
        </div>
        <div class="text-right shrink-0">
          <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-400">Total línea</p>
          <p class="text-base font-bold text-slate-900 dark:text-white tabular-nums" x-text="money(it.total)"></p>
          <p class="text-xs text-slate-500 dark:text-slate-400 tabular-nums" x-text="`${money(it.precio_unitario_neto)} c/u`"></p>
        </div>
      </div>
    </article>
  </template>
</div>
