{# System Design Synap — módulo Gestión de pedidos (canon reportes slate/sky) #}
<style>
  /* Contenedor fluido (paridad mpr-contenedor-pagina) */
  .pedidos-contenedor-pagina {
    padding-left: 1rem;
    padding-right: 1rem;
  }
  @media (min-width: 640px) {
    .pedidos-contenedor-pagina { padding-left: 1.5rem; padding-right: 1.5rem; }
  }
  @media (min-width: 1024px) {
    .pedidos-contenedor-pagina { padding-left: 3rem; padding-right: 3rem; }
  }

  .pedidos-contenido {
    margin-top: 1.5rem;
  }
  @media (min-width: 640px) {
    .pedidos-contenido { margin-top: 2rem; }
  }

  /* Hero */
  .pedidos-eyebrow {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-weight: 600;
    color: rgb(203 213 225);
    margin-bottom: 0.5rem;
  }
  .pedidos-hero-title {
    font-size: 1.875rem;
    line-height: 2.25rem;
    font-weight: 600;
    color: #fff;
    letter-spacing: -0.025em;
  }
  @media (min-width: 768px) {
    .pedidos-hero-title { font-size: 2.25rem; line-height: 2.5rem; }
  }
  .pedidos-hero-desc {
    margin-top: 0.5rem;
    font-size: 0.875rem;
    color: rgb(203 213 225);
    max-width: 48rem;
  }

  /* Botones pill (canon reportes) */
  .pedidos-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    border-radius: 9999px;
    padding: 0.375rem 0.75rem;
    font-size: 10px;
    font-weight: 600;
    transition: all 0.3s;
  }
  @media (min-width: 640px) {
    .pedidos-btn { gap: 0.5rem; padding: 0.375rem 1rem; font-size: 0.75rem; }
  }
  .pedidos-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgb(14 165 233);
  }
  .pedidos-btn-primary { color: #fff; background: rgb(2 132 199); }
  .pedidos-btn-primary:hover { background: rgb(14 165 233); }
  .pedidos-btn-ghost-sky { color: rgb(14 165 233); background: transparent; }
  .pedidos-btn-ghost-sky:hover { color: rgb(56 189 248); }
  .pedidos-btn-ghost-green { color: rgb(34 197 94); background: transparent; }
  .pedidos-btn-ghost-green:hover { color: rgb(74 222 128); }
  .pedidos-btn-dark { color: #fff; background: rgb(15 23 42); }
  .pedidos-btn-dark:hover { background: rgb(51 65 85); }
  .pedidos-btn-outline-hero {
    color: rgb(71 85 105);
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(148,163,184,0.6);
  }
  .dark .pedidos-btn-outline-hero {
    color: rgb(203 213 225);
    background: rgba(30,41,59,0.4);
  }
  /* @deprecated: único token que conserva acento purple (gradiente sky→indigo→purple).
     Solo para acciones de hero en listados/presupuestos (pantalla completa); PROHIBIDO
     como CTA de venta/masivo — usar .pedidos-btn-primary (sky). */
  .pedidos-btn-gradient {
    color: #fff;
    background: linear-gradient(to right, rgb(14 165 233), rgb(99 102 241), rgb(168 85 247));
    box-shadow: 0 10px 15px -3px rgba(14,165,233,0.3);
  }
  .pedidos-btn-danger { color: #fff; background: rgb(225 29 72); }
  .pedidos-btn-danger:hover { background: rgb(244 63 94); }
  .pedidos-btn-secondary-hero { color: rgb(15 23 42); background: #fff; }
  .pedidos-btn-secondary-hero:hover { background: rgb(241 245 249); }
  .pedidos-btn-search {
    border-radius: 9999px;
    padding: 0.625rem 1.25rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: #fff;
    background: rgb(15 23 42);
  }

  /* Cards */
  .pedidos-card {
    border-radius: 1rem;
    border: 1px solid rgb(226 232 240);
    background: #fff;
    box-shadow: 0 10px 15px -3px rgba(15,23,42,0.08);
  }
  .dark .pedidos-card {
    border-color: rgb(30 41 59);
    background: rgb(15 23 42);
  }
  .pedidos-card-kpi { border-radius: 1rem; padding: 1.5rem; }
  .pedidos-card-cta {
    border-radius: 1rem;
    padding: 1.5rem;
    color: #fff;
    background: linear-gradient(to bottom right, rgb(14 165 233), rgb(79 70 229));
    box-shadow: 0 10px 15px -3px rgba(14,165,233,0.25);
  }
  .pedidos-workspace {
    border-radius: 1.5rem;
    border: 1px solid rgb(226 232 240);
    background: #fff;
    box-shadow: 0 25px 50px -12px rgba(15,23,42,0.15);
    overflow: hidden;
  }
  .dark .pedidos-workspace {
    border-color: rgb(30 41 59);
    background: rgb(15 23 42);
  }

  /* Tabla (canon MPR/opt_list adaptado a pedidos) */
  .pedidos-table-shell { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .pedidos-table {
    width: 100%;
    min-width: 100%;
    font-size: 0.875rem;
    text-align: left;
    border-collapse: collapse;
  }
  .pedidos-table thead tr {
    border-bottom: 1px solid rgb(226 232 240);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: rgb(100 116 139);
  }
  .dark .pedidos-table thead tr { border-color: rgb(51 65 85); color: rgb(148 163 184); }
  .pedidos-table th { padding: 0.75rem 0.75rem 0.75rem 0; font-weight: 600; }
  .pedidos-table tbody tr {
    border-bottom: 1px solid rgb(241 245 249);
    transition: background-color 0.15s;
  }
  .dark .pedidos-table tbody tr { border-color: rgb(30 41 59); }
  .pedidos-table tbody tr:hover { background: rgba(248,250,252,0.8); }
  .dark .pedidos-table tbody tr:hover { background: rgba(30,41,59,0.4); }
  .pedidos-table td { padding: 0.625rem 0.75rem 0.625rem 0; }

  /* Filtros */
  .pedidos-filter-label {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: rgb(100 116 139);
    margin-bottom: 0.375rem;
  }
  .dark .pedidos-filter-label {
    color: rgb(148 163 184);
  }
  .pedidos-input,
  .pedidos-select {
    width: 100%;
    border-radius: 0.75rem;
    border: 1px solid rgb(226 232 240);
    background: #fff;
    font-size: 0.875rem;
    padding: 0.625rem 0.75rem;
  }
  .pedidos-input:focus,
  .pedidos-select:focus {
    outline: none;
    border-color: rgb(14 165 233);
    box-shadow: 0 0 0 3px rgba(14,165,233,0.25);
  }
  .dark .pedidos-input,
  .dark .pedidos-select {
    border-color: rgb(51 65 85);
    background: rgb(15 23 42);
    color: rgb(241 245 249);
  }

  /* Alertas y empty */
  .pedidos-alert-info {
    border-radius: 0.75rem;
    border: 1px solid rgb(186 230 253);
    background: rgb(240 249 255);
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    color: rgb(7 89 133);
  }
  .dark .pedidos-alert-info {
    border-color: rgb(30 58 138);
    background: rgba(12,74,110,0.2);
    color: rgb(186 230 253);
  }
  .pedidos-empty {
    border-radius: 0.75rem;
    border: 1px dashed rgb(226 232 240);
    padding: 4rem 1.5rem;
    text-align: center;
    font-size: 0.875rem;
    color: rgb(100 116 139);
  }
  .dark .pedidos-empty {
    border-color: rgb(51 65 85);
    color: rgb(148 163 184);
  }

  /* Stepper estado / flujo */
  .pedidos-stepper-card {
    border-radius: 1rem;
    padding: 1rem;
    overflow-x: auto;
  }
  .pedidos-stepper {
    display: flex;
    align-items: center;
    min-width: max-content;
    gap: 0;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .pedidos-stepper-label {
    font-size: 10px;
    text-align: center;
    line-height: 1.25;
    max-width: 5.5rem;
  }
  .pedidos-stepper-connector {
    height: 2px;
    width: 2rem;
    margin: 0 0.25rem;
    border-radius: 1px;
  }
  @media (min-width: 640px) {
    .pedidos-stepper-connector { width: 3rem; }
  }

  /* Badges estado */
  .pedidos-badge {
    display: inline-block;
    border-radius: 9999px;
    padding: 0.25rem 0.75rem;
    font-size: 0.75rem;
    font-weight: 600;
  }

  /* Fullscreen (compartido con reportes) */
  body.reports-fullscreen { background-color: #020617; }
  body.reports-fullscreen > header.w-full { display: none !important; }
  body.reports-fullscreen .pt-16 { padding-top: 0 !important; }
  body.reports-fullscreen .app-content .p-8 { padding: 1.5rem !important; }
  body.reports-fullscreen .reports-fullscreen-shadow {
    box-shadow: none !important;
    border-radius: 0 !important;
  }

  /* Compra mayorista — toggle comprobante en hero (paridad armado MPR 1ra/2da) */
  .compra-toggle-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
    width: 100%;
  }
  @media (min-width: 640px) {
    .compra-toggle-wrap { width: auto; }
  }
  .compra-toggle-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: rgb(203 213 225);
  }
  .compra-toggle-shell {
    display: inline-flex;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    border-radius: 0.5rem;
    border-width: 1px;
    border-style: solid;
    padding: 2px;
    touch-action: manipulation;
    -webkit-overflow-scrolling: touch;
    border-color: rgb(14 165 233 / 0.6);
    background: rgb(8 47 73 / 0.35);
  }
  @media (min-width: 640px) {
    .compra-toggle-shell { width: auto; }
  }
  .compra-toggle-shell-pre {
    border-color: rgb(245 158 11 / 0.6);
    background: rgb(69 26 3 / 0.35);
  }
  .compra-toggle-shell-dev {
    border-color: rgb(244 63 94 / 0.6);
    background: rgb(76 5 25 / 0.35);
  }
  .compra-toggle-btn {
    min-height: 2.25rem;
    flex: 1 1 0;
    white-space: nowrap;
    border-radius: 0.375rem;
    padding: 0.375rem 0.75rem;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.25;
    transition: background-color 0.15s, color 0.15s;
    border: none;
    cursor: pointer;
  }
  @media (min-width: 640px) {
    .compra-toggle-btn { flex: none; }
  }
  .compra-toggle-btn-ped-active { background: rgb(2 132 199); color: #fff; }
  .compra-toggle-btn-ped-idle { background: transparent; color: rgb(125 211 252); }
  .compra-toggle-btn-ped-idle:hover { background: rgb(12 74 110 / 0.45); }
  /* Estado activo por defecto (antes de Alpine) */
  .compra-toggle-btn[aria-selected="true"] { background: rgb(2 132 199); color: #fff; }
  .compra-toggle-btn-pre-active { background: rgb(245 158 11); color: rgb(69 26 3); }
  .compra-toggle-btn-pre-idle { background: transparent; color: rgb(253 230 138); }
  .compra-toggle-btn-pre-idle:hover { background: rgb(120 53 15 / 0.4); }
  .compra-toggle-btn-dev-active { background: rgb(244 63 94); color: #fff; }
  .compra-toggle-btn-dev-idle { background: transparent; color: rgb(254 202 202); }
  .compra-toggle-btn-dev-idle:hover { background: rgb(136 19 55 / 0.4); }
  .compra-toggle-btn:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgb(14 165 233);
  }
  .dark .compra-toggle-btn:focus-visible {
    box-shadow: 0 0 0 2px rgb(15 23 42), 0 0 0 4px rgb(56 189 248);
  }

  /* Toggle grande (variant dark) — protagonista en el hero tipo tablero de producción.
     PED activo sky-600 (CTA primario), PRE amber, DEV rose. Idle slate-300 + hover slate-700. */
  .compra-toggle-wrap-lg {
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
    width: 100%;
  }
  @media (min-width: 640px) {
    .compra-toggle-wrap-lg { width: auto; align-items: flex-end; }
  }
  .compra-toggle-label-lg {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: rgb(148 163 184); /* slate-400 */
  }
  .compra-toggle-shell-lg {
    display: inline-flex;
    width: 100%;
    gap: 0.25rem;
    border-radius: 0.5rem;
    border: 1px solid rgb(51 65 85); /* slate-700 */
    background: rgb(15 23 42 / 0.6); /* slate-900/60 */
    padding: 0.25rem;
    touch-action: manipulation;
  }
  @media (min-width: 640px) {
    .compra-toggle-shell-lg { width: auto; }
  }
  .compra-toggle-btn-lg {
    min-height: 3rem;
    flex: 1 1 0;
    white-space: nowrap;
    border-radius: 0.375rem;
    padding: 0.5rem 1.25rem;
    font-size: 0.875rem;
    font-weight: 700;
    line-height: 1.25;
    border: none;
    cursor: pointer;
    background: transparent;
    color: rgb(203 213 225); /* slate-300 */
    transition: background-color 0.15s, color 0.15s;
  }
  @media (min-width: 640px) {
    .compra-toggle-btn-lg { flex: none; font-size: 1rem; }
  }
  .compra-toggle-btn-lg-idle { background: transparent; color: rgb(203 213 225); }
  .compra-toggle-btn-lg-idle:hover { background: rgb(51 65 85); color: #fff; } /* slate-700 */
  .compra-toggle-btn-lg-ped-active { background: rgb(2 132 199); color: #fff; } /* sky-600 */
  .compra-toggle-btn-lg-pre-active { background: rgb(245 158 11); color: rgb(69 26 3); } /* amber-500 */
  .compra-toggle-btn-lg-dev-active { background: rgb(225 29 72); color: #fff; } /* rose-600 */
  /* Estado activo por defecto (PED) antes de la hidratación de Alpine */
  .compra-toggle-btn-lg[aria-selected="true"] { background: rgb(2 132 199); color: #fff; }
  .compra-toggle-btn-lg:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px rgb(30 41 59), 0 0 0 4px rgb(56 189 248); /* sky-400 */
  }

  /* Compra mayorista — modos PED / PRE / DEV (contenido) */
  .compra-modo-shell.compra-modo-ped .pedidos-workspace,
  .compra-modo-shell.compra-modo-ped .pedidos-card {
    border-color: rgb(186 230 253 / 0.9);
  }
  .dark .compra-modo-shell.compra-modo-ped .pedidos-workspace,
  .dark .compra-modo-shell.compra-modo-ped .pedidos-card {
    border-color: rgb(14 165 233 / 0.35);
  }
  .compra-modo-shell.compra-modo-pre .pedidos-workspace,
  .compra-modo-shell.compra-modo-pre .pedidos-card {
    border-color: rgb(253 230 138 / 0.95);
  }
  .dark .compra-modo-shell.compra-modo-pre .pedidos-workspace,
  .dark .compra-modo-shell.compra-modo-pre .pedidos-card {
    border-color: rgb(245 158 11 / 0.35);
  }
  .compra-modo-shell.compra-modo-dev .pedidos-workspace,
  .compra-modo-shell.compra-modo-dev .pedidos-card {
    border-color: rgb(254 202 202 / 0.95);
  }
  .dark .compra-modo-shell.compra-modo-dev .pedidos-workspace,
  .dark .compra-modo-shell.compra-modo-dev .pedidos-card {
    border-color: rgb(244 63 94 / 0.35);
  }
  @media (max-width: 767px) {
    .compra-modo-shell .pedidos-input,
    .compra-modo-shell input[type="number"],
    .compra-modo-shell select,
    .compra-modo-shell textarea {
      min-height: 2.75rem;
      font-size: 1rem;
    }
  }

  /* ── @deprecated F5: alias legacy carrito/checkout → OrderShell ──
   * Sin referencias en templates desde F1; se mantienen alias una versión.
   * Preferir: .pedidos-order-lines, .pedidos-order-lines-scroll, .pedidos-order-summary-panel
   */
  .compra-carrito-panel,
  .pedidos-order-lines {
    min-height: 0;
  }
  @media (max-width: 767px) {
    .compra-carrito-panel,
    .pedidos-order-lines {
      max-height: none;
    }
    .compra-carrito-scroll,
    .pedidos-order-lines-scroll {
      max-height: none !important;
    }
  }
  @media (min-width: 768px) {
    .compra-carrito-scroll {
      max-height: 46vh;
      overflow-y: auto;
    }
  }
  @media (min-width: 1024px) {
    .compra-carrito-scroll {
      max-height: none;
      overflow-y: visible;
    }
  }

  /* Coherencia hub / listados / detalle (tokens compartidos F5) */
  .pedidos-surface-muted {
    border-radius: 1rem;
    border: 1px solid rgb(226 232 240);
    background: rgb(248 250 252);
  }
  .dark .pedidos-surface-muted {
    border-color: rgb(30 41 59);
    background: rgb(15 23 42 / 0.6);
  }
  .pedidos-hub-highlight {
    border-color: rgb(186 230 253);
  }
  .dark .pedidos-hub-highlight {
    border-color: rgb(14 165 233 / 0.35);
  }

  /* ── OrderShell (rediseño toma de pedidos) ── */
  .pedidos-order-shell {
    --pedidos-header-offset: 0.5rem;
  }

  /* Fila de contexto cliente|marcas — no sticky para no competir con el hero oscuro fijo */
  .pedidos-order-header {
    position: static;
    padding: 0;
  }

  .pedidos-order-header-cliente,
  .pedidos-order-header-marcas {
    min-width: 0;
  }

  .pedidos-order-header-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    flex: 0 1 auto;
  }

  .pedidos-order-main {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    align-items: start;
  }
  @media (min-width: 1024px) {
    .pedidos-order-main {
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
      gap: 1.5rem;
    }
  }

  .pedidos-order-primary {
    min-width: 0;
  }

  .pedidos-order-capture {
    min-width: 0;
  }

  .pedidos-order-lines {
    min-width: 0;
  }

  .pedidos-order-lines-scroll {
    max-height: none;
  }
  @media (min-width: 1024px) {
    .pedidos-order-lines-scroll {
      max-height: 42vh;
      overflow-y: auto;
    }
  }

  .pedidos-order-summary {
    min-width: 0;
  }
  @media (min-width: 1024px) {
    .pedidos-order-summary {
      position: sticky;
      top: calc(5.5rem + var(--pedidos-header-offset));
      align-self: start;
    }
  }

  .pedidos-order-summary-panel {
    border-radius: 1.5rem;
    border: 1px solid rgb(226 232 240);
    background: #fff;
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.12);
    overflow: hidden;
  }
  .dark .pedidos-order-summary-panel {
    border-color: rgb(30 41 59);
    background: rgb(15 23 42);
  }

  .pedidos-order-summary-bar {
    box-shadow: 0 -8px 20px -8px rgba(15, 23, 42, 0.15);
  }
  .dark .pedidos-order-summary-bar {
    box-shadow: 0 -8px 20px -8px rgba(0, 0, 0, 0.35);
  }
  .pedidos-order-summary-bar--expanded {
    padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
  }
  .pedidos-summary-total-toggle {
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    border-radius: 0.5rem;
  }
  .pedidos-summary-total-toggle:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgb(14 165 233);
  }
  .dark .pedidos-summary-total-toggle:focus-visible {
    box-shadow: 0 0 0 2px rgb(15 23 42), 0 0 0 4px rgb(56 189 248);
  }
  .pedidos-summary-mobile-breakdown {
    margin-top: 0.75rem;
    padding-top: 0.75rem;
    border-top: 1px solid rgb(226 232 240);
  }
  .dark .pedidos-summary-mobile-breakdown {
    border-color: rgb(51 65 85);
  }
  @media (max-width: 1023px) {
    .pedidos-order-summary-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 35;
      border-top: 1px solid rgb(226 232 240);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      padding: 0.75rem 1rem;
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    .dark .pedidos-order-summary-bar {
      border-color: rgb(30 41 59);
      background: rgba(15, 23, 42, 0.96);
    }
    .pedidos-order-summary-panel--desktop {
      display: none;
    }
  }
  @media (min-width: 1024px) {
    .pedidos-order-summary-bar {
      display: none;
    }
  }

  .pedidos-order-secondary {
    border-radius: 1rem;
    border: 1px solid rgb(226 232 240);
    background: rgb(248 250 252);
    overflow: hidden;
  }
  .dark .pedidos-order-secondary {
    border-color: rgb(30 41 59);
    background: rgb(15 23 42 / 0.6);
  }

  /* Tokens modo PED/PRE/DEV (botones shell) */
  .pedidos-btn-modo-ped {
    color: #fff;
    background: rgb(2 132 199);
  }
  .pedidos-btn-modo-ped:hover { background: rgb(14 165 233); }
  .dark .pedidos-btn-modo-ped { background: rgb(3 105 161); }
  .dark .pedidos-btn-modo-ped:hover { background: rgb(14 165 233); }

  .pedidos-btn-modo-pre {
    color: rgb(69 26 3);
    background: rgb(245 158 11);
  }
  .pedidos-btn-modo-pre:hover { background: rgb(251 191 36); }
  .dark .pedidos-btn-modo-pre {
    color: rgb(254 243 199);
    background: rgb(180 83 9);
  }
  .dark .pedidos-btn-modo-pre:hover { background: rgb(217 119 6); }

  .pedidos-btn-modo-dev {
    color: #fff;
    background: rgb(225 29 72);
  }
  .pedidos-btn-modo-dev:hover { background: rgb(244 63 94); }
  .dark .pedidos-btn-modo-dev { background: rgb(190 18 60); }
  .dark .pedidos-btn-modo-dev:hover { background: rgb(244 63 94); }

  /* Input cantidad compacto */
  .pedidos-input-qty {
    width: 4rem;
    border-radius: 0.5rem;
    border: 1px solid rgb(226 232 240);
    background: #fff;

  /*
   * Pedido masivo vive dentro del shell global: header fijo (4rem), padding
   * vertical del contenido (4rem) y status bar desktop (2rem). Sin este
   * descuento la sección supera el viewport y el navegador termina siendo el
   * scroll container, lo que rompe tanto el pie fijo como los sticky de tabla.
   */
  html:has(.pm-matrix-viewport),
  body:has(.pm-matrix-viewport) {
    max-width: 100%;
    overflow-x: hidden;
  }
  /*
   * Causa raíz del scroll-x en el body: `main.app-content` es un flex item con
   * `min-width:auto`, así que el ancho de la matriz podía empujar `main` más
   * ancho que el viewport y el scroll horizontal lo tomaba el body (los sticky
   * quedaban recortados). Forzamos `min-width:0` SOLO en la rama que contiene la
   * matriz para habilitar el overflow local de la zona media (scoped, no rompe
   * otras páginas).
   */
  main.app-content:has(.pm-matrix-viewport),
  main.app-content:has(.pm-matrix-viewport) > div {
    min-width: 0;
  }
  .pm-matrix-viewport {
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }
  @media (min-width: 768px) {
    .pm-matrix-viewport {
      height: calc(100dvh - 8rem) !important;
    }
  }
  .pm-matrix-scroll {
    --pm-left-precio: 20rem;
    --pm-left-desc: 25.5rem;
    --pm-col-art-min: 16rem;
    --pm-col-precio: 5.5rem;
    --pm-col-pct: 4.25rem;
    --pm-col-suc: 4.5rem;   /* ~6 dígitos enteros + padding */
    --pm-col-total: 5.5rem;
    --pm-col-delete: 2.75rem;    /* columna eliminar (ícono trash) */
    --pm-right-total: 2.75rem;   /* = ancho columna eliminar; medido en runtime */
    min-width: 0;
    max-width: 100%;
    isolation: isolate;
    scrollbar-gutter: stable both-edges;
  }
  .pm-matrix-table {
    /* ≥ viewport: Artículo absorbe sobrante; con muchas sucursales crece y hace scroll-x */
    width: max-content;
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: auto;
  }
  /* Importancia 1: descripción — crece con el viewport; no cap rígido */
  .pm-matrix-col-art {
    position: sticky;
    left: 0;
    z-index: 12;
    width: auto;
    min-width: var(--pm-col-art-min);
    vertical-align: top;
    overflow: visible;
  }
  .pm-art-dropdown {
    min-width: 16rem;
    max-width: min(28rem, 70vw);
  }
  .pm-matrix-table tbody tr:first-child .pm-matrix-col-art {
    z-index: 35;
  }
  /* Importancia 2: precio — ancho fijo numérico */
  .pm-matrix-col-precio {
    position: sticky;
    left: var(--pm-left-precio);
    z-index: 12;
    width: var(--pm-col-precio);
    min-width: var(--pm-col-precio);
    max-width: var(--pm-col-precio);
    white-space: nowrap;
  }
  /* Importancia 3: % desc. — más angosto */
  .pm-matrix-col-desc {
    position: sticky;
    left: var(--pm-left-desc);
    z-index: 12;
    width: var(--pm-col-pct);
    min-width: var(--pm-col-pct);
    max-width: var(--pm-col-pct);
    box-shadow: 4px 0 8px -4px rgba(15, 23, 42, 0.18);
  }
  .pm-matrix-col-art.pm-matrix-th,
  .pm-matrix-col-precio.pm-matrix-th,
  .pm-matrix-col-desc.pm-matrix-th {
    top: 0;
    z-index: 32;
  }
  .pm-matrix-col-art .pm-art-nombre {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    word-break: break-word;
  }
  .pm-matrix-col-art .pm-art-buscar {
    width: 100%;
    max-width: 100%;
  }
  /* Cantidad por sucursal: fijo ~6 dígitos; el sobrante va a Artículo */
  .pm-matrix-col-suc {
    width: var(--pm-col-suc);
    min-width: var(--pm-col-suc);
    max-width: var(--pm-col-suc);
    box-sizing: border-box;
  }
  .pm-matrix-col-suc.pm-matrix-th {
    top: 0;
    z-index: 20;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: normal;
    line-height: 1.15;
    font-size: 10px;
    font-weight: 600;
    padding-left: 0.25rem;
    padding-right: 0.25rem;
  }
  .pm-matrix-col-suc .pm-qty-input,
  .pm-matrix-col-suc .pm-qty-placeholder {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
  }
  /* Bloque derecho sticky: Total (junto a sucursales) + Eliminar (borde derecho). */
  .pm-matrix-col-total {
    position: sticky;
    right: var(--pm-right-total);
    z-index: 12;
    width: var(--pm-col-total);
    min-width: var(--pm-col-total);
    max-width: var(--pm-col-total);
    white-space: nowrap;
    background-clip: padding-box;
    /* Sombra a la izquierda del bloque derecho: separa de las sucursales al scrollear. */
    box-shadow: -4px 0 8px -4px rgba(15, 23, 42, 0.18);
  }
  .pm-matrix-col-total.pm-matrix-th {
    top: 0;
    z-index: 22;
  }
  .pm-matrix-col-delete {
    position: sticky;
    right: 0;
    z-index: 12;
    width: var(--pm-col-delete);
    min-width: var(--pm-col-delete);
    max-width: var(--pm-col-delete);
    text-align: center;
    box-sizing: border-box;
    background-clip: padding-box;
  }
  .pm-matrix-col-delete.pm-matrix-th {
    top: 0;
    z-index: 22;
  }

  /* ── Matriz masivo: shell de 3 zonas (desktop lg+) — robusto, sin sticky en <td> ──
   * Zona izquierda (Artículo|Precio|%Desc) y derecha (Total|Eliminar) FIJAS; zona
   * media con scroll-x solo en sucursales. Las 3 tablas se alinean por índice de
   * fila con alto fijo (--pm-row-h). El scroll-y vive en la zona media y se espeja
   * (JS) a izquierda/derecha para mantener las filas alineadas. */
  .pm-matrix-shell {
    --pm-row-h: 3.25rem;
    --pm-head-h: 3rem;
    --pm-col-art: 15rem;
    --pm-col-precio: 5rem;
    --pm-col-desc: 4.25rem;
    --pm-col-suc: 4.5rem;
    --pm-col-total: 5.5rem;
    --pm-col-delete: 2.75rem;
    display: flex;
    min-width: 0;
    max-width: 100%;
    min-height: 0;
    isolation: isolate;
  }
  .pm-zone {
    min-height: 0;
    position: relative;
  }
  .pm-zone-left,
  .pm-zone-right {
    flex: 0 0 auto;
    overflow: hidden;
  }
  .pm-zone-left { box-shadow: 4px 0 8px -4px rgba(15, 23, 42, 0.18); z-index: 1; }
  .pm-zone-right { box-shadow: -4px 0 8px -4px rgba(15, 23, 42, 0.18); z-index: 1; }
  /* Con el buscador abierto, la zona izq. deja ver el dropdown hacia arriba. */
  .pm-matrix-shell--buscador-abierto .pm-zone-left {
    overflow: visible;
    z-index: 5;
  }
  .pm-zrow-buscador td {
    background: rgb(248 250 252) !important;
  }
  .dark .pm-zrow-buscador td {
    background: rgb(15 23 42 / 0.85) !important;
  }
  .pm-zrow-buscador .pm-c-art {
    overflow: visible;
  }
  .pm-zone-mid {
    flex: 1 1 0;
    min-width: 0;
    overflow-x: auto;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .pm-ztable {
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    font-size: 0.875rem;
  }
  .pm-ztable-left { width: calc(var(--pm-col-art) + var(--pm-col-precio) + var(--pm-col-desc)); }
  .pm-ztable-right { width: calc(var(--pm-col-total) + var(--pm-col-delete)); }
  .pm-ztable-mid { width: max-content; min-width: 100%; }
  .pm-zhead {
    height: var(--pm-head-h);
    position: sticky;
    top: 0;
    z-index: 3;
    border-bottom: 1px solid rgb(226 232 240);
    padding: 0.25rem 0.5rem;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    color: rgb(71 85 105);
    box-sizing: border-box;
  }
  .dark .pm-zhead { border-color: rgb(51 65 85); color: rgb(203 213 225); }
  .pm-zone-left .pm-zhead,
  .pm-zone-right .pm-zhead { background: rgb(248 250 252); }
  .dark .pm-zone-left .pm-zhead,
  .dark .pm-zone-right .pm-zhead { background: rgb(30 41 59); }
  .pm-zhead-suc {
    text-align: center;
    line-height: 1.15;
  }
  .pm-ztable td {
    height: var(--pm-row-h);
    box-sizing: border-box;
    border-bottom: 1px solid rgb(241 245 249);
    padding: 0.25rem 0.5rem;
    vertical-align: middle;
    background: #fff;
  }
  .dark .pm-ztable td { border-color: rgb(30 41 59); background: rgb(15 23 42); }
  .pm-ztable tbody tr:hover td { background: rgb(248 250 252); }
  .dark .pm-ztable tbody tr:hover td { background: rgb(30 41 59 / 0.6); }
  .pm-c-art { width: var(--pm-col-art); vertical-align: top; }
  .pm-c-precio { width: var(--pm-col-precio); text-align: right; white-space: nowrap; }
  .pm-c-desc { width: var(--pm-col-desc); }
  .pm-c-suc { width: var(--pm-col-suc); padding-left: 0.125rem; padding-right: 0.125rem; }
  .pm-c-total { width: var(--pm-col-total); text-align: right; white-space: nowrap; }
  .pm-c-delete { width: var(--pm-col-delete); text-align: center; }
  .pm-cell-art {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    overflow: hidden;
  }
  .pm-cell-art .pm-art-nombre {
    display: -webkit-box;

  .pm-c-suc .pm-qty-input {
