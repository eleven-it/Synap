{% comment %}
  Superficie de líneas del pedido — tabla desktop (md+).
  Contrato Alpine root: cart.items, money, cambiarCantidad, quitar, itemMuestraUom, cambiarUom, cambiarDescuentoRenglon.
{% endcomment %}
<div class="hidden md:block overflow-x-auto">
  <table class="w-full text-left border-collapse" aria-label="Líneas del pedido">
    <thead class="text-[10px] font-bold uppercase tracking-wider text-slate-400 border-b border-slate-100 dark:border-slate-800">
      <tr>
        <th class="py-2 pr-3 font-semibold">Producto</th>
        <th class="py-2 px-2 font-semibold w-28">UOM</th>
        <th class="py-2 px-2 font-semibold w-32 text-center">Cant.</th>
        <th class="py-2 px-2 font-semibold text-right w-28">P. unit.</th>
        <th class="py-2 px-2 font-semibold text-center w-24">% desc.</th>
        <th class="py-2 px-2 font-semibold text-right w-28">Total</th>
        <th class="py-2 pl-2 font-semibold w-16 text-center"><span class="sr-only">Quitar</span></th>
      </tr>
    </thead>
    <tbody>
      <template x-for="it in (cart.items || [])" :key="it.id">
        <tr class="border-b border-slate-100 dark:border-slate-800 align-middle">
          <td class="py-3 pr-3 min-w-0">
            <p class="text-sm font-medium text-slate-800 dark:text-slate-100 truncate" x-text="it.descripcion"></p>
            <p class="text-xs text-slate-500 dark:text-slate-400" x-text="`${it.alicuota_iva}% IVA`"></p>
            <p x-show="it.promocion_etiqueta" class="text-[10px] text-amber-700 dark:text-amber-400 mt-0.5" x-text="it.promocion_etiqueta"></p>
          </td>
          <td class="py-3 px-2">
            {% include "ecom/includes/pedidos_uom_selector.html" %}
          </td>
          <td class="py-3 px-2 text-center">
            {% include "ecom/includes/pedidos_qty_input.html" %}
          </td>
          <td class="py-3 px-2 text-right text-sm text-slate-600 dark:text-slate-300 tabular-nums" x-text="money(it.precio_unitario_neto)"></td>
          <td class="py-3 px-2 text-center">
            <label class="sr-only" :for="`pedidos-desc-renglon-${it.id}`">Descuento renglón %</label>
            <input :id="`pedidos-desc-renglon-${it.id}`"
                   type="number"
                   min="0"
                   max="100"
                   step="0.01"
                   :value="it.porcentaje_descuento"
                   @change="cambiarDescuentoRenglon(it.id, $event.target.value)"
                   class="pedidos-input w-16 text-right text-sm px-2 py-1 tabular-nums" />
          </td>
          <td class="py-3 px-2 text-right text-sm font-semibold text-slate-900 dark:text-white tabular-nums" x-text="money(it.total)"></td>
          <td class="py-3 pl-2 text-center">
            <button type="button"
                    @click="quitar(it.id)"
                    class="text-xs font-semibold text-rose-500 hover:text-rose-400 min-h-[2.75rem] px-2 touch-manipulation">
              Quitar
            </button>
          </td>
        </tr>
      </template>
    </tbody>
  </table>
</div>
