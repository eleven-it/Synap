<div id="repetir-pedido-modal" class="fixed inset-0 z-50 hidden" aria-hidden="true">
  <div class="absolute inset-0 bg-slate-900/60" data-repetir-cerrar></div>
  <div class="relative flex min-h-full items-center justify-center p-4">
    <div class="w-full max-w-3xl rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
        <h3 class="text-lg font-semibold text-slate-900 dark:text-white">Repetir pedido</h3>
        <button type="button" class="text-slate-400 hover:text-slate-600" data-repetir-cerrar aria-label="Cerrar">✕</button>
      </div>
      <div class="px-6 py-4 max-h-[60vh] overflow-y-auto" id="repetir-pedido-contenido">
        <p class="text-sm text-slate-500">Cargando vista previa…</p>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-800 flex flex-wrap gap-3 justify-end">
        <p id="repetir-pedido-error" class="text-sm text-rose-600 flex-1 hidden"></p>
        <button type="button" class="rounded-full px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100" data-repetir-cerrar>Cancelar</button>
        <button type="button" id="repetir-pedido-confirmar" class="rounded-full px-5 py-2 text-sm font-semibold text-white bg-sky-600 hover:bg-sky-500 disabled:opacity-50" disabled>
          Cargar al carrito
        </button>
      </div>
    </div>
  </div>
</div>
