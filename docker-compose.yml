version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: Synap_app
    command:
      [
        "gunicorn",
        "--bind", "0.0.0.0:8002",
        "django_project.wsgi:application"
      ]
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./firebase_credentials.json:/app/firebase_credentials.json  # Montar la clave en el contenedor
      - ./certs:/certs
    ports:
      - "443:8002"  # Producción/staging: expone 8002 como 443
    depends_on:
      - db
      - redis
    env_file:
      - .env

  celery:
    build: .
    container_name: synap_celery
    command: celery -A django_project worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env

  celery-beat:
    build: .
    container_name: synap_celery_beat
    command: celery -A django_project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env

volumes:
  postgres_data:
  static_volume:
  redis_data:
