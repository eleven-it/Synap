# Arranque automático tras reinicio de Docker Desktop / WSL:
# - restart: unless-stopped en todos los servicios
# - healthchecks + depends_on condition para no levantar app antes de db/redis
# Tras cambiar políticas: una vez `docker compose up -d` (recrea contenedores).
# Si el bind mount WSL aún no está listo, el entrypoint falla y Docker reintenta.

services:
  app:
    build: .
    container_name: Synap_app
    networks:
      - default
      - synap_net
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      # Certificados AFIP fuera del bind mount (.:/app) para I/O estable con pyafipws.
      - synap_afip_secrets:/var/lib/synap/afip
      # WAL archivados (mismo volumen que Synap_db). En UI: /var/lib/synap/wal_archive
      - postgres_wal_archive:/var/lib/synap/wal_archive:ro
    env_file:
      - .env
    environment:
      SYNAP_AFIP_STORAGE: /var/lib/synap/afip
      # SYNAP_MIGRATIONS_POSTGRES_ONLY: solo durante migrate (docker-entrypoint.sh).
      # No definir en runtime: settings.py quita DATABASES['mysql'] y rompe login/MySQL.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # El comando se ejecuta a través del entrypoint
    # El entrypoint ejecuta setup automático antes de iniciar el servidor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  db:
    image: postgres:13
    container_name: Synap_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Misma carpeta física que monta Synap_app en /var/lib/synap/wal_archive
      - postgres_wal_archive:/var/lib/postgresql/wal_archive
      - ./docker/postgres/entrypoint-wal.sh:/usr/local/bin/synap-postgres-entrypoint.sh:ro
    # archive_mode requiere reinicio; habilita incremental Postgres (PITR / copia WAL).
    entrypoint: ["/usr/local/bin/synap-postgres-entrypoint.sh"]
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:6-alpine
    container_name: Synap_redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --stop-writes-on-bgsave-error no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Servicios eliminados para instalación mínima de Reportes
  # celery_worker: No necesario
  # celery_beat: No necesario
  # qdrant: No necesario

volumes:
  postgres_data:
  postgres_wal_archive:
  redis_data:
  static_volume:
  synap_afip_secrets:
  # media_volume: Eliminado - usar bind mount (.:/app) para media/
  # qdrant_data: Eliminado (no necesario)

networks:
  # Red compartida con MySQL local (docker-compose.mysql.yml) para desarrollo.
  # En producción no se levanta MySQL local; DB_HOST apunta al servidor productivo.
  synap_net:
    name: synap_net
