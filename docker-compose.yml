services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - synap_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - synap_network

  # Microservicio de IA para reportes
  reports-ai:
    build: 
      context: .
      dockerfile: reports_ai/Dockerfile
      cache_from:
        - pytorch/pytorch:latest
    container_name: synap_reports_ai
    restart: always
    ports:
      - "8003:8000"
    volumes:
      - ai_models:/app/models
    environment:
      - ENVIRONMENT=production
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    networks:
      - synap_network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Vector database para embeddings de IA
  qdrant:
    build: 
      context: .
      dockerfile: qdrant/Dockerfile
    container_name: synap_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    networks:
      - synap_network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6333 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: 
      context: .
      cache_from:
        - python:3.10-slim
    container_name: Synap_app
    command:
      [
        "gunicorn",
        "--bind", "0.0.0.0:8002",
        "--workers", "3",
        "--timeout", "120",
        "--max-requests", "1000",
        "--max-requests-jitter", "100",
        "django_project.wsgi:application"
      ]
    volumes:
      - ./:/app
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - ./firebase_credentials.json:/app/firebase_credentials.json
      - ./certs:/certs
    ports:
      - "443:8002"
    depends_on:
      - db
      - redis
      - reports-ai
    environment:
      - REPORTS_AI_URL=http://reports-ai:8000
    env_file:
      - .env
    networks:
      - synap_network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  celery:
    build: 
      context: .
      cache_from:
        - python:3.10-slim
    container_name: synap_celery
    command: celery -A django_project worker -l info --concurrency=2
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - synap_network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  celery-beat:
    build: 
      context: .
      cache_from:
        - python:3.10-slim
    container_name: synap_celery_beat
    command: celery -A django_project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - db
      - redis
    env_file:
      - .env
    networks:
      - synap_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  postgres_data:
  static_volume:
  redis_data:
  ai_models:
  qdrant_data:

networks:
  synap_network:
    driver: bridge
