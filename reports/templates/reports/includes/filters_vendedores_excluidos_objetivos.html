{% comment %}
Solo informe ventas-objetivos-vs-bo: exclusión por CodViajante (tabla viajantes).
{% endcomment %}
<label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 sm:col-span-3">
    Vendedores a excluir
    <div class="relative">
        <select name="vendedores_excluidos"
                id="vendedores_excluidos"
                multiple
                class="hidden"
                data-tags-field="vendedores_excluidos">
            <option value="">Cargando...</option>
        </select>
        <div id="vendedores_excluidos_tags_container"
             class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
            <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
            <input type="text"
                   id="vendedores_excluidos_search"
                   class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500"
                   placeholder="Buscar vendedor..."
                   autocomplete="off">
            <div id="vendedores_excluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
        </div>
    </div>
    <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Excluye del informe a los clientes asignados a estos vendedores (facturación, remitos, BO, objetivos y unidades).</span>
</label>
