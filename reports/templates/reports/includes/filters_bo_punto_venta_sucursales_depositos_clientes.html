{% comment %}
Filtros BO/Objetivos BO con layout específico solicitado.
{% endcomment %}
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:col-span-6 mt-4">
    <h3 class="text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wide col-span-full mb-1">Filtros</h3>

    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span>Sucursal</span>
        <div class="relative">
            <select name="sucursales" id="sucursales" multiple class="hidden" data-tags-field="sucursales"><option value="">Cargando...</option></select>
            <div id="sucursales_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="sucursales_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar sucursales..." autocomplete="off">
                <div id="sucursales_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span>Lista de precios</span>
        <select name="lista_precio" id="lista_precio" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md text-xs text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-sky-400 focus:border-sky-400 transition-all duration-300">
            <option value="0">Costo</option>
            <option value="1">Lista Oficial</option>
            <option value="2" selected>Lista 1</option>
            <option value="3">Lista 2</option>
            <option value="4">Lista 3</option>
            <option value="5">Lista 4</option>
            <option value="6">Lista 5</option>
        </select>
    </label>

    {% if report.slug == 'ventas-objetivos-vs-bo' %}
    <div class="col-span-full grid grid-cols-1 sm:grid-cols-2 gap-4">
        <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
            <span>Rubro a incluir</span>
            <div class="relative">
                <select name="rubros_incluidos" id="vo_rubros_incluidos" multiple class="hidden" data-tags-field="vo_rubros_incluidos"><option value="">Cargando...</option></select>
                <div id="vo_rubros_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                    <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                    <input type="text" id="vo_rubros_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar rubro..." autocomplete="off">
                    <div id="vo_rubros_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
                </div>
            </div>
            <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Vacío = todos los rubros en el desglose. No modifica los totales por cliente de la grilla.</span>
        </label>
        <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
            <span>Subrubro a incluir</span>
            <div class="relative">
                <select name="subrubros_incluidos" id="vo_subrubros_incluidos" multiple class="hidden" data-tags-field="vo_subrubros_incluidos"><option value="">Cargando...</option></select>
                <div id="vo_subrubros_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                    <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                    <input type="text" id="vo_subrubros_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar subrubro..." autocomplete="off">
                    <div id="vo_subrubros_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
                </div>
            </div>
            <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Vacío = todos los subrubros en el desglose.</span>
        </label>
    </div>
    {% endif %}

    {% if report.slug == 'ventas-por-articulo' %}
    {% include "reports/includes/filters_ventas_por_articulo_catalogo.html" %}
    {% endif %}

    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span>Clientes a incluir</span>
        <div class="relative">
            <select name="clientes_incluir" id="clientes_incluir" multiple class="hidden" data-tags-field="clientes_incluir"><option value="">Cargando...</option></select>
            <div id="clientes_incluir_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="clientes_incluir_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar cliente..." autocomplete="off">
                <div id="clientes_incluir_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span>Clientes a excluir</span>
        <div class="relative">
            <select name="clientes_excluidos" id="clientes_excluidos" multiple class="hidden" data-tags-field="clientes_excluidos"><option value="">Cargando...</option></select>
            <div id="clientes_excluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="clientes_excluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar cliente..." autocomplete="off">
                <div id="clientes_excluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
    </label>

    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span>Vendedores a incluir</span>
        <div class="relative">
            <select name="vendedores_incluir" id="vendedores_incluir" multiple class="hidden" data-tags-field="vendedores_incluir"><option value="">Cargando...</option></select>
            <div id="vendedores_incluir_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="vendedores_incluir_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar vendedor..." autocomplete="off">
                <div id="vendedores_incluir_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span>Vendedores a excluir</span>
        <div class="relative">
            <select name="vendedores_excluidos" id="vendedores_excluidos" multiple class="hidden" data-tags-field="vendedores_excluidos"><option value="">Cargando...</option></select>
            <div id="vendedores_excluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="vendedores_excluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar vendedor..." autocomplete="off">
                <div id="vendedores_excluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        {% if report.slug == 'ventas-objetivos-vs-bo' %}
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Excluye del informe a los clientes asignados a estos vendedores (facturación, remitos, pedidos en armado, BO, objetivos y unidades).</span>
        {% elif report.slug == 'ventas-por-vendedor' or report.slug == 'ventas-por-articulo' %}
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Excluye del informe a los clientes asignados a estos vendedores (ventas e importes del período de facturación).</span>
        {% endif %}
    </label>

    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 sm:col-span-2">
        <span>Depósitos</span>
        <div class="relative">
            <select name="depositos_incluidos" id="depositos_incluidos" multiple class="hidden" data-tags-field="depositos_incluidos"><option value="">Cargando...</option></select>
            <div id="depositos_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="depositos_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar depósito..." autocomplete="off">
                <div id="depositos_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
    </label>

</div>
