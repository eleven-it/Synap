{% comment %}
Filtros Sucursal y Punto de venta (mismo comportamiento que BO).
Usado por reportes legacy: Ventas Netas, Remitos no facturados.
Placeholders y textos según UI: "Buscar sucursales...", "Buscar punto de venta...".
{% endcomment %}
<!-- Fila: Sucursal y Punto de venta -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:col-span-6 mt-4">
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            Sucursal
        </span>
        <div class="relative">
            <select name="sucursales"
                    id="sucursales"
                    multiple
                    class="hidden"
                    data-tags-field="sucursales">
                <option value="">Cargando...</option>
            </select>
            <div id="sucursales_tags_container"
                 class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text"
                       id="sucursales_search"
                       class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500"
                       placeholder="Buscar sucursales..."
                       autocomplete="off">
                <div id="sucursales_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Si no seleccionas ninguna sucursal, se mostrarán todas</span>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
            </svg>
            Punto de venta
        </span>
        <div class="relative">
            <select name="punto_venta"
                    id="punto_venta"
                    multiple
                    class="hidden"
                    data-tags-field="punto_venta">
                <option value="">Cargando...</option>
            </select>
            <div id="punto_venta_tags_container"
                 class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text"
                       id="punto_venta_search"
                       class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500"
                       placeholder="Buscar punto de venta..."
                       autocomplete="off">
                <div id="punto_venta_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Si no seleccionas ningún punto de venta, se mostrarán todos</span>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 sm:col-span-2">
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            Clientes a excluir
        </span>
        <div class="relative">
            <select name="clientes_excluidos"
                    id="clientes_excluidos"
                    multiple
                    class="hidden"
                    data-tags-field="clientes_excluidos">
                <option value="">Cargando...</option>
            </select>
            <div id="clientes_excluidos_tags_container"
                 class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text"
                       id="clientes_excluidos_search"
                       class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500"
                       placeholder="Buscar clientes..."
                       autocomplete="off">
                <div id="clientes_excluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Los clientes seleccionados se excluirán de la consulta (NOT IN)</span>
    </label>
</div>
