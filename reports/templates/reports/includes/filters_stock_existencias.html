{% comment %}
Stock y existencias: depósitos, marca / rubro / subrubro (tags), incluir filas con stock cero.
Dos controles por fila al 50% desde md. La búsqueda y el orden van en la tabla (resultados).
{% endcomment %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-4 w-full lg:col-span-6 mt-2">
    <h3 class="text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wide md:col-span-2 mb-0">Filtros</h3>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 min-w-0">
        Depósitos
        <div class="relative">
            <select name="depositos_incluidos" id="depositos_incluidos" multiple class="hidden" data-tags-field="depositos_incluidos">
                <option value="">Cargando...</option>
            </select>
            <div id="depositos_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="depositos_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar depósito..." autocomplete="off">
                <div id="depositos_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Vacío = todos los depósitos suman al stock mostrado.</span>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 min-w-0">
        Marcas
        <div class="relative">
            <select name="marcas_incluidos" id="marcas_incluidos" multiple class="hidden" data-tags-field="marcas_incluidos">
                <option value="">Cargando...</option>
            </select>
            <div id="marcas_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="marcas_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar marca..." autocomplete="off">
                <div id="marcas_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Vacío = todas las marcas.</span>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 min-w-0">
        Rubros
        <div class="relative">
            <select name="rubros_incluidos" id="rubros_incluidos" multiple class="hidden" data-tags-field="rubros_incluidos">
                <option value="">Cargando...</option>
            </select>
            <div id="rubros_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="rubros_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar rubro..." autocomplete="off">
                <div id="rubros_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Vacío = todos los rubros.</span>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 min-w-0">
        Subrubros
        <div class="relative">
            <select name="subrubros_incluidos" id="subrubros_incluidos" multiple class="hidden" data-tags-field="subrubros_incluidos">
                <option value="">Cargando...</option>
            </select>
            <div id="subrubros_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="subrubros_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar subrubro..." autocomplete="off">
                <div id="subrubros_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Vacío = todos los subrubros.</span>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 min-w-0">
        Incluir artículos con stock total cero
        <select name="incluir_stock_cero" id="incluir_stock_cero" class="w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md text-xs">
            <option value="no" selected>No (ocultar)</option>
            <option value="si">Sí</option>
        </select>
    </label>
</div>
