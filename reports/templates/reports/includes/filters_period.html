{% comment %}
Template unificado para filtros de período (Día, Mes, Año, Personalizado) y fechas.
Este template se usa tanto para reportes legacy como declarativos.
{% endcomment %}
<!-- Fila 1: Período y Fechas -->
<div class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 lg:col-span-2">
    <span>Período</span>
    <div class="flex flex-wrap items-center gap-2">
        <button type="button" 
                data-periodo="dia_actual"
                class="periodo-tipo-btn px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium rounded-full border transition-all duration-200 hover:scale-105 hover:shadow-md border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 hover:text-sky-600 dark:hover:text-sky-400">
            <span class="flex items-center gap-1 sm:gap-1.5">
                <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-green-500"></span>
                <span>Día</span>
            </span>
        </button>
        <button type="button" 
                data-periodo="mes_actual"
                class="periodo-tipo-btn px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium rounded-full border transition-all duration-200 hover:scale-105 hover:shadow-md border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 hover:text-sky-600 dark:hover:text-sky-400">
            <span class="flex items-center gap-1 sm:gap-1.5">
                <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-blue-500"></span>
                <span>Mes</span>
            </span>
        </button>
        <button type="button" 
                data-periodo="año_actual"
                class="periodo-tipo-btn px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium rounded-full border transition-all duration-200 hover:scale-105 hover:shadow-md border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 hover:text-sky-600 dark:hover:text-sky-400">
            <span class="flex items-center gap-1 sm:gap-1.5">
                <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-purple-500"></span>
                <span>Año</span>
            </span>
        </button>
        <button type="button" 
                data-periodo="personalizado"
                class="periodo-tipo-btn px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium rounded-full border transition-all duration-200 hover:scale-105 hover:shadow-md border-sky-500 bg-sky-50 dark:bg-sky-900/20 text-sky-700 dark:text-sky-300 shadow-md active">
            <span class="flex items-center gap-1 sm:gap-1.5">
                <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-orange-500"></span>
                <span>Personalizado</span>
            </span>
        </button>
    </div>
    <!-- Select oculto para mantener compatibilidad con el código JavaScript -->
    <select name="periodo_tipo"
            id="periodo_tipo"
            class="hidden">
        <option value="dia_actual">Día en curso</option>
        <option value="mes_actual">Mes en curso</option>
        <option value="año_actual">Año en curso</option>
        <option value="personalizado" selected>Personalizado</option>
    </select>
</div>
<label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 lg:col-span-2">
    Fecha desde
    <input type="date"
           name="fecha_inicio"
           id="fecha_inicio"
           class="synap-input focus:ring-2 focus:ring-sky-400 focus:border-sky-400 transition-all duration-300 text-xs">
</label>
<label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 lg:col-span-2">
    Fecha hasta
    <input type="date"
           name="fecha_fin"
           id="fecha_fin"
           class="synap-input focus:ring-2 focus:ring-sky-400 focus:border-sky-400 transition-all duration-300 text-xs">
</label>
