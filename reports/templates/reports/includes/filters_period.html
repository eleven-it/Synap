{% comment %}
Template unificado para filtros de período (Día, Mes, Año, Personalizado) y fechas.
Este template se usa tanto para reportes legacy como declarativos.
Todos los elementos en una sola línea horizontal.
{% endcomment %}
<!-- Fila 1: Período y Fechas en una sola línea (legacy y declarativo) -->
<div id="period-filters-container" class="flex flex-row flex-nowrap items-end gap-4 lg:col-span-6" style="display: flex !important;">
    <!-- Botones de período -->
    <div class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 flex-shrink-0">
        <span>Período</span>
        <div class="flex flex-wrap items-center gap-2">
            <button type="button" 
                    data-periodo="dia_actual"
                    class="periodo-tipo-btn px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium rounded-full border transition-all duration-200 hover:scale-105 hover:shadow-md border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 hover:text-sky-600 dark:hover:text-sky-400">
                <span class="flex items-center gap-1 sm:gap-1.5">
                    <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-green-500"></span>
                    <span>Día</span>
                </span>
            </button>
            <button type="button" 
                    data-periodo="mes_actual"
                    class="periodo-tipo-btn px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium rounded-full border transition-all duration-200 hover:scale-105 hover:shadow-md border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 hover:text-sky-600 dark:hover:text-sky-400">
                <span class="flex items-center gap-1 sm:gap-1.5">
                    <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-blue-500"></span>
                    <span>Mes</span>
                </span>
            </button>
            <button type="button" 
                    data-periodo="año_actual"
                    class="periodo-tipo-btn px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium rounded-full border transition-all duration-200 hover:scale-105 hover:shadow-md border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:border-sky-400 hover:text-sky-600 dark:hover:text-sky-400">
                <span class="flex items-center gap-1 sm:gap-1.5">
                    <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-purple-500"></span>
                    <span>Año</span>
                </span>
            </button>
            <button type="button" 
                    data-periodo="personalizado"
                    class="periodo-tipo-btn px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium rounded-full border transition-all duration-200 hover:scale-105 hover:shadow-md border-sky-500 bg-sky-50 dark:bg-sky-900/20 text-sky-700 dark:text-sky-300 shadow-md active">
                <span class="flex items-center gap-1 sm:gap-1.5">
                    <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-orange-500"></span>
                    <span>Personalizado</span>
                </span>
            </button>
        </div>
        <!-- Select oculto para mantener compatibilidad con el código JavaScript -->
        <select name="periodo_tipo"
                id="periodo_tipo"
                class="hidden">
            <option value="dia_actual">Día en curso</option>
            <option value="mes_actual">Mes en curso</option>
            <option value="año_actual">Año en curso</option>
            <option value="personalizado" selected>Personalizado</option>
        </select>
    </div>
    <!-- Fecha desde -->
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 flex-shrink-0">
        Fecha desde
        <input type="date"
               name="fecha_inicio"
               id="fecha_inicio"
               class="synap-input px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium min-w-[148px] overflow-hidden rounded-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-sky-400 focus:border-sky-400 transition-all duration-200">
    </label>
    <!-- Fecha hasta -->
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 flex-shrink-0">
        Fecha hasta
        <input type="date"
               name="fecha_fin"
               id="fecha_fin"
               class="synap-input px-2.5 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-xs font-medium min-w-[148px] overflow-hidden rounded-full border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-sky-400 focus:border-sky-400 transition-all duration-200">
    </label>
</div>
<script>
(function() {
    var el = document.getElementById('period-filters-container');
    if (!el) return;
    var buttons = el.querySelectorAll('.periodo-tipo-btn');
    var sel = document.getElementById('periodo_tipo');
    var inicio = document.getElementById('fecha_inicio');
    var fin = document.getElementById('fecha_fin');
    if (!buttons.length || !sel || !inicio || !fin) return;

    function updateDates(periodo) {
        var today = new Date();
        var startDate, endDate;
        if (periodo === 'dia_actual') {
            startDate = endDate = today.toISOString().split('T')[0];
        } else if (periodo === 'mes_actual') {
            startDate = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
            endDate = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0];
        } else if (periodo === 'año_actual') {
            startDate = new Date(today.getFullYear(), 0, 1).toISOString().split('T')[0];
            endDate = new Date(today.getFullYear(), 11, 31).toISOString().split('T')[0];
        } else {
            if (!inicio.value || !fin.value) {
                startDate = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
                endDate = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0];
            } else return;
        }
        inicio.value = startDate;
        fin.value = endDate;
    }

    updateDates(sel.value || 'personalizado');
    buttons.forEach(function(btn) {
        btn.addEventListener('click', function() {
            var periodo = this.getAttribute('data-periodo');
            sel.value = periodo;
            buttons.forEach(function(b) {
                b.classList.remove('border-sky-500', 'bg-sky-50', 'dark:bg-sky-900/20', 'text-sky-700', 'dark:text-sky-300', 'shadow-md', 'active');
                b.classList.add('border-slate-300', 'dark:border-slate-600', 'bg-white', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
            });
            this.classList.remove('border-slate-300', 'dark:border-slate-600', 'bg-white', 'dark:bg-slate-800', 'text-slate-700', 'dark:text-slate-300');
            this.classList.add('border-sky-500', 'bg-sky-50', 'dark:bg-sky-900/20', 'text-sky-700', 'dark:text-sky-300', 'shadow-md', 'active');
            updateDates(periodo);
            sel.dispatchEvent(new Event('change', { bubbles: true }));
        });
    });
})();
</script>
