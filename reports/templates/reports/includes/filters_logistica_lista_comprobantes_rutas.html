{# Filtros adicionales — Comprobantes en rutas. Estado y Cliente: patrón tags + búsqueda (chips removibles). #}
<div class="sm:col-span-6 grid grid-cols-1 sm:grid-cols-2 gap-4 border-t border-slate-100 dark:border-slate-800 pt-4 mt-2">
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Estado entrega
        </span>
        <div class="relative">
            <select name="logistica_estado_entrega" id="logistica_estado_entrega" multiple class="hidden" data-tags-field="logistica_estado_entrega">
                <option value="Si">Entregado</option>
                <option value="No">No entregado</option>
            </select>
            <div id="logistica_estado_entrega_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="logistica_estado_entrega_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar estado…" autocomplete="off">
                <div id="logistica_estado_entrega_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Opcional: sin selección se muestran todos los estados.</span>
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
        <span class="flex items-center gap-2">
            <svg class="w-4 h-4 text-slate-500 dark:text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            Cliente
        </span>
        <div class="relative">
            <select name="logistica_id_cliente" id="logistica_id_cliente" multiple class="hidden" data-tags-field="logistica_id_cliente"></select>
            <div id="logistica_id_cliente_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="logistica_id_cliente_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar cliente…" autocomplete="off">
                <div id="logistica_id_cliente_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic mt-0.5">Opcional: sin selección se muestran todos los clientes. Escribe al menos 2 caracteres para buscar.</span>
    </label>
</div>
