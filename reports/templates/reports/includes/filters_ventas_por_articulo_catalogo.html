{% comment %}
Filtros de catálogo para ventas-por-articulo (rubro, subrubro, marca incluir/excluir).

<div class="col-span-full grid grid-cols-1 sm:grid-cols-2 gap-4 mt-1">

        <span>Rubros a incluir</span>
        <div class="relative">
            <select name="rubros_incluidos" id="vpa_rubros_incluidos" multiple class="hidden" data-tags-field="vpa_rubros_incluidos"><option value="">Cargando...</option></select>
            <div id="vpa_rubros_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="vpa_rubros_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar rubro..." autocomplete="off">
                <div id="vpa_rubros_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
