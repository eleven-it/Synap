{% load static %}
{% comment %}Filtros fabricados-superart: panel colapsable, rango Desde–Hasta, marcas y superartículos.{% endcomment %}
<div id="fsa-filtros-root" class="w-full lg:col-span-6 mt-2 space-y-2" data-fsa-marcas-url="{% url 'reports-api:fabricados-superart-marcas-buscar' %}" data-fsa-superart-url="{% url 'reports-api:fabricados-superart-superart-buscar' %}">
    <button type="button" id="fsa-toggle-panel" class="inline-flex min-h-10 items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 text-sm font-semibold text-slate-800 shadow-sm hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100" aria-expanded="true">
        <span class="material-icons text-base" id="fsa-toggle-icon">expand_more</span>
        Filtros
    </button>
    <div id="fsa-panel" class="rounded-xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-900/40">
        <div class="flex flex-wrap items-end gap-4">
            <div class="min-w-[16rem] flex-1">
                <span class="mb-1 block text-xs font-semibold text-slate-600 dark:text-slate-400">Período</span>
                <div class="flex flex-wrap items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 dark:border-slate-600 dark:bg-slate-900">
                    <label for="fsa_desde" class="text-[10px] font-medium uppercase text-slate-500">Desde</label>
                    <input type="date" id="fsa_desde" name="fsa_desde" class="min-h-9 flex-1 rounded-md border border-slate-200 px-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-white">
                    <span class="text-slate-400">—</span>
                    <label for="fsa_hasta" class="text-[10px] font-medium uppercase text-slate-500">Hasta</label>
                    <input type="date" id="fsa_hasta" name="fsa_hasta" class="min-h-9 flex-1 rounded-md border border-slate-200 px-2 text-sm dark:border-slate-600 dark:bg-slate-950 dark:text-white">
                </div>
            </div>
            <div class="min-w-[14rem] flex-1">
                <label class="mb-1 block text-xs font-semibold text-slate-600 dark:text-slate-400">Marcas</label>
                <div class="relative">
                    <select name="marcas_incluidos" id="marcas_incluidos" multiple class="hidden" data-tags-field="marcas_incluidos">
                        <option value="">Cargando...</option>
                    </select>
                    <div id="marcas_incluidos_tags_container" class="tags-filter-container relative flex min-h-9 flex-wrap items-center gap-1 rounded-lg border border-slate-300 bg-white px-2 py-1.5 dark:border-slate-600 dark:bg-slate-900">
                        <div class="tags-chips flex min-w-0 flex-1 flex-wrap items-center gap-1"></div>
                        <input type="text" id="marcas_incluidos_search" class="tags-input min-w-[5rem] flex-1 border-none bg-transparent text-xs outline-none dark:text-slate-100" placeholder="Buscar marca…" autocomplete="off">
                        <div id="marcas_incluidos_dropdown" class="tags-dropdown absolute left-0 right-0 top-full z-50 mt-1 hidden max-h-60 overflow-y-auto rounded-md border bg-white shadow-lg dark:border-slate-600 dark:bg-slate-800"></div>
                    </div>
                </div>
            </div>
            <div class="min-w-[14rem] flex-1">
                <label class="mb-1 block text-xs font-semibold text-slate-600 dark:text-slate-400">Superartículo</label>
                <div class="relative">
                    <select name="q_superart" id="superarts_incluidos" multiple class="hidden" data-tags-field="superarts_incluidos"></select>
                    <div id="superarts_incluidos_tags_container" class="tags-filter-container relative flex min-h-9 flex-wrap items-center gap-1 rounded-lg border border-slate-300 bg-white px-2 py-1.5 dark:border-slate-600 dark:bg-slate-900">
                        <div class="tags-chips flex min-w-0 flex-1 flex-wrap items-center gap-1"></div>
                        <input type="text" id="superarts_incluidos_search" class="tags-input min-w-[5rem] flex-1 border-none bg-transparent text-xs outline-none dark:text-slate-100" placeholder="Código o descripción…" autocomplete="off">
                        <div id="superarts_incluidos_dropdown" class="tags-dropdown absolute left-0 right-0 top-full z-50 mt-1 hidden max-h-60 overflow-y-auto rounded-md border bg-white shadow-lg dark:border-slate-600 dark:bg-slate-800"></div>
                    </div>
                </div>
            </div>
            <div class="min-w-[10rem]">
                <label for="fsa_presentacion" class="mb-1 block text-xs font-semibold text-slate-600 dark:text-slate-400">Presentación</label>
                <select id="fsa_presentacion" name="presentacion" class="w-full rounded-md border border-slate-300 bg-white px-2 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-white">
                    <option value="docenas">Docenas · pares</option>
                    <option value="pares">Pares</option>
                </select>
            </div>
        </div>
        <p class="mt-2 text-[10px] text-slate-500 dark:text-slate-400">Los filtros se aplican automáticamente al cambiar. Fabricado de 1ra (Producción → Semi elaborado).</p>
    </div>
</div>
