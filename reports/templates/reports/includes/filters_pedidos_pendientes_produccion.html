{% comment %}
Filtros informe pedidos-pendientes-produccion: período, criterio, marcas, clientes/depósitos.
{% endcomment %}
{% include "reports/includes/filters_period.html" %}
{% include "reports/includes/filters_bo_punto_venta_sucursales_depositos_clientes.html" %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-4 w-full lg:col-span-6 mt-2">
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 min-w-0">
        Criterio de pendiente
        <select name="criterio_pendiente" id="ppp_criterio_pendiente"
                class="text-xs rounded-md border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-3 py-2">
            <option value="backorder" selected>Backorder (PED Pendiente, cantidad pedida)</option>
            <option value="saldo_comercial">Saldo comercial MPR (cantidad pendiente)</option>
            <option value="en_preparacion">En preparación / Preparado</option>
            <option value="saldo_no_entregado">Saldo no entregado (varios estados)</option>
        </select>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic">Configurable hasta definición de Lucho.</span>
    </label>
    <label class="flex items-center gap-2 text-xs font-semibold text-slate-500 dark:text-slate-400 mt-6 md:mt-0">
        <input type="checkbox" name="solo_terminados" id="ppp_solo_terminados" value="1" checked
               class="rounded border-slate-300 text-sky-600 focus:ring-sky-400">
        Solo artículos terminados (tipo_art_fab)
    </label>
    <label class="flex flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2 min-w-0 md:col-span-2">
        Marcas
        <div class="relative">
            <select name="marcas_incluidos" id="marcas_incluidos" multiple class="hidden" data-tags-field="marcas_incluidos">
                <option value="">Cargando...</option>
            </select>
            <div id="marcas_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                <input type="text" id="marcas_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar marca..." autocomplete="off">
                <div id="marcas_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
            </div>
        </div>
        <span class="text-[10px] font-normal text-slate-400 dark:text-slate-500 italic">Vacío = todas las marcas.</span>
    </label>
</div>
