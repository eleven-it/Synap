{% comment %}
Filtros compras-marca-superart (mismo layout que fabricados-superart).
{% endcomment %}
<div id="cmsa-filtros-root" class="flex flex-col gap-4 w-full sm:col-span-2 lg:col-span-6 mt-4 min-w-0" data-cmsa-marcas-url="{% url 'reports-api:compras-marca-superart-marcas-buscar' %}" data-cmsa-superart-url="{% url 'reports-api:compras-marca-superart-superart-buscar' %}">
    <h3 class="text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wide m-0">Filtros</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full min-w-0">
        <label class="flex min-w-0 flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
            <span>Marcas a incluir</span>
            <div class="relative">
                <select name="marcas_incluidos" id="marcas_incluidos" multiple class="hidden" data-tags-field="marcas_incluidos"></select>
                <div id="marcas_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                    <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                    <input type="text" id="marcas_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar marca..." autocomplete="off">
                    <div id="marcas_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
                </div>
            </div>
        </label>
        <label class="flex min-w-0 flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
            <span>Marcas a excluir</span>
            <div class="relative">
                <select name="marcas_excluidos" id="marcas_excluidos" multiple class="hidden" data-tags-field="marcas_excluidos"></select>
                <div id="marcas_excluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                    <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                    <input type="text" id="marcas_excluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Buscar marca..." autocomplete="off">
                    <div id="marcas_excluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
                </div>
            </div>
        </label>
        <label class="flex min-w-0 flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
            <span>Superartículos a incluir</span>
            <div class="relative">
                <select name="q_superart" id="superarts_incluidos" multiple class="hidden" data-tags-field="superarts_incluidos"></select>
                <div id="superarts_incluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                    <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                    <input type="text" id="superarts_incluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Código o descripción..." autocomplete="off">
                    <div id="superarts_incluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
                </div>
            </div>
        </label>
        <label class="flex min-w-0 flex-col text-xs font-semibold text-slate-500 dark:text-slate-400 gap-2">
            <span>Superartículos a excluir</span>
            <div class="relative">
                <select name="superarts_excluidos" id="superarts_excluidos" multiple class="hidden" data-tags-field="superarts_excluidos"></select>
                <div id="superarts_excluidos_tags_container" class="tags-filter-container flex flex-wrap items-center gap-1.5 py-2 px-3 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-md min-h-[2.5rem] focus-within:ring-2 focus-within:ring-sky-400 focus-within:border-sky-400 transition-all duration-300">
                    <div class="tags-chips flex flex-wrap gap-1.5 flex-1"></div>
                    <input type="text" id="superarts_excluidos_search" class="tags-input flex-1 min-w-[120px] bg-transparent border-none outline-none text-xs text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500" placeholder="Código o descripción..." autocomplete="off">
                    <div id="superarts_excluidos_dropdown" class="tags-dropdown absolute top-full left-0 right-0 z-50 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-md shadow-lg max-h-60 overflow-y-auto hidden"></div>
                </div>
            </div>
        </label>
    </div>
    <select name="refresh_interval" id="refresh_interval" class="hidden" aria-hidden="true">
        <option value="interval_10m" selected>Cada 10 minutos</option>
    </select>
    <p class="text-[10px] text-slate-500 dark:text-slate-400 m-0">Compras FA/FC/FM, remitos de proveedor y ajustes MSTOCK (Terminado). Marcas LB, PUS, PUW, RW.</p>
</div>
