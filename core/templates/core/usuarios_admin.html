{% extends "core/core_app_base.html" %}
{% load static %}

{% block admin_content %}
  <div class="max-w-7xl mx-auto">
    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="p-3 rounded text-white {% if message.tags == 'error' %}bg-red-500{% elif message.tags == 'warning' %}bg-amber-500{% else %}bg-green-500{% endif %} text-xs">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Administración de Usuarios</h1>
      <div class="flex gap-2">
        <a href="{% url 'core:validar_integridad_usuarios' %}" class="inline-flex items-center justify-center px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 text-xs transition-colors" title="Validar Integridad">
          <span class="material-icons text-base">verified</span>
        </a>
        <a href="{% url 'core:crear_usuario' %}" class="inline-flex items-center justify-center px-3 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 text-xs transition-colors" title="Crear Usuario">
          <span class="material-icons text-base">person_add</span>
        </a>
      </div>
    </div>
    {% include "core/usuarios_admin_tabla.html" %}
  </div>
{% endblock %}
