{% extends "core/admin_base.html" %}

{% block admin_content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ titulo }}</h1>
    
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label for="id_from_currency" class="block text-sm font-medium text-gray-700">Moneda Origen</label>
                {{ form.from_currency }}
            </div>
            <div>
                <label for="id_to_currency" class="block text-sm font-medium text-gray-700">Moneda Destino</label>
                {{ form.to_currency }}
            </div>
            <div>
                <label for="id_rate" class="block text-sm font-medium text-gray-700">Tasa de Cambio</label>
                {{ form.rate }}
            </div>
            <div>
                <label for="id_date" class="block text-sm font-medium text-gray-700">Fecha</label>
                {{ form.date }}
            </div>
        </div>

        <div class="flex justify-end space-x-4 mt-8">
            <a href="{% url 'core:exchange_rate_list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg">
                Cancelar
            </a>
            <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg">
                Guardar
            </button>
        </div>
    </form>
</div>
{% endblock admin_content %}
