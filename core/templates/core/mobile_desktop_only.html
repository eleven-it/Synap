<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synap — Solo escritorio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .card {
      max-width: 26rem;
      width: 100%;
      background: #fff;
      border-radius: 1rem;
      padding: 1.75rem;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.75rem; font-weight: 700; }
    p { margin: 0 0 1rem; line-height: 1.5; font-size: 0.95rem; color: #475569; }
    .actions { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1.25rem; }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0 1rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      text-align: center;
    }
    a.primary { background: linear-gradient(135deg, #7c3aed, #2563eb); color: #fff; }
    a.secondary { background: #f1f5f9; color: #334155; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Disponible solo en escritorio</h1>
    <p>
      Esta sección de Synap no está habilitada en el modo móvil. Use un ordenador
      o acceda al inicio de sesión, al perfil o al TPV (autoservicio) desde este dispositivo.
    </p>
    <div class="actions">
      <a class="btn primary" href="/login/">Ir al inicio de sesión</a>
      <a class="btn secondary" href="/self_checkout/">Ir al TPV</a>
    </div>
  </div>
</body>
</html>
