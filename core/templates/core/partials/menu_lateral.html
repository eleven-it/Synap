<aside class="flex-shrink-0 bg-white shadow-lg border-r border-gray-200 transition-all duration-300"
       :class="sidebarOpen ? 'w-56' : 'w-16'">
  
  <div class="flex flex-col h-full">
    <div class="flex items-center justify-between h-16 p-4 border-b">
      <span class="font-bold text-purple-700 text-lg transition-opacity duration-300" :class="sidebarOpen ? 'opacity-100' : 'opacity-0'">Ajustes</span>
      <button @click="sidebarOpen = !sidebarOpen" class="text-gray-500 hover:text-purple-600 focus:outline-none">
        <svg x-show="sidebarOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        <svg x-show="!sidebarOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>
    
    <nav class="flex-1 py-4 space-y-2">
        {% for section_data in admin_sidebar_items %}
            {% if section_data.items %}
                <div class="px-4 pt-4 pb-2">
                    <span class="text-xs font-semibold text-gray-500 uppercase transition-opacity duration-300" :class="sidebarOpen ? 'opacity-100' : 'opacity-0'">
                        {{ section_data.section }}
                    </span>
                </div>
                {% for item in section_data.items %}
                <a href="{% if item.url_name %}{% url item.url_name %}{% else %}#{% endif %}" 
                   class="flex items-center px-4 py-2 rounded-lg transition hover:bg-purple-50 group {% if request.path == item.url_name %}bg-purple-100 text-purple-700{% endif %}"
                   title="{{ item.label }}">
                    <span class="material-icons text-purple-600 mr-3">{{ item.icon }}</span>
                    <span x-show="sidebarOpen" class="text-gray-800 font-medium">{{ item.label }}</span>
                </a>
                {% endfor %}
            {% endif %}
        {% endfor %}
    </nav>

    <div class="p-4 border-t text-xs text-gray-400" x-show="sidebarOpen">
      Synap ERP &copy; 2024
    </div>
  </div>
</aside>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
