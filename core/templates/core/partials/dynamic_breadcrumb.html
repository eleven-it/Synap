{% load menu_tags %}

<!-- Breadcrumb Dinámico -->
<div class="dynamic-breadcrumb bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 px-4 py-3">
    <div class="max-w-7xl mx-auto">
        {% render_breadcrumb request %}
    </div>
</div>

<style>
.dynamic-breadcrumb {
    @apply transition-all duration-200;
}

.dynamic-breadcrumb nav {
    @apply flex items-center;
}

.dynamic-breadcrumb ol {
    @apply flex items-center space-x-1 md:space-x-3;
}

.dynamic-breadcrumb li {
    @apply inline-flex items-center;
}

.dynamic-breadcrumb a {
    @apply inline-flex items-center text-sm font-medium text-gray-700 dark:text-gray-300 
           hover:text-orange-600 dark:hover:text-orange-400 transition-colors duration-200;
}

.dynamic-breadcrumb span {
    @apply text-sm font-medium text-gray-500 dark:text-gray-400;
}

.dynamic-breadcrumb i {
    @apply text-gray-400 mx-2;
}

/* Animación para breadcrumbs */
.dynamic-breadcrumb a:hover {
    @apply transform translate-x-1;
}

/* Responsive */
@media (max-width: 640px) {
    .dynamic-breadcrumb ol {
        @apply space-x-1;
    }
    
    .dynamic-breadcrumb a,
    .dynamic-breadcrumb span {
        @apply text-xs;
    }
}
</style>
