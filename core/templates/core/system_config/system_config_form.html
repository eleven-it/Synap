{% extends "core/core_app_base.html" %}
{% load i18n %}

{% block admin_content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ titulo }}</h1>
    
    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            <div>
                <label for="id_key" class="block text-sm font-medium text-gray-700">{% trans "Key" %}</label>
                {{ form.key }}
            </div>
            <div>
                <label for="id_value" class="block text-sm font-medium text-gray-700">{% trans "Value" %}</label>
                {{ form.value }}
            </div>
            <div>
                <label for="id_description" class="block text-sm font-medium text-gray-700">{% trans "Description" %}</label>
                {{ form.description }}
            </div>
            <div class="flex items-center pt-2">
                {{ form.is_active }}
                <label for="id_is_active" class="ml-2 block text-sm text-gray-900">{% trans "Active" %}</label>
            </div>
        </div>

        <div class="flex justify-end space-x-4 mt-8">
            <a href="{% url 'core:system_config_list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg">
                {% trans "Cancel" %}
            </a>
            <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg">
                {% trans "Save" %}
            </button>
        </div>
    </form>
</div>
{% endblock admin_content %}
