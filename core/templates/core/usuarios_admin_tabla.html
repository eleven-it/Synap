<div class="bg-white rounded-lg shadow-md overflow-hidden">
  <form method="post" id="users-form">
    {% csrf_token %}
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Usuario</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Roles</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Acciones</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        {% for usuario in usuarios %}
        <tr>
          <td class="px-6 py-4 whitespace-nowrap">
            <div class="text-sm font-medium text-gray-900">{{ usuario.nombre_completo }}</div>
            <div class="text-sm text-gray-500">{{ usuario.email }}</div>
          </td>
          <td class="px-6 py-4">
            <div class="flex flex-wrap gap-1">
              {% for rol in usuario.roles.all %}
              <span class="bg-purple-100 text-purple-800 text-xs font-medium px-2.5 py-0.5 rounded-full">{{ rol.nombre }}</span>
              {% empty %}
              <span class="text-xs text-gray-400">Sin roles</span>
              {% endfor %}
            </div>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button type="button" 
                    @click="$dispatch('open-edit-user-modal', { userId: {{ usuario.id }} })"
                    class="text-purple-600 hover:text-purple-900">
              Gestionar
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </form>
</div>
