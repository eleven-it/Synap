<div class="flex flex-wrap items-start justify-between gap-3">
    <div class="min-w-0">
        <nav class="text-xs text-gray-500 dark:text-gray-400" aria-label="Migas de pan">
            <a href="{% url 'mpr:tablero' %}" class="font-medium text-purple-600 hover:text-purple-800 dark:text-purple-400">Producción</a>
            <span class="mx-1 text-gray-300 dark:text-gray-600" aria-hidden="true">/</span>
            <span class="font-medium text-gray-700 dark:text-gray-300" aria-current="page">Reportes</span>
        </nav>
        <h1 class="mt-0.5 text-base font-bold leading-tight text-gray-900 dark:text-white sm:text-lg">
            {{ titulo_reporte }}
        </h1>
        <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">
            Período {{ fecha_desde_display }} — {{ fecha_hasta_display }}
            {% if modo_presentacion == "docenas" %} · Docenas · pares{% else %} · Pares{% endif %}
        </p>
    </div>
    <a href="{% url 'mpr:tablero' %}"
       class="inline-flex h-9 shrink-0 items-center gap-1 rounded-lg border border-gray-300 bg-white px-3 text-xs font-semibold text-gray-700 shadow-sm transition-colors hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700">
        <span class="material-icons text-base" aria-hidden="true">dashboard</span>
        Tablero
    </a>
</div>
