<div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
        <thead class="bg-gray-50 dark:bg-gray-800/50"><tr>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600">Estado</th>
            <th class="px-4 py-3 text-right text-xs font-semibold text-gray-600">Cantidad</th>
        </tr></thead>
        <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            {% for r in filas %}
            <tr><td class="px-4 py-3 text-sm font-medium">{{ r.estado|default:"-" }}</td><td class="px-4 py-3 text-right tabular-nums">{{ r.cantidad|default:"-" }}</td></tr>
            {% empty %}<tr><td colspan="2" class="px-4 py-8 text-center text-gray-500">Sin datos.</td></tr>{% endfor %}
        </tbody>
    </table>
</div>
