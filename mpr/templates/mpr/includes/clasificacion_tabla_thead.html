{# Cabecera de columnas — sticky dentro del overflow-auto de la grilla (fondos opacos). #}
<thead>
    <tr class="sticky top-0 z-30 border-b border-slate-200 bg-slate-50 dark:border-slate-600 dark:bg-slate-800">
        <th scope="col" class="sticky left-0 top-0 z-40 min-w-[5rem] bg-slate-50 px-2 py-2.5 text-center text-xs font-semibold uppercase text-slate-500 dark:bg-slate-800 dark:text-slate-400">Máq.</th>
        <th scope="col" class="sticky left-20 top-0 z-40 min-w-[13rem] border-r border-slate-200 bg-slate-50 px-3 py-2.5 text-left text-xs font-semibold uppercase text-slate-500 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-400">Artículo</th>
        <th scope="col" class="min-w-[6rem] bg-slate-50 px-3 py-2.5 text-left text-xs font-semibold uppercase text-slate-500 dark:bg-slate-800 dark:text-slate-400">Turno</th>
        <th scope="col" class="min-w-[8rem] bg-slate-50 px-3 py-2.5 text-left text-xs font-semibold uppercase text-slate-500 dark:bg-slate-800 dark:text-slate-400">Operario</th>
        <th scope="col" class="min-w-[7rem] bg-slate-50 px-3 py-2.5 text-center text-xs font-semibold uppercase text-slate-500 dark:bg-slate-800 dark:text-slate-400" title="Cantidad del parte (referencial) y extra producción disponible">Parte / Extra</th>
        <th scope="col" class="clasif-col min-w-[8.5rem] border-l-2 bg-slate-50 px-2 py-2.5 text-center clasif-col-tint-0 dark:bg-slate-800"><span class="text-xs font-semibold">Semi elaborado</span></th>
        <th scope="col" class="clasif-col min-w-[8.5rem] border-l-2 bg-slate-50 px-2 py-2.5 text-center clasif-col-tint-1 dark:bg-slate-800"><span class="text-xs font-semibold">2da selección</span></th>
        <th scope="col" class="clasif-col min-w-[8.5rem] border-l-2 bg-slate-50 px-2 py-2.5 text-center clasif-col-tint-2 dark:bg-slate-800"><span class="text-xs font-semibold">Desperdicio</span></th>
    </tr>
</thead>
