{# Cabecera de columnas — Control de calidad (compartida con/sin filas). #}
<thead>
    <tr class="border-b border-slate-200 bg-slate-50/95 dark:border-slate-600 dark:bg-slate-800/90">
        <th scope="col" class="sticky left-0 z-10 min-w-[5rem] bg-slate-50/95 px-2 py-2.5 text-center text-xs font-semibold uppercase text-slate-500 dark:bg-slate-800/95">Máq.</th>
        <th scope="col" class="sticky left-20 z-10 min-w-[13rem] border-r border-slate-200 bg-slate-50/95 px-3 py-2.5 text-left text-xs font-semibold uppercase text-slate-500 dark:border-slate-600 dark:bg-slate-800/95">Artículo</th>
        <th scope="col" class="min-w-[6rem] px-3 py-2.5 text-left text-xs font-semibold uppercase text-slate-500">Turno</th>
        <th scope="col" class="min-w-[8rem] px-3 py-2.5 text-left text-xs font-semibold uppercase text-slate-500">Operario</th>
        <th scope="col" class="min-w-[7rem] px-3 py-2.5 text-center text-xs font-semibold uppercase text-slate-500" title="Cantidad del parte (referencial)">Parte</th>
        <th scope="col" class="clasif-col min-w-[8.5rem] border-l-2 px-2 py-2.5 text-center clasif-col-tint-0"><span class="text-xs font-semibold">Semi elaborado</span></th>
        <th scope="col" class="clasif-col min-w-[8.5rem] border-l-2 px-2 py-2.5 text-center clasif-col-tint-1"><span class="text-xs font-semibold">2da selección</span></th>
        <th scope="col" class="clasif-col min-w-[8.5rem] border-l-2 px-2 py-2.5 text-center clasif-col-tint-2"><span class="text-xs font-semibold">Desperdicio</span></th>
    </tr>
</thead>
