{# Botón canónico «Control de calidad» — teal en todo MPR (variant: solid | outline | nav | icon). #}
<a href="{% url 'mpr:clasificacion_produccion' %}{% if fecha_str and turno_id %}?fecha={{ fecha_str|urlencode }}&amp;turno_id={{ turno_id }}{% endif %}"
   {% if variant == 'icon' %}title="Control de calidad" aria-label="Control de calidad"{% endif %}
   class="{% if variant == 'icon' %}inline-flex h-8 w-8 items-center justify-center rounded-lg border border-teal-500/50 bg-teal-900/40 text-teal-100 transition-colors hover:bg-teal-800/50 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-400/50{% elif variant == 'nav' %}inline-flex items-center gap-1 rounded-lg bg-teal-50 px-2.5 py-1 text-xs font-semibold text-teal-800 transition-colors hover:bg-teal-100 hover:text-teal-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500/40 dark:bg-teal-950/35 dark:text-teal-200 dark:hover:bg-teal-900/45 dark:hover:text-teal-100{% elif variant == 'outline' %}inline-flex min-h-9 items-center justify-center gap-1.5 rounded-lg border border-teal-300 bg-teal-50 px-3.5 py-2 text-xs font-semibold text-teal-800 shadow-sm transition-colors hover:bg-teal-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-500 focus-visible:ring-offset-2 dark:border-teal-700 dark:bg-teal-950/40 dark:text-teal-200 dark:hover:bg-teal-950/60 dark:focus-visible:ring-offset-gray-900 sm:text-sm{% else %}inline-flex min-h-8 items-center gap-1.5 rounded-lg bg-teal-600 px-3 py-1.5 text-xs font-semibold text-white shadow-sm transition-colors hover:bg-teal-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-800{% endif %}{% if class_extra %} {{ class_extra }}{% endif %}">
    <span class="material-icons {% if variant == 'icon' %}text-lg leading-none{% elif variant == 'outline' %}text-base sm:text-lg{% elif variant == 'nav' %}text-sm{% else %}text-base{% endif %}" aria-hidden="true">verified</span>
    {% if variant != 'icon' %}Control de calidad{% endif %}
</a>
