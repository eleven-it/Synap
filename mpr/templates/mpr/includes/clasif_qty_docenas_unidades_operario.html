<div class="clasif-celda-cantidad mx-auto flex w-full max-w-[9rem] flex-col items-center"
     data-clasif-dest="{{ prefix }}"
     data-id-art="{{ id_art }}"
     data-id-operario="{{ id_operario }}"
     {% if id_turno %}data-id-turno="{{ id_turno }}"{% endif %}
     {% if id_maquina is not None %}data-id-maquina="{{ id_maquina }}"{% endif %}>
    <div class="clasif-qty-group flex w-full overflow-hidden rounded-lg border bg-white shadow-sm transition-shadow dark:bg-slate-900 {% if readonly %}border-slate-200 opacity-90 dark:border-slate-600{% else %}{{ ring_class }}{% endif %}"
         {% if not readonly %}:class="excede ? 'border-red-400 ring-2 ring-red-500/30' : 'border-slate-300/90 dark:border-slate-500'"{% endif %}>
        <label class="flex min-w-0 flex-1 flex-col">
            <span class="bg-slate-50/90 px-0.5 py-0.5 text-center text-[9px] font-semibold leading-tight text-slate-500 dark:bg-slate-800/90 dark:text-slate-400">Docenas</span>
            <input type="number"
                   {% if not readonly %}name="{% if id_turno %}{{ prefix }}_{{ id_art }}_op_{{ id_operario }}_turno_{{ id_turno }}_maq_{{ id_maquina|default:0 }}_docenas{% else %}{{ prefix }}_{{ id_art }}_op_{{ id_operario }}_docenas{% endif %}"{% endif %}
                   min="0" step="1" inputmode="numeric"
                   placeholder="0"
                   x-model.number="{{ model_doc }}"
                   {% if readonly %}readonly tabindex="-1"{% else %}@input="coerceQtyField('{{ model_doc }}', $event.target)" @blur="coerceQtyField('{{ model_doc }}', $event.target)" @focus="$event.target.select()"{% endif %}
                   data-clasif-part="docenas"
                   {% if not readonly %}data-clasif-qty-input{% endif %}
                   data-clasif-dest="{{ prefix }}"
                   data-id-art="{{ id_art }}"
                   class="clasif-input-docenas h-9 w-full border-0 bg-transparent px-1 text-center text-sm font-semibold tabular-nums text-slate-800 placeholder:text-slate-300 focus:outline-none focus:ring-0 dark:text-slate-100 dark:placeholder:text-slate-600{% if readonly %} cursor-default text-slate-600 dark:text-slate-300{% endif %}"
                   aria-label="Docenas {{ destino_label }} {{ codigo }} — {{ operario_nombre }}{% if readonly %} (solo lectura){% endif %}"
                   {% if readonly %}aria-readonly="true"{% endif %}>
        </label>
        <div class="flex w-5 shrink-0 flex-col items-center justify-center border-x border-slate-200 bg-slate-50/90 dark:border-slate-600 dark:bg-slate-800/80" aria-hidden="true">
            <span class="text-[10px] font-bold leading-none text-slate-300 dark:text-slate-600">+</span>
        </div>
        <label class="flex min-w-0 flex-1 flex-col">
            <span class="bg-slate-50/90 px-0.5 py-0.5 text-center text-[9px] font-semibold leading-tight text-slate-500 dark:bg-slate-800/90 dark:text-slate-400">Pares</span>
            <input type="number"
                   {% if not readonly %}name="{% if id_turno %}{{ prefix }}_{{ id_art }}_op_{{ id_operario }}_turno_{{ id_turno }}_maq_{{ id_maquina|default:0 }}_unidades{% else %}{{ prefix }}_{{ id_art }}_op_{{ id_operario }}_unidades{% endif %}"{% endif %}
                   min="0" step="1" inputmode="numeric"
                   placeholder="0"
                   x-model.number="{{ model_uni }}"
                   {% if readonly %}readonly tabindex="-1"{% else %}@input="coerceQtyField('{{ model_uni }}', $event.target)" @blur="coerceQtyField('{{ model_uni }}', $event.target)" @focus="$event.target.select()"{% endif %}
                   data-clasif-part="unidades"
                   {% if not readonly %}data-clasif-qty-input{% endif %}
                   data-clasif-dest="{{ prefix }}"
                   data-id-art="{{ id_art }}"
                   class="clasif-input-unidades h-9 w-full border-0 bg-transparent px-1 text-center text-sm font-semibold tabular-nums text-slate-800 placeholder:text-slate-300 focus:outline-none focus:ring-0 dark:text-slate-100 dark:placeholder:text-slate-600{% if readonly %} cursor-default text-slate-600 dark:text-slate-300{% endif %}"
                   aria-label="Pares sueltos {{ destino_label }} {{ codigo }} — {{ operario_nombre }}{% if readonly %} (solo lectura){% endif %}"
                   {% if readonly %}aria-readonly="true"{% endif %}>
        </label>
    </div>
    <p class="clasif-celda-subtotal mt-1 min-h-[1rem] w-full text-center text-[10px] font-medium tabular-nums leading-4"
       x-text="'= ' + {{ subtotal_alpine }} + ' pares'"
       :class="{{ subtotal_alpine }} > 0 ? 'text-purple-600 dark:text-purple-400' : 'text-slate-300 dark:text-slate-600'"></p>
</div>
