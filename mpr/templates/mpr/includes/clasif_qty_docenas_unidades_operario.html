{# Celda docenas + unidades para clasificación por operario fabricante. #}
<div class="clasif-celda-cantidad mx-auto flex w-full max-w-[9rem] flex-col items-center"
     data-clasif-dest="{{ prefix }}"
     data-id-art="{{ id_art }}"
     data-id-operario="{{ id_operario }}">
    <div class="clasif-qty-group flex w-full overflow-hidden rounded-lg border bg-white shadow-sm transition-shadow dark:bg-slate-900 {{ ring_class }}"
         :class="excede ? 'border-red-400 ring-2 ring-red-500/30' : 'border-slate-300/90 dark:border-slate-500'">
        <label class="flex min-w-0 flex-1 flex-col">
            <span class="bg-slate-50/90 px-0.5 py-0.5 text-center text-[9px] font-semibold leading-tight text-slate-500 dark:bg-slate-800/90 dark:text-slate-400">Docenas</span>
            <input type="number"
                   name="{{ prefix }}_{{ id_art }}_op_{{ id_operario }}_docenas"
                   min="0" step="1" inputmode="numeric"
                   placeholder="0"
                   x-model.number="{{ model_doc }}"
                   @blur="coerceQtyField('{{ model_doc }}', $event.target)"
                   @focus="$event.target.select()"
                   data-clasif-part="docenas"
                   data-clasif-qty-input
                   data-clasif-dest="{{ prefix }}"
                   data-id-art="{{ id_art }}"
                   class="clasif-input-docenas h-9 w-full border-0 bg-transparent px-1 text-center text-sm font-semibold tabular-nums text-slate-800 placeholder:text-slate-300 focus:outline-none focus:ring-0 dark:text-slate-100 dark:placeholder:text-slate-600"
                   aria-label="Docenas {{ destino_label }} {{ codigo }} — {{ operario_nombre }}">
        </label>
        <div class="flex w-5 shrink-0 flex-col items-center justify-center border-x border-slate-200 bg-slate-50/90 dark:border-slate-600 dark:bg-slate-800/80" aria-hidden="true">
            <span class="text-[10px] font-bold leading-none text-slate-300 dark:text-slate-600">+</span>
        </div>
        <label class="flex min-w-0 flex-1 flex-col">
            <span class="bg-slate-50/90 px-0.5 py-0.5 text-center text-[9px] font-semibold leading-tight text-slate-500 dark:bg-slate-800/90 dark:text-slate-400">Unidades</span>
            <input type="number"
                   name="{{ prefix }}_{{ id_art }}_op_{{ id_operario }}_unidades"
                   min="0" step="1" inputmode="numeric"
                   placeholder="0"
                   x-model.number="{{ model_uni }}"
                   @blur="coerceQtyField('{{ model_uni }}', $event.target)"
                   @focus="$event.target.select()"
                   data-clasif-part="unidades"
                   data-clasif-qty-input
                   data-clasif-dest="{{ prefix }}"
                   data-id-art="{{ id_art }}"
                   class="clasif-input-unidades h-9 w-full border-0 bg-transparent px-1 text-center text-sm font-semibold tabular-nums text-slate-800 placeholder:text-slate-300 focus:outline-none focus:ring-0 dark:text-slate-100 dark:placeholder:text-slate-600"
                   aria-label="Unidades sueltas {{ destino_label }} {{ codigo }} — {{ operario_nombre }}">
        </label>
    </div>
    <p class="clasif-celda-subtotal mt-1 min-h-[1rem] w-full text-center text-[10px] font-medium tabular-nums leading-4"
       x-text="'= ' + {{ subtotal_alpine }} + ' u.'"
       :class="{{ subtotal_alpine }} > 0 ? 'text-purple-600 dark:text-purple-400' : 'text-slate-300 dark:text-slate-600'"></p>
</div>
