{# Modal resultado ejecución lote armado surtido — canon MPR dark/light #}
<div x-show="modalResultado.open"
     x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="modal-resultado-lote-title"
     @keydown.escape.window="cerrarModalResultado()">
    <div class="flex min-h-full items-end justify-center p-4 sm:items-center sm:p-6">
        <div class="fixed inset-0 bg-black/50 transition-opacity" @click="cerrarModalResultado()" aria-hidden="true"></div>
        <div class="relative w-full max-w-5xl rounded-2xl border border-gray-200 bg-white p-5 shadow-xl dark:border-gray-700 dark:bg-gray-800 sm:p-6"
             @click.stop>
            <h2 id="modal-resultado-lote-title" class="text-lg font-semibold text-gray-900 dark:text-white">
                Resultado del lote
            </h2>
            <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
                <span x-text="modalResultado.exitosos.length"></span> grabado(s),
                <span x-text="modalResultado.fallidos.length"></span> no grabado(s).
            </p>

            <div class="mt-5 space-y-6 max-h-[60vh] overflow-y-auto">
                <section x-show="modalResultado.exitosos.length">
                    <h3 class="mb-2 text-sm font-bold uppercase tracking-wide text-emerald-700 dark:text-emerald-400">Grabados</h3>
                    <div class="overflow-x-auto rounded-xl border border-gray-200 dark:border-gray-600">
                        <table class="min-w-full divide-y divide-gray-200 text-sm dark:divide-gray-700">
                            <thead class="bg-gray-50 dark:bg-gray-800/80">
                                <tr>
                                    <th class="px-3 py-2 text-left font-semibold text-gray-600 dark:text-gray-300">Pack descripción</th>
                                    <th class="px-3 py-2 text-right font-semibold text-gray-600 dark:text-gray-300">Cantidad grabada</th>
                                    <th class="px-3 py-2 text-right font-semibold text-gray-600 dark:text-gray-300">Saldo inicial</th>
                                    <th class="px-3 py-2 text-right font-semibold text-gray-600 dark:text-gray-300">Saldo final</th>
                                    <th class="px-3 py-2 text-left font-semibold text-gray-600 dark:text-gray-300">Comprobante</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 bg-white dark:divide-gray-700 dark:bg-gray-800">
                                <template x-for="(ex, idx) in modalResultado.exitosos" :key="'ex-' + idx">
                                    <tr>
                                        <td class="max-w-xs px-3 py-2 text-gray-900 dark:text-white">
                                            <span class="line-clamp-2" x-text="ex.descripcion_pack || ex.descripcion_articulo_pack || ex.codigo_articulo_pack || ex.id_articulo_pack"></span>
                                        </td>
                                        <td class="whitespace-nowrap px-3 py-2 text-right tabular-nums text-gray-800 dark:text-gray-200" x-text="ex.cantidad_grabada != null ? ex.cantidad_grabada : ex.cantidad_packs"></td>
                                        <td class="whitespace-nowrap px-3 py-2 text-right tabular-nums text-gray-700 dark:text-gray-300" x-text="ex.saldo_inicial != null ? ex.saldo_inicial : '—'"></td>
                                        <td class="whitespace-nowrap px-3 py-2 text-right tabular-nums font-medium text-gray-900 dark:text-white" x-text="ex.saldo_final != null ? ex.saldo_final : '—'"></td>
                                        <td class="whitespace-nowrap px-3 py-2 font-medium text-gray-900 dark:text-white" x-text="ex.nro_comprobante || '—'"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </section>

                <section x-show="modalResultado.fallidos.length">
                    <h3 class="mb-2 text-sm font-bold uppercase tracking-wide text-red-700 dark:text-red-400">No grabados</h3>
                    <div class="overflow-x-auto rounded-xl border border-red-200 dark:border-red-900/50">
                        <table class="min-w-full divide-y divide-gray-200 text-sm dark:divide-gray-700">
                            <thead class="bg-red-50 dark:bg-red-950/30">
                                <tr>
                                    <th class="px-3 py-2 text-left font-semibold text-gray-600 dark:text-gray-300">Pack</th>
                                    <th class="px-3 py-2 text-right font-semibold text-gray-600 dark:text-gray-300">Cant.</th>
                                    <th class="px-3 py-2 text-left font-semibold text-gray-600 dark:text-gray-300">Motivo</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100 bg-white dark:divide-gray-700 dark:bg-gray-800">
                                <template x-for="(fa, idx) in modalResultado.fallidos" :key="'fa-' + idx">
                                    <tr>
                                        <td class="px-3 py-2 text-gray-900 dark:text-white" x-text="fa.descripcion_pack || fa.id_articulo_pack"></td>
                                        <td class="px-3 py-2 text-right tabular-nums text-gray-800 dark:text-gray-200" x-text="fa.cantidad_packs"></td>
                                        <td class="px-3 py-2 text-red-700 dark:text-red-300" x-text="fa.error || 'Error desconocido'"></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <div class="mt-6 flex justify-end">
                <button type="button"
                        @click="cerrarModalResultado()"
                        class="inline-flex min-h-10 items-center justify-center rounded-xl border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-800 shadow-sm transition-colors hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-500 focus-visible:ring-offset-2 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-100 dark:hover:bg-gray-700 dark:focus-visible:ring-offset-gray-800">
                    Cerrar
                </button>
            </div>
        </div>
    </div>
</div>
