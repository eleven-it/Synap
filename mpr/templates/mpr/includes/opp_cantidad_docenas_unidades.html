{# Cantidad OPP: docenas y unidades sueltas (divisor 12). Espera ``du`` con docenas/unidades. #}
<span class="tabular-nums leading-snug">
    <span class="block font-medium text-gray-900 dark:text-white">{{ du.docenas }} docena{{ du.docenas|pluralize }}</span>
    <span class="block text-xs text-gray-600 dark:text-gray-400">{{ du.unidades }} unidad{{ du.unidades|pluralize:"es" }}</span>
</span>
