{# Burbuja tooltip chrome (estilo BO). Padre: class con group relative. Param: texto #}
<span role="tooltip"
      class="pointer-events-none absolute left-1/2 top-full z-[70] mt-1.5 -translate-x-1/2 whitespace-nowrap rounded-md border border-slate-700 bg-slate-900 px-2 py-1 text-[11px] font-medium text-white opacity-0 shadow-lg transition-opacity duration-100 group-hover:opacity-100 group-focus-visible:opacity-100">{{ texto }}</span>
