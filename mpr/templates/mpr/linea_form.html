{% extends "mpr/base_mpr.html" %}
{% load static %}

{% block title %}{{ titulo }} - MPR - Synap{% endblock %}

{% block content %}
<section class="flex min-h-screen flex-col bg-gray-50 py-8 transition-colors duration-300 dark:bg-gray-900 sm:py-10">
    <div class="mpr-contenedor-pagina mx-auto w-full min-w-0 max-w-none px-3 sm:px-4 md:px-6 lg:px-8 xl:px-10 2xl:px-12">
        <nav class="mb-8 text-sm text-gray-500 dark:text-gray-400" aria-label="Migas de pan">
            <ol class="flex flex-wrap items-center gap-x-2 gap-y-1">
                <li>
                    <a href="{% url 'mpr:tablero' %}" class="rounded font-medium text-purple-600 transition-colors hover:text-purple-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-500 focus-visible:ring-offset-2 dark:text-purple-400 dark:hover:text-purple-300 dark:focus-visible:ring-offset-gray-900">Producción</a>
                </li>
                <li class="text-gray-300 dark:text-gray-600" aria-hidden="true">/</li>
                <li>
                    <a href="{% url 'mpr:lineas_list' %}" class="rounded font-medium text-purple-600 transition-colors hover:text-purple-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-500 focus-visible:ring-offset-2 dark:text-purple-400 dark:hover:text-purple-300 dark:focus-visible:ring-offset-gray-900">Líneas</a>
                </li>
                <li class="text-gray-300 dark:text-gray-600" aria-hidden="true">/</li>
                <li><span class="font-medium text-gray-800 dark:text-gray-200" aria-current="page">{{ titulo }}</span></li>
            </ol>
        </nav>

        <header class="mb-8 border-b border-gray-200/80 pb-8 dark:border-gray-700/80">
            <h1 class="text-2xl font-bold tracking-tight text-gray-900 dark:text-white sm:text-3xl">{{ titulo }}</h1>
        </header>

        <div class="max-w-2xl">
            <form method="post" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 dark:text-gray-200">Nombre de la línea</label>
                    <input type="text" id="nombre" name="nombre" value="{{ nombre|default:'' }}"
                           required maxlength="100"
                           placeholder="Ej: Línea 1, Línea 2"
                           class="mt-1.5 block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-900 shadow-sm focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-500/30 dark:border-gray-600 dark:bg-gray-900 dark:text-white dark:placeholder:text-gray-500"/>
                </div>
                <div class="flex flex-wrap gap-3 pt-4">
                    <button type="submit" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-xl bg-purple-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-purple-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-gray-900">
                        <span class="material-icons text-lg" aria-hidden="true">save</span>
                        {{ accion }}
                    </button>
                    <a href="{% url 'mpr:lineas_list' %}" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-xl border border-gray-300 bg-white px-5 py-2.5 text-sm font-semibold text-gray-700 shadow-sm transition-colors hover:bg-gray-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-500 focus-visible:ring-offset-2 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700 dark:focus-visible:ring-offset-gray-900">
                        <span class="material-icons text-lg" aria-hidden="true">close</span>
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
