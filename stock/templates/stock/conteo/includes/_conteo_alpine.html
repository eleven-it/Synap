{% comment %}
Lógica Alpine compartida del conteo de inventario físico.
La usan el template desktop (stock/conteo/conteo.html) y el mobile
(stock/conteo/mobile/conteo.html): ambos renderizan distinta UI sobre el
mismo estado (escáner, cantidad, cola offline, historial).
{% endcomment %}
<script>
function conteoInvFisico() {
  var cfg = {
    idCampana: {{ campana.id_campana }},
    idDeposito: {% if deposito_sel %}{{ deposito_sel.id_deposito }}{% else %}null{% endif %},
    catalogoVersion: '{{ campana.catalogo_version|escapejs }}',
    urlPrefetch: '{{ url_prefetch|escapejs }}',
    urlSync: '{{ url_sync|escapejs }}',
    urlRegistrados: '{{ url_registrados|escapejs }}',
    csrf: document.querySelector('[name=csrfmiddlewaretoken]')?.value || '{{ csrf_token }}',
  };

  // Una cantidad de conteo nunca tiene tantos dígitos: largos típicos de EAN/UPC.
  var LARGOS_CODIGO_BARRAS = [8, 12, 13, 14];
  var MAX_DIGITOS_CANTIDAD = 6;
  // Ventana en la que el lector wedge sigue "tipeando" tras resolver el artículo.
  var MS_BLOQUEO_WEDGE = 400;

  return {
    online: navigator.onLine,
    syncEnCurso: false,
    scannerActivo: false,
    scannerError: '',
    tieneCamera: false,
    camaraDisponible: false,
    _html5QrCode: null,
    _scannerStopPromise: null,
    _procesandoScan: false,
    _busquedaTimeout: null,
    _bloqueoWedgeHasta: 0,
    articuloSel: null,
    cantidadInput: '',
    codigoManual: '',
    resultadosBusqueda: [],
    indiceSugerencia: -1,
    mostrarManual: false,
    confirmOpen: false,
    confirmMensaje: '',
    _pendingConteo: null,
    contados: 0,
    totalCatalogo: 0,
    pendientesSync: 0,
    contadosLocal: new Set(),
    historialConteos: [],
    filtroHistorial: '',
    mostrarHistorial: false,
    cantidadPrevia: '',
    mensajeOk: '',
    mensajeError: '',
    ultimaAccion: '',
    bannerSync: '',

    get porcentajeAvance() {
      if (!this.totalCatalogo) return 0;
      return Math.min(100, Math.round(this.contados * 100 / this.totalCatalogo));
    },

    get yaContadoActual() {
      return !!(this.articuloSel && this.contadosLocal.has(this.articuloSel.id_articulo));
    },

    get avisoCantidad() {
      if (!String(this.cantidadInput || '').trim()) return '';
      return this.validarCantidad(this.cantidadInput);
    },

    get historialFiltrado() {
      var q = String(this.filtroHistorial || '').trim().toLowerCase();
      if (!q) return this.historialConteos;
      return this.historialConteos.filter(function (it) {
        var codigo = String((it && it.codigo) || '').toLowerCase();
        var nombre = String((it && it.nombre) || '').toLowerCase();
        return codigo.indexOf(q) !== -1 || nombre.indexOf(q) !== -1;
      });
    },

    async init() {
      if (!cfg.idDeposito || !window.InvFisicoOffline) return;
      this.camaraDisponible = typeof window !== 'undefined' && window.isSecureContext === true;
      if (typeof navigator !== 'undefined' && navigator.mediaDevices
          && typeof navigator.mediaDevices.enumerateDevices === 'function') {
        try {
          var devices = await navigator.mediaDevices.enumerateDevices();
          this.tieneCamera = devices.some(function (d) { return d.kind === 'videoinput'; });
        } catch (e) {
          this.tieneCamera = false;
        }
      }
      await this.actualizarPendientes();
      if (this.online) {
        await this.prefetchCatalogo();
      } else {
        this.totalCatalogo = await window.InvFisicoOffline.contarCatalogo();
        this.bannerSync = this.pendientesSync
          ? this.pendientesSync + ' pendientes de sync'
          : 'Sin conexión — modo offline';
      }
      await this.cargarHistorialConteos();
    },

    async guardarConteoLocalSafe(registro) {
      var off = window.InvFisicoOffline;
      if (off && typeof off.guardarConteoLocal === 'function') {
        await off.guardarConteoLocal(cfg.idCampana, cfg.idDeposito, registro);
        return;
      }
      // Fallback memoria si el JS estático está cacheado sin la API nueva
      var lista = (this.historialConteos || []).slice();
      var idx = lista.findIndex(function (it) { return Number(it.id_articulo) === Number(registro.id_articulo); });
      var row = {
        id_articulo: registro.id_articulo,
        cantidad: String(registro.cantidad),
        codigo: registro.codigo || '-',
        nombre: registro.nombre || '-',
        ts: registro.ts || new Date().toISOString(),
      };
      if (idx >= 0) lista[idx] = row;
      else lista.unshift(row);
      lista.sort(function (a, b) { return String(b.ts || '').localeCompare(String(a.ts || '')); });
      this.historialConteos = lista;
      this.contadosLocal.add(registro.id_articulo);
      this.contados = this.contadosLocal.size;
    },

    async listarConteosLocalesSafe() {
      var off = window.InvFisicoOffline;
      if (off && typeof off.listarConteosLocales === 'function') {
        return await off.listarConteosLocales(cfg.idCampana, cfg.idDeposito);
      }
      return (this.historialConteos || []).slice();
    },

    async obtenerConteoLocalSafe(idArticulo) {
      var off = window.InvFisicoOffline;
      if (off && typeof off.obtenerConteoLocal === 'function') {
        return await off.obtenerConteoLocal(cfg.idCampana, cfg.idDeposito, idArticulo);
      }
      var hit = (this.historialConteos || []).find(function (it) {
        return Number(it.id_articulo) === Number(idArticulo);
      });
      return hit || null;
    },

    async cargarHistorialConteos() {
      if (!window.InvFisicoOffline || !cfg.idDeposito) return;
      var mapa = {};
      try {
        var locales = await this.listarConteosLocalesSafe();
        (locales || []).forEach(function (it) {
          if (!it || it.id_articulo == null) return;
          mapa[String(it.id_articulo)] = {
            id_articulo: it.id_articulo,
            codigo: it.codigo || '-',
            nombre: it.nombre || '-',
            cantidad: String(it.cantidad),
            ts: it.ts || '',
            origen: 'local',
          };
        });
      } catch (e) { /* sin local */ }

      if (this.online && cfg.urlRegistrados) {
        try {
          var params = new URLSearchParams({
            id_campana: String(cfg.idCampana),
            id_deposito: String(cfg.idDeposito),
          });
          var r = await fetch(cfg.urlRegistrados + '?' + params.toString(), {
            credentials: 'same-origin',
            headers: { 'Accept': 'application/json', 'X-CSRFToken': cfg.csrf },
          });
          var data = await r.json().catch(function () { return {}; });
          if (r.ok) {
            (data.contados || []).forEach(function (it) {
              if (!it || it.id_articulo == null) return;
              var key = String(it.id_articulo);
              var row = {
                id_articulo: it.id_articulo,
                codigo: it.codigo || '-',
                nombre: it.nombre || '-',
                cantidad: String(it.cantidad),
                ts: it.ts || '',
                origen: 'servidor',
              };
              var prev = mapa[key];
              if (!prev || String(prev.ts || '') <= String(row.ts || '')) {
                mapa[key] = row;
              }
            });
            var keys = Object.keys(mapa);
            for (var i = 0; i < keys.length; i++) {
              var reg = mapa[keys[i]];
              try {
                await this.guardarConteoLocalSafe({
                  id_articulo: reg.id_articulo,
                  cantidad: reg.cantidad,
                  codigo: reg.codigo,
                  nombre: reg.nombre,
                  ts: reg.ts || new Date().toISOString(),
                });
              } catch (e2) { /* ignore seed */ }
            }
          }
        } catch (e) { /* offline o error: seguir con local */ }
      }

      var lista = Object.keys(mapa).map(function (k) { return mapa[k]; });
      lista.sort(function (a, b) {
        return String(b.ts || '').localeCompare(String(a.ts || ''));
      });
      this.historialConteos = lista;
      this.contadosLocal = new Set(lista.map(function (it) { return it.id_articulo; }));
      this.contados = this.contadosLocal.size;
    },

    abrirIngresoManual() {
      this.mostrarManual = true;
      this.codigoManual = '';
      this.resultadosBusqueda = [];
      this.indiceSugerencia = -1;
      this.mensajeError = '';
    },

    cerrarIngresoManual() {
      if (this._busquedaTimeout) {
        clearTimeout(this._busquedaTimeout);
        this._busquedaTimeout = null;
      }
      this.mostrarManual = false;
      this.codigoManual = '';
      this.resultadosBusqueda = [];
      this.indiceSugerencia = -1;
    },

    buscarPredictivoDebounce() {
      var self = this;
      if (this._busquedaTimeout) clearTimeout(this._busquedaTimeout);
      this._busquedaTimeout = setTimeout(function () {
        self.buscarPredictivo();
      }, 250);
    },

    async buscarPredictivo() {
      if (this.totalCatalogo === 0) {
        this.resultadosBusqueda = [];
        this.indiceSugerencia = -1;
        return;
      }
      var consulta = String(this.codigoManual || '').trim();
      if (!consulta) {
        this.resultadosBusqueda = [];
        this.indiceSugerencia = -1;
        return;
      }
      var hits = await window.InvFisicoOffline.buscarPorEanONombre(consulta, 40);
      this.resultadosBusqueda = hits;
      this.indiceSugerencia = hits.length ? 0 : -1;
    },

    navegarSugerencias(delta) {
      var n = this.resultadosBusqueda.length;
      if (!n) return;
      if (this.indiceSugerencia < 0) {
        this.indiceSugerencia = delta > 0 ? 0 : n - 1;
      } else {
        this.indiceSugerencia = (this.indiceSugerencia + delta + n) % n;
      }
      this.$nextTick(() => {
        var el = document.getElementById('sugerencia-manual-' + this.indiceSugerencia);
        if (el) el.scrollIntoView({ block: 'nearest' });
      });
    },

    async onEnterIngresoManual() {
      if (this.totalCatalogo === 0) return;
      var consulta = String(this.codigoManual || '').trim();
      if (!consulta && this.indiceSugerencia < 0) return;

      var hits = this.resultadosBusqueda.length
        ? this.resultadosBusqueda
        : await window.InvFisicoOffline.buscarPorEanONombre(consulta, 40);

      if (!hits.length) {
        this.mensajeError = 'Sin coincidencias por EAN o nombre en esta campaña.';
        this.cerrarIngresoManual();
        return;
      }

      if (this.indiceSugerencia >= 0 && this.indiceSugerencia < hits.length) {
        this.seleccionarArticulo(hits[this.indiceSugerencia]);
        return;
      }

      var exactoEan = await window.InvFisicoOffline.buscarPorEan(consulta);
      if (exactoEan) {
        this.seleccionarArticulo(exactoEan);
        return;
      }
      this.seleccionarArticulo(hits[0]);
    },

    mensajeErrorCamara(err) {
      var name = err && err.name;
      if (name === 'NotAllowedError') {
        return 'Permiso de cámara denegado. Autorizá el acceso en el navegador o ingresá el código manualmente.';
      }
      if (name === 'NotFoundError') {
        return 'No se encontró cámara en este dispositivo. Ingresá el código manualmente.';
      }
      if (name === 'NotReadableError') {
        return 'La cámara está en uso por otra aplicación. Cerrala e intentá de nuevo, o ingresá el código manualmente.';
      }
      if (name === 'SecurityError') {
        return 'Acceso a la cámara bloqueado por seguridad (se requiere HTTPS). Ingresá el código manualmente.';
      }
      return 'No se pudo acceder a la cámara. Ingresá el código manualmente.';
    },

    onOnline() {
      this.online = true;
      this.bannerSync = this.pendientesSync ? this.pendientesSync + ' pendientes de sync' : '';
      this.sincronizar();
    },

    onOffline() {
      this.online = false;
      this.bannerSync = 'Sin conexión — los conteos se guardan en cola local';
    },

    async prefetchCatalogo() {
      try {
        var params = new URLSearchParams({
          id_campana: String(cfg.idCampana),
          id_deposito: String(cfg.idDeposito),
        });
        var r = await fetch(cfg.urlPrefetch + '?' + params.toString(), {
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json', 'X-CSRFToken': cfg.csrf },
        });
        var data = await r.json();
        if (!r.ok) throw new Error(data.error || 'No se pudo descargar el catálogo.');
        var arts = data.articulos || [];
        await window.InvFisicoOffline.guardarCatalogo({
          id_campana: cfg.idCampana,
          id_deposito: cfg.idDeposito,
          catalogo_version: data.catalogo_version,
        }, arts);
        this.totalCatalogo = arts.length;
        this.mensajeError = '';
      } catch (e) {
        this.mensajeError = e.message || 'Error al cargar catálogo.';
      }
    },

    async actualizarPendientes() {
      if (!window.InvFisicoOffline) return;
      this.pendientesSync = await window.InvFisicoOffline.contarPendientes(cfg.idCampana);
      if (this.pendientesSync && this.online) {
        this.bannerSync = this.pendientesSync + ' pendientes de sync';
      }
    },

    async sincronizar() {
      if (!this.online || !window.InvFisicoOffline || this.syncEnCurso) return;
      this.syncEnCurso = true;
      try {
        var res = await window.InvFisicoOffline.syncBatch(cfg.urlSync, cfg.csrf, cfg.idCampana);
        await this.actualizarPendientes();
        if (res.conflictos && res.conflictos.length) {
          this.mensajeError = 'Hay ' + res.conflictos.length + ' conflicto(s) de conteo.';
        } else if (res.aceptados && res.aceptados.length) {
          this.mensajeOk = res.aceptados.length + ' conteo(s) sincronizado(s).';
          this.bannerSync = this.pendientesSync ? this.pendientesSync + ' pendientes de sync' : '';
        }
        await this.cargarHistorialConteos();
      } catch (e) {
        this.mensajeError = e.message || 'No se pudo sincronizar.';
      } finally {
        this.syncEnCurso = false;
      }
    },

    abrirScanner() {
      if (typeof Html5Qrcode === 'undefined') {
        this.scannerError = 'La librería del escáner no se cargó. Recargá la página o usá ingreso manual.';
        this.abrirIngresoManual();
        return;
      }
      if (!window.isSecureContext) {
        this.scannerError = 'La cámara requiere HTTPS o localhost. Usá ingreso manual.';
        this.abrirIngresoManual();
        return;
      }
      if (!this.tieneCamera) {
        this.scannerError = 'No se detectó cámara en este dispositivo. Usá ingreso manual.';
        this.abrirIngresoManual();
        return;
      }
      this.scannerError = '';
      this.scannerActivo = true;
      var self = this;
      this.$nextTick(function () {
        if (self._html5QrCode) return;
        self._html5QrCode = new Html5Qrcode('scanner-container');
        self._html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 260, height: 160 } },
          function (text) { self.onScan(text); },
          function () {}
        ).catch(function (err) {
          self.scannerError = self.mensajeErrorCamara(err);
          self.scannerActivo = false;
          self._html5QrCode = null;
          self.abrirIngresoManual();
        });
      });
    },

    async cerrarScanner() {
      this.scannerActivo = false;
      if (this._scannerStopPromise) {
        await this._scannerStopPromise;
        return;
      }
      var scanner = this._html5QrCode;
      if (!scanner) return;

      var self = this;
      this._scannerStopPromise = (async function () {
        try {
          await scanner.stop();
        } catch (e) { /* el escáner ya puede estar detenido */ }
        try {
          await scanner.clear();
        } catch (e) { /* la vista puede haber sido retirada */ }
        if (self._html5QrCode === scanner) self._html5QrCode = null;
        self._scannerStopPromise = null;
      })();
      await this._scannerStopPromise;
    },

    async onScan(codigo) {
      if (this._procesandoScan) return;
      this._procesandoScan = true;
      try {
        if (navigator.vibrate) navigator.vibrate(200);
        this.bloquearWedgeCantidad();
        await this.cerrarScanner();
        this.resultadosBusqueda = [];
        await this.resolverCodigoEscaneado(String(codigo || '').trim());
      } finally {
        this._procesandoScan = false;
      }
    },

    async seleccionarArticulo(art) {
      if (!art) return;
      this.articuloSel = art;
      this.cantidadPrevia = '';
      this.cantidadInput = '';
      this.cerrarIngresoManual();
      this.mensajeError = '';
      this.mensajeOk = '';
      // El lector wedge sigue emitiendo teclas del EAN cuando ya enfocamos Cantidad.
      this.bloquearWedgeCantidad();
      try {
        var prev = await this.obtenerConteoLocalSafe(art.id_articulo);
        if (prev && prev.cantidad != null && prev.cantidad !== '') {
          this.cantidadPrevia = String(prev.cantidad);
          this.cantidadInput = String(prev.cantidad);
          this.contadosLocal.add(art.id_articulo);
        }
      } catch (e) { /* sin prev local */ }
      await this.enfocarCantidad({ abrirTeclado: true });
    },

    bloquearWedgeCantidad(ms) {
      this._bloqueoWedgeHasta = Date.now() + (ms || MS_BLOQUEO_WEDGE);
    },

    wedgeBloqueado() {
      return Date.now() < (this._bloqueoWedgeHasta || 0);
    },

    onKeydownCantidad(evento) {
      // Ventana corta post-scan: solo se acepta el pad en pantalla, nunca el wedge.
      if (!this.wedgeBloqueado()) return;
      if (evento && typeof evento.preventDefault === 'function') evento.preventDefault();
    },

    sanitizarCantidad() {
      var limpio = String(this.cantidadInput || '').replace(/[^0-9]/g, '');
      if (limpio !== this.cantidadInput) this.cantidadInput = limpio;
    },

    validarCantidad(valor) {
      var texto = String(valor || '').trim();
      if (!texto) return 'Ingresá una cantidad válida (≥ 0).';
      if (!/^\d+$/.test(texto)) return 'La cantidad solo admite números enteros (≥ 0).';
      if (LARGOS_CODIGO_BARRAS.indexOf(texto.length) !== -1) {
        return 'Ese valor parece un código de barras (' + texto.length
          + ' dígitos), no una cantidad. Limpiá el campo y cargá la cantidad contada.';
      }
      if (texto.length > MAX_DIGITOS_CANTIDAD) {
        return 'Cantidad demasiado larga: máximo ' + MAX_DIGITOS_CANTIDAD + ' dígitos.';
      }
      return '';
    },

    enfocarCantidad(opciones) {
      var self = this;
      var abrirTeclado = !opciones || opciones.abrirTeclado !== false;
      var demoras = [0, 100, 350];
      return new Promise(function (resolver) {
        var pendientes = demoras.length;
        var completar = function () {
          pendientes -= 1;
          if (!pendientes) resolver();
        };
        demoras.forEach(function (demora) {
          setTimeout(function () {
            self.$nextTick(function () {
              var el = self.$refs.cantidadInputEl;
              if (!el) {
                completar();
                return;
              }
              el.setAttribute('readonly', 'readonly');
              try {
                el.focus({ preventScroll: true });
              } catch (e) {
                el.focus();
              }
              requestAnimationFrame(function () {
                el.removeAttribute('readonly');
                if (typeof el.select === 'function') el.select();
                if (abrirTeclado && typeof el.click === 'function') el.click();
                completar();
              });
            });
          }, demora);
        });
      });
    },

    actualizarCursorCantidad() {
      this.$nextTick(() => {
        var el = this.$refs.cantidadInputEl;
        if (!el) return;
        el.focus({ preventScroll: true });
        var posicion = String(this.cantidadInput || '').length;
        if (typeof el.setSelectionRange === 'function') el.setSelectionRange(posicion, posicion);
      });
    },

    agregarDigitoCantidad(digito) {
      if (!/^\d$/.test(String(digito))) return;
      var actual = String(this.cantidadInput || '');
      if (actual.length >= MAX_DIGITOS_CANTIDAD) return;
      this.cantidadInput = actual + String(digito);
      this.actualizarCursorCantidad();
    },

    borrarDigitoCantidad() {
      this.cantidadInput = String(this.cantidadInput || '').slice(0, -1);
      this.actualizarCursorCantidad();
    },

    limpiarCantidad() {
      this.cantidadInput = '';
      this.mensajeError = '';
      this.actualizarCursorCantidad();
    },

    async editarConteo(item) {
      if (!item) return;
      await this.seleccionarArticulo({
        id_articulo: item.id_articulo,
        codigo: item.codigo || '-',
        nombre: item.nombre || '-',
        ean: [],
      });
    },

    async resolverCodigoEscaneado(codigo) {
      this.mensajeError = '';
      if (!codigo) return;
      var art = await window.InvFisicoOffline.buscarPorEan(codigo);
      if (!art) {
        this.mensajeError = 'EAN no pertenece a esta campaña.';
        this.abrirIngresoManual();
        return;
      }
      await this.seleccionarArticulo(art);
    },

    confirmarConteo() {
      if (!this.articuloSel) return;
      // Enter emitido por el lector wedge inmediatamente después del scan.
      if (this.wedgeBloqueado()) return;
      var raw = String(this.cantidadInput || '').trim();
      var problema = this.validarCantidad(raw);
      if (problema) {
        this.mensajeError = problema;
        return;
      }
      var qty = String(Number(raw));
      this.cantidadInput = qty;
      if (this.contadosLocal.has(this.articuloSel.id_articulo)) {
        this.confirmMensaje = 'Ya contaste este artículo (' + (this.cantidadPrevia || '—')
          + '). ¿Reemplazar la cantidad por ' + qty + '?';
        this._pendingConteo = { cantidad: qty };
        this.confirmOpen = true;
        return;
      }
      this._pendingConteo = { cantidad: qty };
      this.ejecutarConteoConfirmado();
    },

    async ejecutarConteoConfirmado() {
      this.confirmOpen = false;
      var qty = this._pendingConteo && this._pendingConteo.cantidad;
      this._pendingConteo = null;
      if (!this.articuloSel || qty == null) return;
      if (this.validarCantidad(qty)) return;
      var eraCorreccion = this.contadosLocal.has(this.articuloSel.id_articulo);

      var evento = {
        client_event_id: (crypto.randomUUID && crypto.randomUUID()) || ('ev-' + Date.now()),
        id_campana: cfg.idCampana,
        id_deposito: cfg.idDeposito,
        id_articulo: this.articuloSel.id_articulo,
        cantidad: qty,
        client_ts: new Date().toISOString(),
        estado: 'pendiente',
      };

      try {
        await window.InvFisicoOffline.encolarEvento(evento);
        await this.guardarConteoLocalSafe({
          id_articulo: this.articuloSel.id_articulo,
          cantidad: qty,
          codigo: this.articuloSel.codigo,
          nombre: this.articuloSel.nombre,
          ts: evento.client_ts,
        });
        this.contadosLocal.add(this.articuloSel.id_articulo);
        await this.cargarHistorialConteos();
        await this.actualizarPendientes();
        this.ultimaAccion = this.articuloSel.codigo + ' → ' + qty;
        this.mensajeOk = (eraCorreccion ? 'Conteo corregido' : 'Conteo registrado')
          + (this.online ? '' : ' (pendiente de sync)');
        this.mensajeError = '';
        this.articuloSel = null;
        this.cantidadInput = '';
        this.cantidadPrevia = '';
        if (this.online) await this.sincronizar();
        else this.bannerSync = this.pendientesSync + ' pendientes de sync';
      } catch (e) {
        this.mensajeError = e.message || 'No se pudo guardar el conteo.';
      }
    },
  };
}
</script>
