{% comment %}
Shell PWA de las pantallas de conteo (operario móvil).
Oculta el chrome Synap (navbar fijo + barra de estado), cancela el padding que
base_app reserva para ellos y deja el contenido a viewport completo con
safe-area insets. Se activa con la clase `conteo-pwa` en <body>.
{% endcomment %}
<style>
[x-cloak] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }

/* ===== Ocultar chrome Synap ===== */
body.conteo-pwa header.w-full.fixed { display: none !important; }
body.conteo-pwa #status-bar { display: none !important; }
body.conteo-pwa .pt-14,
body.conteo-pwa .md\:pt-16,
body.conteo-pwa .pt-16 { padding-top: 0 !important; }
body.conteo-pwa .pb-8,
body.conteo-pwa .md\:pb-12 { padding-bottom: 0 !important; }
body.conteo-pwa .app-content > div { padding: 0 !important; }
body.conteo-pwa .min-h-screen { min-height: 100dvh !important; }
body.conteo-pwa {
  min-height: 100dvh;
  overflow: hidden;
  overscroll-behavior-y: none;
}

/* ===== Layout app: header fijo, cuerpo scrolleable, acciones abajo ===== */
.conteo-pwa-root {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
.conteo-pwa-top { padding-top: max(0.5rem, env(safe-area-inset-top)); }
.conteo-pwa-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.conteo-pwa-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }

/* ===== Targets táctiles de operario (guantes, movimiento) ===== */
.conteo-pwa-root button,
.conteo-pwa-root a[href],
.conteo-pwa-root input,
.conteo-pwa-root select {
  min-height: 2.75rem;
  touch-action: manipulation;
}
.conteo-pwa-root .conteo-pwa-chip { min-height: 1.75rem; }
.conteo-pwa-root input { font-size: 16px; } /* evita el zoom automático de iOS */
.conteo-pwa-root :focus-visible { outline: 2px solid #7c3aed; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .conteo-pwa-root *,
  .conteo-pwa-root *::before,
  .conteo-pwa-root *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
