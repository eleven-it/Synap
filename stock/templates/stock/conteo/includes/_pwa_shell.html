{% comment %}
Shell PWA de las pantallas de conteo (operario móvil).
Conserva el chrome Synap (navbar fijo + barra de estado) y reserva dentro del
contenido el alto disponible para un flujo táctil con safe-area lateral.
Se activa con la clase `conteo-pwa` en <body>.
{% endcomment %}
<style>
[x-cloak] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }

/* ===== Layout app: header fijo, cuerpo scrolleable, acciones abajo ===== */
.conteo-pwa-root {
  display: flex;
  flex-direction: column;
  height: calc(100dvh - 3.5rem - 2rem);
  width: 100%;
  overflow: hidden;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
.conteo-pwa-top { padding-top: 0.5rem; }
.conteo-pwa-scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.conteo-pwa-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }

/* ===== Targets táctiles de operario (guantes, movimiento) ===== */
.conteo-pwa-root button,
.conteo-pwa-root a[href],
.conteo-pwa-root input,
.conteo-pwa-root select {
  min-height: 2.75rem;
  touch-action: manipulation;
}
.conteo-pwa-root .conteo-pwa-chip { min-height: 1.75rem; }
.conteo-pwa-root input { font-size: 16px; } /* evita el zoom automático de iOS */
.conteo-pwa-root :focus-visible { outline: 2px solid #7c3aed; outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  .conteo-pwa-root *,
  .conteo-pwa-root *::before,
  .conteo-pwa-root *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
