<form method="get" x-ref="filtrosForm"
      class="mb-2 rounded-xl border border-gray-200 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-900">
  <input type="hidden" name="presentacion" :value="presentacion">
  <input type="hidden" name="incluir_ceros" :value="incluirCeros ? '1' : '0'">

  <div class="flex flex-col gap-3 lg:flex-row lg:flex-wrap lg:items-end lg:gap-x-4 lg:gap-y-2">
    {# Marcas #}
    <div class="min-w-0 flex-1 lg:max-w-xs xl:max-w-sm">
      <p class="mb-1.5 text-[11px] font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Marcas</p>
      <div class="relative">
        <select name="marcas_incluidos" id="marcas_incluidos" multiple class="hidden" data-tags-field="marcas_incluidos">
          {% for m in marcas_catalogo %}
          <option value="{{ m.value }}" {% if m.value in filtros.marcas_incluidos %}selected{% endif %}>{{ m.label }}</option>
          {% endfor %}
        </select>
        <div id="marcas_incluidos_tags_container"
             class="tags-filter-container flex h-9 min-h-9 max-h-9 flex-nowrap items-center gap-1 overflow-hidden rounded-lg border border-gray-300 bg-white px-2.5 py-0 shadow-sm focus-within:border-purple-500 focus-within:ring-2 focus-within:ring-purple-500/25 dark:border-gray-600 dark:bg-gray-900">
          <div class="tags-chips flex min-h-0 min-w-0 flex-1 flex-nowrap items-center gap-1 overflow-x-auto overflow-y-hidden"></div>
          <input type="text" id="marcas_incluidos_search"
                 class="tags-input min-w-[5rem] flex-1 border-none bg-transparent text-sm text-gray-800 outline-none placeholder:text-gray-400 dark:text-gray-100"
                 placeholder="Buscar marca…" autocomplete="off">
          <div id="marcas_incluidos_dropdown"
               class="tags-dropdown absolute left-0 right-0 top-full z-50 mt-1 hidden max-h-60 overflow-y-auto rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-600 dark:bg-gray-800"></div>
        </div>
      </div>
    </div>

    {# Artículo #}
    <div class="min-w-0 flex-1 lg:max-w-md xl:max-w-lg">
      <label for="inventario-busqueda" class="mb-1.5 block text-[11px] font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Artículo</label>
      <div class="relative" @click.outside="sugerenciasAbiertas = false">
        <span class="material-icons pointer-events-none absolute left-2.5 top-1/2 z-10 -translate-y-1/2 text-lg text-gray-400" aria-hidden="true">search</span>
        <input type="search" id="inventario-busqueda" x-model="busqueda" @input="onBusquedaInput()"
               @focus="sugerenciasAbiertas = sugerencias.length > 0"
               placeholder="Buscar por código o nombre…" autocomplete="off" role="combobox"
               class="h-9 w-full rounded-lg border border-gray-300 bg-white py-2 pl-9 pr-8 text-sm shadow-sm placeholder:text-gray-400 focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-500/25 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 dark:placeholder:text-gray-500">
        <button type="button" x-show="busqueda.trim() !== ''" x-cloak @click="limpiarBusqueda()"
                class="absolute right-1.5 top-1/2 z-10 flex h-6 w-6 -translate-y-1/2 items-center justify-center rounded-md text-gray-400 hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-gray-700 dark:hover:text-gray-200"
                aria-label="Limpiar búsqueda">
          <span class="material-icons text-base" aria-hidden="true">close</span>
        </button>
        <ul x-show="sugerenciasAbiertas && sugerencias.length" x-cloak role="listbox"
            class="absolute left-0 right-0 top-full z-40 mt-1 max-h-56 overflow-y-auto rounded-lg border border-gray-200 bg-white py-1 shadow-lg dark:border-gray-600 dark:bg-gray-800">
          <template x-for="(item, idx) in sugerencias" :key="item.id_articulo">
            <li>
              <button type="button" @mousedown.prevent="seleccionarArticulo(item)"
                      class="flex w-full flex-col gap-0.5 px-3 py-2 text-left hover:bg-purple-50 dark:hover:bg-purple-950/50">
                <span class="text-sm font-semibold tabular-nums" x-text="item.codigo_compuesto"></span>
                <span class="line-clamp-1 text-xs text-gray-500 dark:text-gray-400" x-text="item.nombre"></span>
              </button>
            </li>
          </template>
        </ul>
      </div>
    </div>

    {# Presentación #}
    <div class="shrink-0">
      <p class="mb-1.5 text-[11px] font-semibold uppercase tracking-wide text-gray-500 dark:text-gray-400">Presentación</p>
      <div>
        <span class="mb-1 block text-xs font-medium text-transparent select-none" aria-hidden="true">Modo</span>
        <div class="inline-flex h-9 w-full min-w-[11rem] overflow-hidden rounded-lg border border-gray-300 bg-white p-0.5 shadow-sm dark:border-gray-600 dark:bg-gray-900 sm:w-auto"
             role="group" aria-label="Unidades o docenas">
          <button type="button" @click="cambiarPresentacion('unidades')"
                  :class="presentacion === 'unidades' ? 'bg-purple-600 text-white shadow-sm' : 'text-gray-700 hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-gray-800'"
                  class="inline-flex h-full flex-1 items-center justify-center gap-1 rounded-md px-3 text-xs font-semibold transition-colors whitespace-nowrap">
            <span class="material-icons text-sm" aria-hidden="true">straighten</span>
            Unidades
          </button>
          <button type="button" @click="cambiarPresentacion('docenas')"
                  :class="presentacion === 'docenas' ? 'bg-purple-600 text-white shadow-sm' : 'text-gray-700 hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-gray-800'"
                  class="inline-flex h-full flex-1 items-center justify-center gap-1 rounded-md px-3 text-xs font-semibold transition-colors whitespace-nowrap">
            <span class="material-icons text-sm" aria-hidden="true">view_week</span>
            Docenas
          </button>
        </div>
      </div>
    </div>

    {# Acciones — misma línea base h-9 #}
    <div class="flex shrink-0 flex-col lg:ml-auto">
      <p class="mb-1.5 hidden text-[11px] font-semibold uppercase tracking-wide text-transparent select-none lg:block" aria-hidden="true">Acciones</p>
      <div>
        <span class="mb-1 hidden text-xs font-medium text-transparent select-none lg:block" aria-hidden="true">Ejecutar</span>
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" @click="toggleIncluirCeros()"
                  :class="incluirCeros ? 'border-purple-600 bg-purple-50 text-purple-800 dark:border-purple-500 dark:bg-purple-950/50 dark:text-purple-100' : 'border-gray-300 bg-white text-gray-700 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-200'"
                  class="inline-flex h-9 items-center justify-center gap-1 rounded-lg border px-3 text-xs font-semibold shadow-sm transition-colors whitespace-nowrap">
            <span class="material-icons text-base" aria-hidden="true">inventory</span>
            <span x-text="incluirCeros ? 'Todos los artículos' : 'Solo con stock'"></span>
          </button>
          <button type="submit"
                  class="inline-flex h-9 items-center justify-center gap-1.5 rounded-lg bg-purple-600 px-4 text-xs font-semibold text-white shadow-sm transition-colors hover:bg-purple-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-gray-900">
            <span class="material-icons text-base" aria-hidden="true">refresh</span>
            Actualizar
          </button>
          <a href="{% url 'stock:inventario' %}?{{ limpiar_qs }}"
             class="inline-flex h-9 items-center justify-center rounded-lg border border-gray-300 bg-white px-3 text-xs font-semibold text-gray-700 shadow-sm transition-colors hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-200 dark:hover:bg-gray-700">
            Limpiar
          </a>
        </div>
      </div>
    </div>
  </div>

  <p class="mt-2 text-[10px] text-gray-400 dark:text-gray-500">
    Marcas vacías = todas. La búsqueda de artículo aplica sobre el universo completo, no solo la página visible.
  </p>
</form>
