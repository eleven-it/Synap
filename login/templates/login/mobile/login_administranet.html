{% load static %}
<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AdministraNET Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#7f13ec",
            "background-light": "#f7f6f8",
            "background-dark": "#191022",
          },
          fontFamily: { "display": ["Inter"] },
          borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>body { min-height: max(884px, 100dvh); }</style>
  {% csrf_token %}
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
  <div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden p-6">
    <!-- Logo -->
    <div class="mb-12 flex flex-col items-center">
      <div class="mb-4 flex h-20 w-20 items-center justify-center rounded-xl bg-primary text-white shadow-lg shadow-primary/30">
        <span class="material-symbols-outlined text-4xl">storefront</span>
      </div>
      <h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-[32px] font-bold leading-tight text-center">AdministraNET</h1>
    </div>
    <!-- Mensaje -->
    <div class="mb-8 text-center">
      <h2 class="text-slate-900 dark:text-slate-100 text-[24px] font-bold leading-tight tracking-[-0.015em] mb-2">¡Bienvenido!</h2>
      <p class="text-slate-600 dark:text-slate-400 text-base font-normal">Iniciá sesión para continuar</p>
    </div>
    <!-- Formulario -->
    <div class="w-full max-w-[400px] space-y-5">
      <div id="error-message" class="text-red-600 text-sm text-center hidden"></div>
      <input type="hidden" id="server" name="server" value="{{ db_host|default:server_default.host|default:'' }}"/>

      <!-- Empresa -->
      <div class="flex flex-col gap-2">
        <label class="text-slate-700 dark:text-slate-300 text-sm font-medium px-1">Empresa</label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-slate-400 material-symbols-outlined text-[22px]">business</span>
          <select id="empresa" name="empresa" required class="w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4 pl-12 pr-4 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none">
            <option value="">Seleccione una empresa</option>
            {% for empresa in empresas %}
            <option value="{{ empresa.base_empresa }}">{{ empresa.nombre_empresa }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <!-- Usuario -->
      <div class="flex flex-col gap-2">
        <label class="text-slate-700 dark:text-slate-300 text-sm font-medium px-1">Usuario</label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-slate-400 material-symbols-outlined text-[22px]">person</span>
          <input id="usuario" type="text" name="usuario" autocomplete="username" required placeholder="Código de usuario" class="w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4 pl-12 pr-4 text-slate-900 dark:text-white shadow-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none placeholder:text-slate-400"/>
        </div>
      </div>
      <!-- Contraseña -->
      <div class="flex flex-col gap-2">
        <label class="text-slate-700 dark:text-slate-300 text-sm font-medium px-1">Contraseña</label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-slate-400 material-symbols-outlined text-[22px]">lock</span>
          <input id="password" type="password" name="password" autocomplete="current-password" required placeholder="••••••••" class="w-full rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4 pl-12 pr-12 text-slate-900 dark:text-white shadow-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none placeholder:text-slate-400"/>
          <button type="button" class="absolute right-4 text-slate-400 hover:text-primary transition-colors" onclick="var i=document.getElementById('password');i.type=i.type==='password'?'text':'password';">
            <span class="material-symbols-outlined text-[22px]">visibility</span>
          </button>
        </div>
      </div>
      <!-- Botón -->
      <div class="pt-4">
        <button type="button" id="btn-submit" onclick="handleLogin(event)" class="w-full rounded-xl bg-primary py-4 text-base font-bold text-white shadow-lg shadow-primary/25 hover:bg-primary/90 active:scale-[0.98] transition-all">Iniciar sesión</button>
      </div>
    </div>
    <!-- Decoración -->
    <div class="fixed top-[-10%] left-[-10%] -z-10 h-[40%] w-[40%] rounded-full bg-primary/5 blur-[100px]"></div>
    <div class="fixed bottom-[-10%] right-[-10%] -z-10 h-[40%] w-[40%] rounded-full bg-primary/10 blur-[100px]"></div>
  </div>

  <script>
    function showError(message) {
      var el = document.getElementById('error-message');
      el.textContent = message;
      el.classList.remove('hidden');
      setTimeout(function(){ el.classList.add('hidden'); }, 5000);
    }
    function getCookie(name) {
      var v = '; ' + document.cookie;
      var parts = v.split('; ' + name + '=');
      return parts.length === 2 ? parts.pop().split(';').shift() : '';
    }
    function handleLogin(event) {
      if (event) event.preventDefault();
      var cod_usuario = document.getElementById('usuario').value.trim();
      var password = document.getElementById('password').value.trim();
      var base_empresa = document.getElementById('empresa').value.trim();
      var server = document.getElementById('server').value.trim();
      if (!cod_usuario || !password || !base_empresa) {
        showError('Completá todos los campos');
        return;
      }
      var btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'Ingresando...';
      fetch('{% url "login:login" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        credentials: 'same-origin',
        body: JSON.stringify({ cod_usuario: cod_usuario, password: password, base_empresa: base_empresa, server: server || '' })
      }).then(function(r){ return r.json(); }).then(function(data) {
        if (data.redirect) {
          if (base_empresa) localStorage.setItem('last_selected_empresa', base_empresa);
          if (cod_usuario) localStorage.setItem('last_username', cod_usuario);
          window.location.href = data.redirect;
        } else {
          showError(data.error || 'Error al iniciar sesión');
          btn.disabled = false;
          btn.textContent = 'Iniciar sesión';
        }
      }).catch(function() {
        showError('Error de conexión. Intentá de nuevo.');
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      });
    }
    document.addEventListener('DOMContentLoaded', function() {
      var emp = document.getElementById('empresa'), usr = document.getElementById('usuario');
      var lastEmp = localStorage.getItem('last_selected_empresa');
      if (lastEmp && emp) {
        var opt = Array.prototype.find.call(emp.options, function(o){ return o.value === lastEmp; });
        if (opt) emp.value = lastEmp;
      }
      var lastUsr = localStorage.getItem('last_username');
      if (lastUsr && usr) usr.value = lastUsr;
    });
  </script>
</body>
</html>
