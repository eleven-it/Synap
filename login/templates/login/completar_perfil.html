{% extends "base.html" %}
{% block content %}
<div class="flex justify-center py-10 px-4">
  <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 w-full max-w-md">
    {% if messages %}
      {% for message in messages %}
        <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4 text-sm">
          {{ message }}
        </div>
        <script>
  setTimeout(function() {
    {% if user.rol == "proveedor" %}
      window.location.href = "/proveedores/dashboard/";
    {% else %}
      window.location.href = "/clientes/dashboard/";
    {% endif %}
  }, 2000);
</script>
      {% endfor %}
    {% endif %}

    <h2 class="text-2xl font-bold mb-4 text-center">Completar perfil</h2>
    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo</label>
        <input type="text" name="nombre" value="{{ user.nombre }}" required
               class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-600">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Seleccioná el tipo de cuenta</label>
        <div class="flex flex-col gap-3">
          <button type="submit" name="rol_nombre" value="cliente"
                  class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded text-center">
            🏡 Soy cliente
          </button>
          <button type="submit" name="rol_nombre" value="proveedor"
                  class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded text-center">
            🛠️ Soy proveedor
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Idioma preferido</label>
        <select name="idioma" required
                class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-600">
          <option value="es" {% if user.idioma == "es" %}selected{% endif %}>Español</option>
          <option value="en" {% if user.idioma == "en" %}selected{% endif %}>Inglés</option>
          <option value="pt" {% if user.idioma == "pt" %}selected{% endif %}>Portugués</option>
        </select>
      </div>
    </form>
  </div>
</div>
{% endblock %}
