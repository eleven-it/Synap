{% extends "base.html" %}
{% block content %}
<div class="bg-white shadow rounded p-6 max-w-3xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Perfil de Usuario</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Nombre</label>
      <input type="text" value="{{ user.name|default:'' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500" readonly>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" value="{{ user.email }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500" readonly>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">UID</label>
      <input type="text" value="{{ user.user_id }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500" readonly>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Último acceso</label>
      <input type="text" value="{{ user.auth_time|date:'d/m/Y H:i' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500" readonly>
    </div>
  </div>

  <div class="mt-6 text-right">
    <a href="{% url 'login:logout' %}" class="inline-block bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">Cerrar sesión</a>
  </div>
</div>
{% endblock %}
