{% load static %}
{% load i18n %}
{% load device_tags %}

<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'es' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% trans "Synap" %}{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase -->
    <script type="module" src="{% static 'login/firebase-init.js' %}"></script>
    
    <!-- Estilos base -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .input-focus {
            transition: all 0.3s ease;
        }
        
        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        /* Animaciones */
        .slide-in {
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 1s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes pulseGlow {
            from { box-shadow: 0 0 20px rgba(102, 126, 234, 0.3); }
            to { box-shadow: 0 0 30px rgba(102, 126, 234, 0.6); }
        }
        
        /* Optimizaciones móviles */
        {% is_mobile as mobile %}
        {% if mobile %}
        .mobile-container {
            padding: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .mobile-form {
            width: 100%;
            max-width: 100%;
            margin: 0;
            border-radius: 1.5rem;
        }
        
        .mobile-input {
            font-size: 16px; /* Previene zoom en iOS */
            padding: 1rem;
            border-radius: 0.75rem;
        }
        
        .mobile-btn {
            padding: 1rem;
            font-size: 1.1rem;
            border-radius: 0.75rem;
        }
        {% endif %}
    </style>
    
    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen{% endblock %}">
    {% block content %}{% endblock %}
    
    {% block extra_js %}{% endblock %}
    
    <script>
        // Funciones comunes para todos los templates de login
        function showToast(message, type = 'success') {
            // Implementar toast notifications
            console.log(`${type}: ${message}`);
        }
        
        function showLoading(element) {
            if (element) {
                element.disabled = true;
                const originalText = element.innerHTML;
                element.innerHTML = '<svg class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">...</svg> Cargando...';
                return originalText;
            }
        }
        
        function hideLoading(element, originalText) {
            if (element && originalText) {
                element.disabled = false;
                element.innerHTML = originalText;
            }
        }
        
        // Detectar tipo de dispositivo en el cliente
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        
        // Agregar clase CSS según el dispositivo
        document.addEventListener('DOMContentLoaded', function() {
            if (isMobileDevice()) {
                document.body.classList.add('mobile-device');
            } else {
                document.body.classList.add('desktop-device');
            }
        });
    </script>
</body>
</html>
