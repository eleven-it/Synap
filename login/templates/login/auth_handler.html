<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Procesando login...</title>
  <script type="module" src="/static/login/firebase-init-handler.js"></script>
  <style>
    body {
      background-color: #0c0c0c;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding-top: 150px;
    }
    .loader {
      margin-top: 40px;
      border: 6px solid #f3f3f3;
      border-top: 6px solid #1db954;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      display: inline-block;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="/static/login/logo-white.png" alt="FixSync Logo" height="40" />
  <h2>Procesando tu inicio de sesión...</h2>
  <div class="loader"></div>
</body>
</html>
