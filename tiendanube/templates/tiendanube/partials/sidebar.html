<aside class="flex-shrink-0 bg-white shadow-lg border-r border-gray-200 transition-all duration-300"
       :class="sidebarOpen ? 'w-56' : 'w-16'">
  <div class="flex flex-col h-full">
    <div class="flex items-center justify-between h-16 p-4 border-b">
      <span class="font-bold text-purple-700 text-lg transition-opacity duration-300" :class="sidebarOpen ? 'opacity-100' : 'opacity-0'">TiendaNube</span>
      <button @click="sidebarOpen = !sidebarOpen" class="text-gray-500 hover:text-purple-600 focus:outline-none">
        <svg x-show="sidebarOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
        <svg x-show="!sidebarOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
      </button>
    </div>
    <nav class="flex-1 py-4 space-y-2">
      <a href="{% url 'tiendanube:dashboard' %}" class="flex items-center gap-2 bg-white/10 dark:bg-gray-900/30 rounded-xl px-3 py-2 mb-2 shadow-sm border border-white/20 dark:border-gray-800 transition-all duration-200 hover:bg-purple-100/30 hover:scale-[1.03] group" title="Dashboard">
        <span class="material-icons text-purple-600">dashboard</span>
        <span x-show="sidebarOpen" class="text-gray-800 dark:text-gray-100 font-bold">Dashboard</span>
      </a>
      <a href="{% url 'tiendanube:config_list' %}" class="flex items-center gap-2 bg-white/10 dark:bg-gray-900/30 rounded-xl px-3 py-2 mb-2 shadow-sm border border-white/20 dark:border-gray-800 transition-all duration-200 hover:bg-purple-100/30 hover:scale-[1.03] group" title="Configuration">
        <span class="material-icons text-purple-600">settings</span>
        <span x-show="sidebarOpen" class="text-gray-800 dark:text-gray-100 font-bold">Configuration</span>
      </a>
      <a href="{% url 'tiendanube:logs_list' %}" class="flex items-center gap-2 bg-white/10 dark:bg-gray-900/30 rounded-xl px-3 py-2 mb-2 shadow-sm border border-white/20 dark:border-gray-800 transition-all duration-200 hover:bg-purple-100/30 hover:scale-[1.03] group" title="Sync Logs">
        <span class="material-icons text-purple-600">history</span>
        <span x-show="sidebarOpen" class="text-gray-800 dark:text-gray-100 font-bold">Sync Logs</span>
      </a>
      <a href="{% url 'tiendanube:mapping_list' %}" class="flex items-center gap-2 bg-white/10 dark:bg-gray-900/30 rounded-xl px-3 py-2 mb-2 shadow-sm border border-white/20 dark:border-gray-800 transition-all duration-200 hover:bg-purple-100/30 hover:scale-[1.03] group" title="Product Mapping">
        <span class="material-icons text-purple-600">link</span>
        <span x-show="sidebarOpen" class="text-gray-800 dark:text-gray-100 font-bold">Product Mapping</span>
      </a>
    </nav>
    <div class="p-4 border-t text-xs text-gray-400" x-show="sidebarOpen">
      Synap ERP &copy; 2024
    </div>
  </div>
</aside>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
