{% extends 'tiendanube/tiendanube_app_base.html' %}
{% load i18n crispy_forms_tags %}

{% block content %}
<div class="max-w-xl mx-auto py-8">
    <h1 class="text-lg font-bold mb-4">{% if form.instance.pk %}{% trans 'Editar mapeo' %}{% else %}{% trans 'Nuevo mapeo' %}{% endif %}</h1>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="flex gap-4 mt-4">
            <button type="submit" class="btn btn-primary">{% trans 'Guardar' %}</button>
            <a href="{% url 'tiendanube:cond_venta_map_list' %}" class="btn btn-outline">{% trans 'Cancelar' %}</a>
        </div>
    </form>
</div>
{% endblock %}
