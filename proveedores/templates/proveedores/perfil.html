{% extends "base.html" %}
{% block content %}
<div class="bg-white shadow rounded p-6 max-w-3xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Perfil de Proveedor</h2>

  <form method="post">
    {% csrf_token %}
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nombre</label>
        <input type="text" name="nombre" value="{{ user.name|default:user.nombre|default:'' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" value="{{ user.email }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100 text-gray-500" readonly>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">UID</label>
        <input type="text" value="{{ user.user_id|default:user.uid }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100 text-gray-500" readonly>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Último acceso</label>
        <input type="text" value="{{ user.auth_time|default:user.ultimo_acceso|date:'d/m/Y H:i' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm bg-gray-100 text-gray-500" readonly>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Idioma preferido</label>
        <select name="idioma" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500">
          <option value="es" {% if user.idioma == "es" %}selected{% endif %}>Español</option>
          <option value="en" {% if user.idioma == "en" %}selected{% endif %}>Inglés</option>
          <option value="pt" {% if user.idioma == "pt" %}selected{% endif %}>Portugués</option>
        </select>
      </div>
    </div>

    <hr class="my-6">

    <h3 class="text-lg font-semibold mb-2">Cambiar contraseña</h3>

    <div>
      <label class="block text-sm font-medium text-gray-700">Nueva contraseña</label>
      <input type="password" name="nueva_password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Confirmar nueva contraseña</label>
      <input type="password" name="confirmar_password" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:ring-purple-500 focus:border-purple-500">
    </div>

    <div class="mt-6 flex justify-between items-center">
      <a href="{% url 'login:logout' %}" class="inline-block bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition">Cerrar sesión</a>
      <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded">Guardar cambios</button>
    </div>
  </form>
</div>
{% endblock %}
