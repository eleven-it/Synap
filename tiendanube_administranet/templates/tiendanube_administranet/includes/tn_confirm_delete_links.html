{# Delegación de clics en .tn-confirm-delete-link → TnSynapConfirm (sin confirm nativo) #}
<script>
(function () {
    if (window.TnConfirmDeleteLinksInit) return;
    window.TnConfirmDeleteLinksInit = true;
    document.addEventListener('click', function (e) {
        var link = e.target.closest('.tn-confirm-delete-link');
        if (!link || !window.TnSynapConfirm) return;
        e.preventDefault();
        var href = link.getAttribute('href');
        var message = link.getAttribute('data-confirm-message') || '¿Está seguro de que desea continuar?';
        var title = link.getAttribute('data-confirm-title') || 'Confirmar eliminación';
        var label = link.getAttribute('data-confirm-label') || 'Eliminar';
        TnSynapConfirm.show({
            title: title,
            message: message,
            confirmLabel: label,
            onConfirm: function () { window.location.href = href; }
        });
    });
})();
</script>
