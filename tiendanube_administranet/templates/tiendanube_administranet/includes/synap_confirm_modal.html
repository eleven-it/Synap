{% load i18n %}
{# Modal Synap reutilizable — confirmaciones operativas/destructivas (sin alert/confirm nativos) #}
<div id="tn-synap-confirm-modal"
     class="fixed inset-0 z-[10050] hidden"
     aria-modal="true"
     role="dialog"
     aria-labelledby="tn-synap-confirm-title">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" data-tn-confirm-dismiss></div>
    <div class="relative flex min-h-full items-center justify-center p-4">
        <div class="w-full max-w-md rounded-xl border border-slate-200 bg-white p-6 shadow-xl dark:border-slate-700 dark:bg-slate-800">
            <div class="mb-4 flex items-start gap-3">
                <span class="material-icons text-2xl text-amber-500" aria-hidden="true">help_outline</span>
                <div class="min-w-0 flex-1">
                    <h2 id="tn-synap-confirm-title" class="text-lg font-semibold text-slate-900 dark:text-white">
                        {% trans "Confirmar acción" %}
                    </h2>
                    <p id="tn-synap-confirm-message" class="mt-2 text-sm text-slate-600 dark:text-slate-300"></p>
                </div>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button"
                        data-tn-confirm-cancel
                        class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">
                    {% trans "Cancelar" %}
                </button>
                <button type="button"
                        data-tn-confirm-ok
                        class="inline-flex items-center rounded-lg bg-orange-600 px-4 py-2 text-sm font-medium text-white hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2">
                    {% trans "Confirmar" %}
                </button>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    if (window.TnSynapConfirm) return;

    var modal = document.getElementById('tn-synap-confirm-modal');
    if (!modal) return;

    var titleEl = document.getElementById('tn-synap-confirm-title');
    var messageEl = document.getElementById('tn-synap-confirm-message');
    var okBtn = modal.querySelector('[data-tn-confirm-ok]');
    var cancelBtn = modal.querySelector('[data-tn-confirm-cancel]');
    var dismissEls = modal.querySelectorAll('[data-tn-confirm-dismiss]');
    var pendingCallback = null;

    function hide() {
        modal.classList.add('hidden');
        pendingCallback = null;
    }

    function show(opts) {
        opts = opts || {};
        titleEl.textContent = opts.title || '{% trans "Confirmar acción" %}';
        messageEl.textContent = opts.message || '';
        if (opts.confirmLabel) okBtn.textContent = opts.confirmLabel;
        else okBtn.textContent = '{% trans "Confirmar" %}';
        pendingCallback = typeof opts.onConfirm === 'function' ? opts.onConfirm : null;
        modal.classList.remove('hidden');
    }

    okBtn.addEventListener('click', function () {
        var cb = pendingCallback;
        hide();
        if (cb) cb();
    });
    cancelBtn.addEventListener('click', hide);
    dismissEls.forEach(function (el) { el.addEventListener('click', hide); });

    window.TnSynapConfirm = { show: show, hide: hide };
})();
</script>
