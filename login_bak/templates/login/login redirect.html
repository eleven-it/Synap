{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión - Synap</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script type="module" src="{% static 'login/firebase-init.js' %}">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signInWithRedirect,
      getRedirectResult,
      GoogleAuthProvider,
      OAuthProvider,
      browserPopupRedirectResolver
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    import { firebaseConfig, backendRoutes, getCookie } from "/login/firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    auth.useDeviceLanguage(); // mejora experiencia local

    const provider = new GoogleAuthProvider();

    const sendTokenToBackend = (idToken) => {
      const csrftoken = getCookie("csrftoken");
      fetch(backendRoutes.login, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrftoken
        },
        body: JSON.stringify({ idToken })
      })
        .then((response) => {
          if (response.ok) {
            window.location.href = "/dashboard/";
          } else {
            throw new Error("Error al validar las credenciales.");
          }
        })
        .catch((error) => {
          showError(error.message);
        });
    };

    const showError = (message) => {
      const msg = document.getElementById("error-message");
      msg.innerText = message;
      msg.classList.remove("hidden");
    };

    // Si venimos de Google redirect, procesar login
    getRedirectResult(auth)
      .then((result) => {
        if (result) {
          const user = result.user;
          console.log("✅ Usuario autenticado con Google (redirect):", user.email);
          return user.getIdToken().then((idToken) => sendTokenToBackend(idToken));
        }
      })
      .catch((error) => {
        if (error.code !== "auth/no-auth-event") {
          showError("Error con Google: " + error.message);
        }
      });

    window.loginUser = (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      document.getElementById("error-message").classList.add("hidden");

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => userCredential.user.getIdToken())
        .then((idToken) => sendTokenToBackend(idToken))
        .catch((error) => {
          showError(
            error.code === "auth/invalid-credential"
              ? "Correo o contraseña incorrectos."
              : "Error: " + error.message
          );
        });
    };

    window.loginWithGoogle = () => {
      console.log("🟡 Redireccionando a Google login...");
      signInWithRedirect(auth, provider, browserPopupRedirectResolver);
    };

    window.loginWithApple = () => {
      const provider = new OAuthProvider("apple.com");
      signInWithRedirect(auth, provider);
    };
  </script>
</head>

<body class="min-h-screen bg-gradient-to-t from-[#0a0a0a] via-[#121212] to-[#1c1c1c] flex items-center justify-center text-white font-sans">
  <div class="bg-[#1e1e1e] shadow-2xl rounded-2xl p-8 w-full max-w-md">
    <h2 class="text-3xl font-bold mb-8 text-center">Iniciar sesión en Synap</h2>

    <button onclick="loginWithGoogle()"
      class="w-full mb-4 py-3 flex items-center justify-center gap-3 border border-white text-white font-semibold rounded-full hover:bg-[#2c2c2c] transition-colors">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21.6 12.227c0-.638-.057-1.25-.163-1.837H12v3.475h5.377a4.605 4.605 0 0 1-2 3.018v2.5h3.227c1.89-1.74 2.996-4.302 2.996-7.156z"/>
        <path d="M12 22c2.7 0 4.968-.9 6.625-2.436l-3.227-2.5c-.895.6-2.035.95-3.398.95-2.614 0-4.828-1.762-5.622-4.124H3.07v2.6A10.002 10.002 0 0 0 12 22z"/>
        <path d="M6.378 13.89A5.985 5.985 0 0 1 6 12c0-.662.114-1.298.32-1.89v-2.6H3.07A9.998 9.998 0 0 0 2 12c0 1.624.39 3.158 1.07 4.51l3.308-2.62z"/>
        <path d="M12 6.002c1.47 0 2.79.508 3.832 1.507l2.876-2.876C16.964 2.982 14.695 2 12 2A10.002 10.002 0 0 0 3.07 7.51l3.308 2.6C7.172 7.764 9.386 6.002 12 6.002z"/>
      </svg>
      Continuar con Google
    </button>

    <button onclick="loginWithApple()"
      class="w-full mb-6 py-3 flex items-center justify-center gap-3 border border-white text-white font-semibold rounded-full hover:bg-[#2c2c2c] transition-colors">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
        <path d="M16.365 1.43c0 1.14-.427 2.153-1.272 3.035-.928.972-2.05 1.54-3.238 1.45-.088-1.208.433-2.313 1.27-3.172.872-.886 2.097-1.48 3.24-1.5zm4.676 16.747c-.463 1.063-.682 1.54-1.27 2.47-.826 1.292-1.993 2.904-3.45 2.91-1.302.006-1.634-.832-3.415-.824-1.78.008-2.144.83-3.45.825-1.457-.006-2.562-1.475-3.387-2.766C4.173 18.06 2.48 13.6 4.658 9.98c.957-1.663 2.66-2.703 4.53-2.72 1.372-.014 2.663.928 3.415.928.73 0 2.27-1.15 3.828-.982.653.027 2.488.263 3.672 1.98-3.148 1.755-2.636 6.376.538 7.99z"/>
      </svg>
      Continuar con Apple
    </button>

    <div class="flex items-center gap-4 mb-6">
      <hr class="flex-grow border-gray-600" />
      <span class="text-sm text-gray-400">o</span>
      <hr class="flex-grow border-gray-600" />
    </div>

    <form onsubmit="loginUser(event)">
      <input id="email" type="email" placeholder="Correo electrónico" required
        class="w-full p-3 mb-4 rounded-md bg-[#2a2a2a] text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-[#007ACC]" />
      <input id="password" type="password" placeholder="Contraseña" required
        class="w-full p-3 mb-4 rounded-md bg-[#2a2a2a] text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-[#007ACC]" />

      <button type="submit"
        class="w-full py-3 mt-2 bg-[#007ACC] hover:bg-[#005A9C] text-white font-bold rounded-full transition-colors">
        Ingresar
      </button>
    </form>

    <div id="error-message" class="text-[#FF4D6D] mt-3 text-sm text-center hidden"></div>

    <div class="text-sm text-center mt-6 space-y-2">
      <a href="{% url 'login:reset_password' %}" class="text-[#3A86FF] hover:underline block">¿Olvidaste tu contraseña?</a>
      <a href="{% url 'login:register' %}" class="text-[#F72585] hover:underline block">¿No tenés cuenta? Registrate</a>
    </div>
  </div>
</body>
</html>
