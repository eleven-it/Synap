{% extends 'base.html' %}
{% load i18n crispy_forms_tags %}

{% block content %}
<div class="wizard-container max-w-lg mx-auto mt-8">
    <h2 class="text-lg font-bold mb-2">{% if form.instance.pk %}{% trans 'Edit Tag' %}{% else %}{% trans 'Create Tag' %}{% endif %}</h2>
    <form method="post" autocomplete="off">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="form-actions flex justify-between mt-4">
            <a href="{% url 'sales:client_tag_list' %}" class="btn-secondary">{% trans 'Cancel' %}</a>
            <button type="submit" class="btn-primary">{% trans 'Save' %}</button>
        </div>
    </form>
</div>
{% endblock %}
