{% extends 'sales/sales_base.html' %}
{% load static %}

{% block page_title %}
    {% if payment %}Editar Pago{% else %}Nuevo Pago{% endif %}
{% endblock %}

{% block page_actions %}
<a href="{% url 'sales:payment_list' %}" 
   class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
    </svg>
    Volver
</a>
{% endblock %}

{% block sales_content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="bg-white dark:bg-gray-800 shadow rounded-lg">
        <form method="post" class="p-6 space-y-6">
            {% csrf_token %}
            
            <!-- Payment Information -->
            <div>
                <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-4">Información del Pago</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="client" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Cliente <span class="text-red-500">*</span>
                        </label>
                        <select name="client" id="client" required
                                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                            <option value="">Seleccionar cliente</option>
                            {% for client in clients %}
                                <option value="{{ client.id }}" {% if payment.client.id == client.id %}selected{% endif %}>
                                    {{ client.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div>
                        <label for="invoice" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Factura (Opcional)
                        </label>
                        <select name="invoice" id="invoice"
                                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                            <option value="">Sin factura</option>
                            {% for invoice in invoices %}
                                <option value="{{ invoice.id }}" {% if payment.invoice.id == invoice.id %}selected{% endif %}>
                                    {{ invoice.number }} - ${{ invoice.total }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div>
                        <label for="payment_date" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Fecha de Pago <span class="text-red-500">*</span>
                        </label>
                        <input type="date" name="payment_date" id="payment_date" 
                               value="{{ payment.payment_date|date:'Y-m-d'|default:today }}" required
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                    </div>
                    
                    <div>
                        <label for="payment_method" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Método de Pago <span class="text-red-500">*</span>
                        </label>
                        <select name="payment_method" id="payment_method" required
                                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                            <option value="">Seleccionar método</option>
                            <option value="cash" {% if payment.payment_method == 'cash' %}selected{% endif %}>Efectivo</option>
                            <option value="bank_transfer" {% if payment.payment_method == 'bank_transfer' %}selected{% endif %}>Transferencia Bancaria</option>
                            <option value="credit_card" {% if payment.payment_method == 'credit_card' %}selected{% endif %}>Tarjeta de Crédito</option>
                            <option value="debit_card" {% if payment.payment_method == 'debit_card' %}selected{% endif %}>Tarjeta de Débito</option>
                            <option value="check" {% if payment.payment_method == 'check' %}selected{% endif %}>Cheque</option>
                            <option value="digital_wallet" {% if payment.payment_method == 'digital_wallet' %}selected{% endif %}>Billetera Digital</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="amount" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Monto <span class="text-red-500">*</span>
                        </label>
                        <input type="number" name="amount" id="amount" 
                               value="{{ payment.amount|default:'' }}" step="0.01" min="0" required
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                               placeholder="0.00">
                    </div>
                    
                    <div>
                        <label for="currency" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Moneda <span class="text-red-500">*</span>
                        </label>
                        <select name="currency" id="currency" required
                                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                            {% for currency in currencies %}
                                <option value="{{ currency.code }}" {% if payment.currency == currency.code or not payment %}selected{% endif %}>
                                    {{ currency.code }} - {{ currency.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div>
                        <label for="reference" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Referencia
                        </label>
                        <input type="text" name="reference" id="reference" 
                               value="{{ payment.reference|default:'' }}"
                               class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                               placeholder="Número de referencia, comprobante...">
                    </div>
                    
                    <div>
                        <label for="state" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Estado
                        </label>
                        <select name="state" id="state"
                                class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white">
                            <option value="draft" {% if payment.state == 'draft' or not payment %}selected{% endif %}>Borrador</option>
                            <option value="confirmed" {% if payment.state == 'confirmed' %}selected{% endif %}>Confirmado</option>
                            <option value="cancelled" {% if payment.state == 'cancelled' %}selected{% endif %}>Cancelado</option>
                        </select>
                    </div>
                </div>
                
                <div class="mt-6">
                    <label for="notes" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                        Notas
                    </label>
                    <textarea name="notes" id="notes" rows="3"
                              class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:text-white"
                              placeholder="Notas adicionales del pago">{{ payment.notes|default:'' }}</textarea>
                </div>
            </div>

            <!-- Form Actions -->
            <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200 dark:border-gray-700">
                <a href="{% url 'sales:payment_list' %}" 
                   class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 text-sm font-medium rounded-md text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Cancelar
                </a>
                <button type="submit"
                        class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-yellow-600 hover:bg-yellow-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500 transition-colors">
                    {% if payment %}
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        Actualizar Pago
                    {% else %}
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                        Crear Pago
                    {% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
