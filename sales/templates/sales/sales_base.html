{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
    <!-- Main Content -->
    <div>
        <!-- Top Navigation -->
        <div class="sticky top-0 z-40 bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700">
            <div class="flex items-center justify-between h-16 px-4 sm:px-6 lg:px-8">
                <div class="flex items-center">
                    <button id="open-sidebar" class="lg:hidden p-2 rounded-md text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="ml-4 lg:ml-0 text-xl font-semibold text-gray-900 dark:text-white">
                        {% block page_title %}{% endblock %}
                    </h1>
                </div>
                
                <div class="flex items-center space-x-4">
                    {% block page_actions %}{% endblock %}
                </div>
            </div>
        </div>

        <!-- Page Content -->
        <main class="flex-1">
            {% block sales_content %}{% endblock %}
        </main>
    </div>
</div>

<script>
// ... código JS de sidebar eliminado ...
</script>
{% endblock %}
