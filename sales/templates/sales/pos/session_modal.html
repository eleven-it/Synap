{% load static i18n %}
<div id="session-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 hidden">
    <div class="bg-white dark:bg-gray-900 rounded-lg shadow-lg w-full max-w-md p-6 relative">
        <button class="absolute top-2 right-2 text-gray-400 hover:text-gray-700 dark:hover:text-gray-200" onclick="closeSessionModal()">&times;</button>
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">{% trans 'Apertura/Cierre de Caja' %}</h3>
        <form id="session-form" method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">{% trans 'Saldo Inicial' %}</label>
                <input type="number" name="opening_amount" class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm" value="0" min="0" step="0.01">
            </div>
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">{% trans 'Usuario' %}</label>
                <input type="text" class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm" value="{{ user.nombre }}" readonly>
            </div>
            <div class="mb-4">
                <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">{% trans 'PIN de Seguridad' %}</label>
                <input type="password" name="user_pin" class="w-full px-3 py-2 rounded border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm">
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button class="px-4 py-2 rounded bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-semibold" onclick="closeSessionModal()">{% trans 'Cancelar' %}</button>
                <button class="px-4 py-2 rounded bg-gradient-to-r from-orange-400 to-orange-600 text-white font-semibold shadow hover:from-orange-500 hover:to-orange-700 transition" type="submit">{% trans 'Confirmar' %}</button>
            </div>
        </form>
    </div>
</div>
