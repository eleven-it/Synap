{% load static i18n %}
<div class="fixed bottom-4 right-4 z-40 flex flex-col gap-2">
    <div class="flex items-center gap-2 px-3 py-1 rounded bg-white dark:bg-gray-800 shadow border border-gray-200 dark:border-gray-700">
        <span class="material-icons text-green-500">print</span>
        <span class="text-xs text-gray-700 dark:text-gray-200">{% trans 'Impresora' %}: <span id="printer-status">OK</span></span>
    </div>
    <div class="flex items-center gap-2 px-3 py-1 rounded bg-white dark:bg-gray-800 shadow border border-gray-200 dark:border-gray-700">
        <span class="material-icons text-blue-500">scale</span>
        <span class="text-xs text-gray-700 dark:text-gray-200">{% trans 'Balanza' %}: <span id="scale-status">OK</span></span>
    </div>
    <div class="flex items-center gap-2 px-3 py-1 rounded bg-white dark:bg-gray-800 shadow border border-gray-200 dark:border-gray-700">
        <span class="material-icons text-purple-500">qr_code_scanner</span>
        <span class="text-xs text-gray-700 dark:text-gray-200">{% trans 'Lector' %}: <span id="scanner-status">OK</span></span>
    </div>
    <div class="flex items-center gap-2 px-3 py-1 rounded bg-white dark:bg-gray-800 shadow border border-gray-200 dark:border-gray-700">
        <span class="material-icons text-orange-500">credit_card</span>
        <span class="text-xs text-gray-700 dark:text-gray-200">{% trans 'Terminal EMV' %}: <span id="emv-status">OK</span></span>
    </div>
</div>
