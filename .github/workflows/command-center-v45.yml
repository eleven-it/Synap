name: Command Center V45

on:
  pull_request:
    paths:
      - ".github/workflows/command-center-v45.yml"
      - "reports/**"
  push:
    branches:
      - "codex/command-center-v45"
    paths:
      - ".github/workflows/command-center-v45.yml"
      - "reports/**"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install focused Python dependencies
        run: python -m pip install Django==4.2 djangorestframework mysqlclient==2.2.7
      - name: Run Command Center contract tests
        run: python reports/tests/run_command_center_ci.py
      - name: Check JavaScript syntax
        run: node --check reports/static/reports/js/command_center.js
