{% comment %}
  CTA pago: HTML exacto Stitch kiosk_active_cart_1. Contrato: irAPago().
{% endcomment %}
<div class="flex flex-col gap-3">
  <button type="button" class="w-full bg-primary hover:bg-blue-700 text-white font-black text-2xl py-6 rounded-xl shadow-lg shadow-primary/30 flex items-center justify-center gap-4 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-primary disabled:active:scale-100" x-on:click="irAPago()" x-bind:disabled="estado === 'paying' || !items || items.length === 0 || !!stockBlocked">
    <span class="material-symbols-outlined text-3xl">payments</span>
    Pagar ahora
  </button>
  <div class="grid grid-cols-3 gap-2">
    <button type="button" class="flex flex-col items-center justify-center gap-1 p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" x-on:click="toastMsg='Función en desarrollo'; toastOk=false; setTimeout(()=>{toastMsg=''}, 2500)">
      <span class="material-symbols-outlined text-slate-600 dark:text-slate-400">featured_seasonal_and_gifts</span>
      <span class="text-[10px] font-bold uppercase text-slate-600 dark:text-slate-300 text-center">Tarjeta Regalo</span>
    </button>
    <button type="button" class="flex flex-col items-center justify-center gap-1 p-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors" x-on:click="toastMsg='Llamando a un asistente…'; toastOk=true; setTimeout(()=>{toastMsg=''}, 2500)">
      <span class="material-symbols-outlined text-primary">support_agent</span>
      <span class="text-[10px] font-bold uppercase text-slate-600 dark:text-slate-300 text-center">Asistencia</span>
    </button>
    <button type="button" class="flex flex-col items-center justify-center gap-1 p-3 bg-red-50 dark:bg-red-900/20 border border-red-100 dark:border-red-900/30 rounded-lg hover:bg-red-100 transition-colors" x-on:click="cartId=null; items=[]; total=0; crearObtenerCarrito()">
      <span class="material-symbols-outlined text-red-500">cancel</span>
      <span class="text-[10px] font-bold uppercase text-red-600 text-center">Cancelar</span>
    </button>
  </div>
</div>
