{% comment %}
  Post-venta: HTML exacto Stitch administranet_pago_exitoso_y_ticket_digital.
  Inyección: comprobanteTexto, imprimirTicket(), mostrarReceipt, nuevaCompra().
{% endcomment %}
<main class="flex w-full flex-1 items-center justify-center p-6 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-primary/10 via-transparent to-transparent" x-show="estado === 'success'" x-cloak>
  <div class="flex flex-col items-center w-full max-w-2xl">
    <!-- Success Celebration Icon: HTML exacto Stitch -->
    <div class="mb-8 flex flex-col items-center">
      <div class="size-20 bg-primary rounded-full flex items-center justify-center text-white shadow-lg shadow-primary/20 mb-4">
        <span class="material-symbols-outlined text-5xl font-bold">check_circle</span>
      </div>
      <h1 class="text-4xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight">¡Pago realizado con éxito!</h1>
      <p class="text-slate-500 dark:text-slate-400 mt-2">Su transacción ha sido procesada correctamente.</p>
      <p class="mt-3 font-mono text-lg font-bold text-slate-800 dark:text-slate-200" x-text="comprobanteTexto"></p>
    </div>
    <!-- Action Buttons: HTML exacto Stitch (Enviar por Email → Ver comprobante, Imprimir → imprimirTicket) -->
    <div class="w-full max-w-2xl grid grid-cols-2 gap-4 mb-10">
      <button type="button" class="flex flex-col items-center justify-center gap-3 p-6 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl hover:border-primary hover:bg-primary/5 transition-all group" x-on:click="mostrarReceipt = true">
        <div class="size-12 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center group-hover:bg-primary/20">
          <span class="material-symbols-outlined text-slate-600 dark:text-slate-300 group-hover:text-primary">mail</span>
        </div>
        <span class="font-bold text-slate-800 dark:text-slate-200">Ver comprobante</span>
      </button>
      <button type="button" class="flex flex-col items-center justify-center gap-3 p-6 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl hover:border-primary hover:bg-primary/5 transition-all group" x-on:click="imprimirTicket()">
        <div class="size-12 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center group-hover:bg-primary/20">
          <span class="material-symbols-outlined text-slate-600 dark:text-slate-300 group-hover:text-primary">print</span>
        </div>
        <span class="font-bold text-slate-800 dark:text-slate-200">Imprimir Ticket Físico</span>
      </button>
    </div>
    <!-- Finalize: HTML exacto Stitch -->
    <div class="w-full max-w-md text-center">
      <button type="button" class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-5 px-8 rounded-xl text-xl shadow-lg shadow-primary/30 transition-all flex items-center justify-center gap-3 mb-4" x-on:click="nuevaCompra()">
        <span>Finalizar y Nueva Venta</span>
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
    </div>
  </div>
</main>
