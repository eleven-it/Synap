{% comment %}
  Banner de ofertas en el pie de la tarjeta kiosco. Solo visible en modo autoservicio (no TPV).
  Requiere Alpine: modoTpv, estado.
{% endcomment %}
<div x-show="!modoTpv && estado !== 'success'" x-cloak
     class="kiosk-promo-footer shrink-0 border-t border-amber-200/60 bg-amber-50/90 px-4 py-3 dark:border-amber-800/30 dark:bg-amber-950/25 sm:px-6 lg:px-8">
  <div class="mx-auto flex max-w-6xl items-start gap-3 sm:items-center sm:gap-4 md:gap-5">
    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-amber-500 text-white shadow-sm sm:h-12 sm:w-12 sm:rounded-2xl">
      <span class="material-symbols-outlined text-xl sm:text-2xl md:text-3xl">star</span>
    </div>
    <div class="min-w-0 flex-1">
      <h3 class="text-sm font-bold leading-snug text-amber-900 dark:text-amber-300 sm:text-base md:text-lg">¡Aprovecha nuestras ofertas!</h3>
      <p class="mt-0.5 text-xs leading-relaxed text-amber-800/90 dark:text-amber-200/80 sm:text-sm">Sigue agregando productos para obtener descuentos por volumen en marcas seleccionadas.</p>
    </div>
  </div>
</div>
