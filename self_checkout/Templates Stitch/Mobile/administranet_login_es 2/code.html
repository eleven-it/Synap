<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AdministraNET Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#191022",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden p-6">
<!-- Logo Section -->
<div class="mb-12 flex flex-col items-center">
<div class="mb-4 flex h-20 w-20 items-center justify-center rounded-xl bg-primary text-white shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-4xl">storefront</span>
</div>
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-[32px] font-bold leading-tight text-center">
                AdministraNET
            </h1>
</div>
<!-- Welcome Message -->
<div class="mb-8 text-center">
<h2 class="text-slate-900 dark:text-slate-100 text-[24px] font-bold leading-tight tracking-[-0.015em] mb-2">
                ¡Bienvenido!
            </h2>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal">
                Inicia sesión para continuar
            </p>
</div>
<!-- Login Form -->
<div class="w-full max-w-[400px] space-y-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium px-1">Correo Electrónico</label>
<div class="relative flex items-center">
<div class="absolute left-4 text-slate-400">
<span class="material-symbols-outlined text-[22px]">mail</span>
</div>
<input class="w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4 pl-12 pr-4 text-slate-900 dark:text-white shadow-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400" placeholder="ejemplo@correo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="text-slate-700 dark:text-slate-300 text-sm font-medium px-1">Contraseña</label>
<div class="relative flex items-center">
<div class="absolute left-4 text-slate-400">
<span class="material-symbols-outlined text-[22px]">lock</span>
</div>
<input class="w-full rounded-xl border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4 pl-12 pr-12 text-slate-900 dark:text-white shadow-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[22px]">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end px-1">
<a class="text-primary text-sm font-semibold hover:underline" href="#">
                    ¿Olvidaste tu contraseña?
                </a>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full rounded-xl bg-primary py-4 text-base font-bold text-white shadow-lg shadow-primary/25 hover:bg-primary/90 active:scale-[0.98] transition-all">
                    Iniciar Sesión
                </button>
</div>
</div>
<!-- Sign Up Footer -->
<div class="mt-12 text-center">
<p class="text-slate-600 dark:text-slate-400 text-sm">
                ¿No tienes una cuenta? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Regístrate</a>
</p>
</div>
<!-- Decorative elements for SaaS aesthetic -->
<div class="fixed top-[-10%] left-[-10%] -z-10 h-[40%] w-[40%] rounded-full bg-primary/5 blur-[100px]"></div>
<div class="fixed bottom-[-10%] right-[-10%] -z-10 h-[40%] w-[40%] rounded-full bg-primary/10 blur-[100px]"></div>
</div>
</body></html>
