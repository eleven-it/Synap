<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AdministraNET - Venta Exitosa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7f13ec",
                        "background-light": "#f7f6f8",
                        "background-dark": "#191022",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex h-screen w-full max-w-[430px] mx-auto flex-col bg-white dark:bg-background-dark overflow-hidden">
<!-- Top App Bar -->
<div class="flex items-center bg-white dark:bg-background-dark p-4 pb-2 justify-between border-b border-primary/5">
<div class="text-primary flex size-12 shrink-0 items-center justify-center cursor-pointer">
<span class="material-symbols-outlined text-3xl">close</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">AdministraNET</h2>
</div>
<!-- Main Content Area -->
<div class="flex flex-col items-center justify-center flex-grow p-6 text-center">
<!-- Success Icon with Glow -->
<div class="relative mb-8">
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full"></div>
<div class="relative flex items-center justify-center size-24 bg-primary text-white rounded-full shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-6xl">check_circle</span>
</div>
</div>
<!-- Transaction Details -->
<h1 class="text-primary tracking-tight text-[32px] font-bold leading-tight pb-2">¡Venta Exitosa!</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium mb-2 uppercase tracking-widest">Total Pagado</p>
<h1 class="text-slate-900 dark:text-slate-100 text-[48px] font-bold leading-none tracking-tight pb-8">$45.50</h1>
<!-- Digital Ticket Section -->
<div class="w-full max-w-sm">
<h4 class="text-primary text-sm font-bold leading-normal tracking-[0.015em] py-4">Enviar Ticket Digital</h4>
<div class="flex gap-4 mb-8">
<!-- WhatsApp Button -->
<button class="flex-1 flex flex-col items-center justify-center gap-2 p-4 bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-100 dark:border-emerald-900/50 rounded-xl transition-active active:scale-95">
<div class="size-10 bg-emerald-500 text-white rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">chat</span>
</div>
<span class="text-emerald-700 dark:text-emerald-400 font-semibold text-sm">WhatsApp</span>
</button>
<!-- Email Button -->
<button class="flex-1 flex flex-col items-center justify-center gap-2 p-4 bg-primary/5 dark:bg-primary/10 border border-primary/10 dark:border-primary/20 rounded-xl transition-active active:scale-95">
<div class="size-10 bg-primary text-white rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">mail</span>
</div>
<span class="text-primary font-semibold text-sm">Email</span>
</button>
</div>
</div>
</div>
<!-- Bottom Actions -->
<div class="p-6 space-y-3 bg-white dark:bg-background-dark border-t border-primary/5">
<!-- Print Button -->
<button class="w-full flex items-center justify-center gap-2 py-4 px-6 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold rounded-xl active:bg-slate-200 dark:active:bg-slate-700">
<span class="material-symbols-outlined">print</span>
                Imprimir Ticket
            </button>
<!-- New Sale Button -->
<button class="w-full flex items-center justify-center gap-2 py-4 px-6 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/25 active:bg-primary/90">
<span class="material-symbols-outlined">add_shopping_cart</span>
                Nueva Venta
            </button>
</div>
<!-- iOS Home Indicator (Visual Polish) -->
<div class="flex justify-center pb-2 bg-white dark:bg-background-dark">
<div class="h-1.5 w-32 bg-slate-200 dark:bg-slate-800 rounded-full"></div>
</div>
</div>
</body></html>
