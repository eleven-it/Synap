<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>AdministraNET - Confirmación de Envío Exitoso</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Main Background Content (Blurred) -->
<div class="layout-container flex h-full grow flex-col blur-sm select-none pointer-events-none">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-white dark:bg-background-dark px-10 py-3">
<div class="flex items-center gap-4">
<div class="text-primary">
<span class="material-symbols-outlined text-3xl">point_of_sale</span>
</div>
<h2 class="text-lg font-bold leading-tight tracking-tight">AdministraNET</h2>
</div>
<div class="flex gap-2">
<div class="flex h-10 w-10 items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800">
<span class="material-symbols-outlined">account_circle</span>
</div>
<div class="flex h-10 w-10 items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800">
<span class="material-symbols-outlined">help</span>
</div>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center p-10">
<div class="w-full max-w-4xl space-y-8">
<h1 class="text-3xl font-extrabold">Enviar Ticket</h1>
<div class="grid grid-cols-2 gap-8">
<div class="h-64 rounded-xl bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
<div class="space-y-4">
<div class="h-12 rounded-lg bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
<div class="h-12 rounded-lg bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
<div class="h-48 rounded-lg bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
</div>
</div>
</div>
</main>
</div>
<!-- Overlay Confirmation Modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-md px-4">
<div class="w-full max-w-[560px] transform overflow-hidden rounded-xl bg-white dark:bg-background-dark p-8 shadow-2xl transition-all">
<div class="flex flex-col items-center text-center">
<!-- Success Icon Wrapper -->
<div class="mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-green-100 dark:bg-green-900/30">
<span class="material-symbols-outlined text-6xl text-green-600 dark:text-green-400">check_circle</span>
</div>
<!-- Confirmation Content -->
<h3 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">
                        ¡Ticket enviado correctamente!
                    </h3>
<p class="text-lg text-slate-600 dark:text-slate-400 mb-8 max-w-sm">
                        El comprobante de su compra ha sido enviado exitosamente a <span class="font-semibold text-slate-900 dark:text-slate-200">[email/teléfono]</span>.
                    </p>
<!-- Success Card/Visual Confirmation -->
<div class="w-full mb-10 overflow-hidden rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 p-4">
<div class="flex items-center gap-4">
<div class="h-20 w-32 shrink-0 overflow-hidden rounded-lg bg-white shadow-sm border border-slate-100 dark:border-slate-800 flex items-center justify-center">
<img class="h-full w-full object-contain p-2" data-alt="Ilustración minimalista de un ticket digital" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDVq05JV-nwGrsycxxicmjvmYaD6pBj3TQ4SCKE-gxbYjPGzJXXfg5whMwzJmMcElqP7fao7FH-8Gg-m0X5SfgQI3QWiCyPGxjsFJzojIsYgG928vHJcQGNV1emfbe1WzPGk1Zx7wAlfNiG0VPk4AumFuyXs-0O9u-DgfhccLGtkOeSw6OTvtOmD0d8iusjJCT1FRRkijfJFR26OG3LUgbLjsUjws3rkHJNkjmNyMpFXPtdl1EIHkD7dqoA9MF_HGMmvp-Jz_2hTa0"/>
</div>
<div class="text-left">
<p class="text-xs font-bold uppercase tracking-wider text-slate-400">Resumen de envío</p>
<p class="text-sm font-medium text-slate-700 dark:text-slate-300">ID de Transacción: #POS-94821</p>
<p class="text-xs text-slate-500">Enviado: Hoy, 14:25 PM</p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex w-full flex-col gap-3">
<button class="flex w-full cursor-pointer items-center justify-center rounded-lg bg-primary px-6 py-4 text-lg font-bold text-white shadow-lg hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-colors">
<span>Finalizar sesión</span>
</button>
<button class="flex w-full cursor-pointer items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800 px-6 py-3 text-base font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
<span>Cerrar</span>
</button>
</div>
</div>
</div>
</div>
</div>
</body></html>
