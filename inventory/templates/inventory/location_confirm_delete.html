{% extends "inventory/inventory_base.html" %}

{% block inventory_content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">{{ title }}</h1>
    <p class="text-gray-600 mb-6">
        Are you sure you want to delete the location "<strong>{{ object.name }}</strong>" from warehouse "<strong>{{ object.warehouse.name }}</strong>"? This action cannot be undone.
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="flex justify-end space-x-4">
            <a href="{% url 'inventory:location_list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg">
                Cancel
            </a>
            <button type="submit" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg">
                Confirm Deletion
            </button>
        </div>
    </form>
</div>
{% endblock inventory_content %}
