{% extends "inventory/inventory_base.html" %}

{% block inventory_content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow text-center">
  <h1 class="text-2xl font-bold mb-4">{{ titulo }}</h1>
  
  <p class="text-gray-700 mb-6">¿Estás seguro de que quieres eliminar la brand "<strong>{{ object.name }}</strong>"? Esta acción no se puede deshacer.</p>

  <form method="post">
    {% csrf_token %}
    <div class="flex justify-center space-x-4">
      <a href="{% url 'inventory:brand_list' %}" class="btn-secondary">Cancelar</a>
      <button type="submit" class="btn-danger">
        Sí, eliminar
      </button>
    </div>
  </form>
</div>
{% endblock %}
