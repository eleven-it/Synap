{% extends "inventory/inventory_base.html" %}
{% load i18n %}

{% block inventory_content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-lg shadow text-center">
  <h1 class="text-xl font-bold mb-4">{% trans "Delete Brand" %}</h1>
  
  <p class="text-gray-700 mb-6">{% trans "Are you sure you want to delete this brand?" %} "<strong>{{ object.name }}</strong>"? Esta acción no se puede deshacer.</p>

  <form method="post">
    {% csrf_token %}
    <div class="flex justify-center space-x-4">
      <a href="{% url 'inventory:brand_list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-6 rounded-lg text-base">{% trans "Cancel" %}</a>
      <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg text-base">{% trans "Delete" %}</button>
    </div>
  </form>
</div>
{% endblock %}
