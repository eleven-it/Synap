{% load i18n %}
{% extends "inventory/inventory_base.html" %}

{% block inventory_content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-xl font-bold mb-4">{% trans "Delete Product" %}</h1>
    <p class="mb-6">{% trans "Are you sure you want to delete this product?" %}</p>
    <form method="post">
        {% csrf_token %}
        <div class="flex justify-end space-x-4">
            <a href="{% url 'inventory:product_list' %}" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-6 rounded-lg text-base">{% trans "Cancel" %}</a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg text-base">{% trans "Delete" %}</button>
        </div>
    </form>
</div>
{% endblock inventory_content %}
