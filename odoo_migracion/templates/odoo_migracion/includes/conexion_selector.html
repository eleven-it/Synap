{% load i18n %}
{# Selector de conexión para filtrar panel — GET conexion_id #}
{% if conexiones %}
<form method="get" class="mb-6 flex flex-wrap items-end gap-3 rounded-xl border border-gray-200/90 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800">
  <div class="min-w-[200px] flex-1">
    <label for="conexion_id" class="block text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">{% trans "Conexión Odoo" %}</label>
    <select name="conexion_id" id="conexion_id" class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-900" onchange="this.form.submit()">
      {% for c in conexiones %}
      <option value="{{ c.pk }}" {% if conexion_sel and conexion_sel.pk == c.pk %}selected{% endif %}>{{ c.nombre }} ({{ c.base_empresa }})</option>
      {% endfor %}
    </select>
  </div>
  {% if base_empresa %}
  <p class="text-sm text-gray-600 dark:text-gray-400">
    <span class="material-icons align-middle text-base text-gray-400" aria-hidden="true">storage</span>
    {% trans "Origen MySQL" %}: <strong>{{ base_empresa }}</strong>
  </p>
  {% endif %}
</form>
{% endif %}
