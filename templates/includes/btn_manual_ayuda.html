{% if variant == "hero" %}
<a href="{% url url_name %}{% if seccion %}#{{ seccion }}{% endif %}"
   target="_blank"
   rel="noopener noreferrer"
   class="inline-flex shrink-0 min-h-8 items-center gap-1.5 rounded-lg border border-slate-500 bg-slate-700 px-3 py-1.5 text-xs font-medium text-white shadow-sm transition-colors hover:bg-slate-600 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-800 dark:border-slate-500 dark:bg-slate-700 dark:text-white dark:hover:bg-slate-600{% if class_extra %} {{ class_extra }}{% endif %}"
   title="Abrir manual de ayuda">
  <span class="material-icons text-base leading-none" aria-hidden="true">help_outline</span>
  <span>{{ label|default:"Ayuda" }}</span>
</a>
{% else %}
<a href="{% url url_name %}{% if seccion %}#{{ seccion }}{% endif %}"
   target="_blank"
   rel="noopener noreferrer"
   class="inline-flex shrink-0 items-center gap-0.5 rounded text-xs font-medium text-slate-500 transition-colors hover:text-sky-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-500/40 dark:text-slate-400 dark:hover:text-sky-400{% if class_extra %} {{ class_extra }}{% endif %}"
   title="Abrir manual de ayuda">
  <span class="material-icons text-sm leading-none" aria-hidden="true">help_outline</span>
  <span>{{ label|default:"Ayuda" }}</span>
</a>
{% endif %}
