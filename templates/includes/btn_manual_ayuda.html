{# url_name, seccion (sin #), label opcional #}
<a href="{% url url_name %}{% if seccion %}#{{ seccion }}{% endif %}"
   target="_blank" rel="noopener noreferrer"
   class="inline-flex min-h-9 items-center justify-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 shadow-sm transition-colors hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-purple-500 focus-visible:ring-offset-2 dark:border-slate-600 dark:bg-gray-800 dark:text-slate-200 dark:hover:bg-slate-700 dark:focus-visible:ring-offset-gray-900 sm:text-sm{% if class_extra %} {{ class_extra }}{% endif %}"
   title="Abrir manual de ayuda">
  <span class="material-icons text-base sm:text-lg" aria-hidden="true">help_outline</span>
  {{ label|default:"Ayuda" }}
</a>
