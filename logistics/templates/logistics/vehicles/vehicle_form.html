{% extends 'base.html' %}
{% load i18n crispy_forms_tags %}

{% block content %}
<div class="p-4 md:p-6 lg:p-8 max-w-xl mx-auto">
    <h1 class="text-lg font-semibold mb-4">{% if form.instance.pk %}{% trans 'Edit Vehicle' %}{% else %}{% trans 'Add Vehicle' %}{% endif %}</h1>
    <form method="post" class="bg-white dark:bg-gray-900 rounded shadow p-4 space-y-4">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">{% trans 'Save' %}</button>
            <a href="{% url 'logistics:vehicle_list' %}" class="btn btn-secondary">{% trans 'Cancel' %}</a>
        </div>
    </form>
</div>
{% endblock %}
